ой ученици.","solution":"(2·1+3·2+4·4+5·2+6·1):10=40:10=4.","alt":[],"visual":""},{"q":"Дадено е разпределението на 30 ученици по брой прочетени книги за месец: 0 книги — 3 ученици, 1 книга — 10 ученици, 2 книги — 12 ученици, 3 книги — 5 ученици. Намерете общия брой ученици.","answer":"30","hint":"Събери честотите.","solution":"3+10+12+5=30.","alt":[],"visual":""},{"q":"Успехът на учениците в клас (общо 80) е даден в таблица: Слаб — 4, Среден — 16, Добър — 24, Мн. добър — 20, Отличен — 16. Какъв процент от учениците имат оценка „Отличен“?","answer":"20%","hint":"Разделете броя ученици с тази оценка на общия брой и умножете по 100%.","solution":"16:80=0,2=20%.","alt":["20"],"visual":""}],"medium":[{"q":"Дадени са оценките 3, 4, 4, 5, 5, 5, 6. Намерете средния успех и закръглете резултата до стотни.","answer":"4,57","hint":"Събери оценките и раздели на броя им.","solution":"(3+4+4+5+5+5+6):7=32/7≈4,57.","alt":["4.57"],"visual":""},{"q":"Успехът на учениците в клас (общо 120) е: Слаб — 0, Среден — 12, Добър — 30, Мн. добър — 36, Отличен — 42 (оценките отговарят на 2,3,4,5,6). Намерете средния успех на класа с точност до стотни.","answer":"4,90","hint":"Умножете всяка оценка по броя ученици с нея, съберете и разделете на 120.","solution":"(0·2+12·3+30·4+36·5+42·6):120=588:120=4,90.","alt":["4.90","4.9","4,9"],"visual":""},{"q":"В партида от 90 изделия съотношението на изделията I : II : III качество е 6 : 5 : 4. Колко от изделията са II качество?","answer":"30","hint":"Съберете частите от отношението, намерете стойността на една част (90 разделено на сбора), после умножете по съответната част.","solution":"6+5+4=15 части; 90:15=6 на част; II качество = 5·6=30 изделия.","alt":[],"visual":""},{"q":"Дадени са оценките 4, 5, 5, 6, 6, 3. Намерете средния успех и закръглете резултата до стотни.","answer":"4,83","hint":"Събери оценките и раздели на броя им.","solution":"(4+5+5+6+6+3):6=29/6≈4,83.","alt":["4.83"],"visual":""},{"q":"В партида от 150 изделия съотношението на изделията I : II : III качество е 7 : 5 : 3. Колко от изделията са I качество?","answer":"70","hint":"Съберете частите от отношението, намерете стойността на една част (150 разделено на сбора), после умножете по съответната част.","solution":"7+5+3=15 части; 150:15=10 на част; I качество = 7·10=70 изделия.","alt":[],"visual":""}],"hard":[{"q":"От 40 ученици 6 имат оценка 3, 14 — оценка 4, 12 — оценка 5, останалите — оценка 6. Колко процента имат оценка 6?","answer":"20","hint":"Първо намери оставащия брой ученици.","solution":"40−6−14−12=8; 8/40=20%.","alt":[],"visual":""},{"q":"200 гуми се разпределят по вид (14, 15, 16, 17 цола) в отношение 7 : 10 : 5 : 3, а цените за смяна са съответно 8, 12, 14 и 16 лв. Намерете общите приходи за деня (в лв.).","answer":"2352","hint":"Първо намерете броя гуми от всеки вид, после умножете всеки брой по съответната цена и съберете.","solution":"7+10+5+3=25 части. 200:25=8 гуми на една част. Броят на гумите е съответно 7·8=56, 10·8=80, 5·8=40 и 3·8=24. 56·8+80·12+40·14+24·16=448+960+560+384=2352 лв.","alt":[],"visual":""},{"q":"На пробен изпит по математика оценките на учениците са разпределени по проценти: Слаб — 10%, Среден — 20%, Добър — 30%, Мн. добър — 25%, Отличен — 15%. Ако учениците със „Слаб“ са с 16 по-малко от тези със „Среден“, колко ученици общо са се явили на изпита?","answer":"160","hint":"Разликата между процентите „Среден“ и „Слаб“ отговаря точно на 16 ученици — намерете каква част от всички е 1%.","solution":"(20%−10%)·N=16 ⇒ 10%·N=16 ⇒ N=160.","alt":[],"visual":""},{"q":"От 60 ученици 10 имат оценка 3, 20 — оценка 4, 15 — оценка 5, останалите — оценка 6. Колко процента имат оценка 6?","answer":"25","hint":"Първо намери оставащия брой ученици.","solution":"60−10−20−15=15; 15/60=25%.","alt":[],"visual":""},{"q":"На олимпиада по математика оценките на учениците са разпределени по проценти: Слаб — 10%, Среден — 15%, Добър — 30%, Мн. добър — 25%, Отличен — 20%. Ако учениците с „Отличен“ са с 12 повече от тези със „Слаб“, колко ученици общо са се явили на олимпиадата?","answer":"120","hint":"Разликата между процентите „Отличен“ и „Слаб“ отговаря точно на 12 ученици — намерете каква част от всички е 1%.","solution":"(20%−10%)·N=12 ⇒ 10%·N=12 ⇒ N=120.","alt":[],"visual":""}]},"skill2":{"easy":[{"q":"На сектор от кръгова диаграма съответстват 25% от данните. Намерете големината на централния ъгъл на сектора.","answer":"90","hint":"100% съответстват на 360°, следователно 1% е 3,6°.","solution":"25·3,6°=90°.","alt":[],"visual":"<svg viewBox=\"0 0 310 155\" role=\"img\" aria-label=\"Кръгова диаграма\"><circle cx=\"95\" cy=\"75\" r=\"58\"/><path class=\"slice\" d=\"M 95 75 L 95 17 A 58 58 0 0 1 153.0 75.0 Z\"/><text x=\"178\" y=\"66\">оцветен сектор</text><text x=\"178\" y=\"91\">25% от кръга</text></svg>"},{"q":"Резултатите от изпит на 450 ученици са разпределени в пет категории с отношение 5 : 4 : 2 : 1 : 3. Колко градуса е централният ъгъл на сектора, отговарящ на частта „1“?","answer":"24","hint":"Сборът на частите отговаря на 360° — намерете градусите за 1 част.","solution":"5+4+2+1+3=15 части; 360°:15=24° за 1 част.","alt":["24°"],"visual":""},{"q":"Резултатите от изпит на 450 ученици са разпределени в пет категории с отношение 5 : 4 : 2 : 1 : 3. Колко градуса е централният ъгъл на сектора, отговарящ на частта „3“?","answer":"72","hint":"Намерете градусите за 1 част (360° разделено на сбора от частите), после умножете по 3.","solution":"1 част = 24°; 3 части = 3·24°=72°.","alt":["72°"],"visual":""},{"q":"На сектор от кръгова диаграма съответстват 40% от данните. Намерете големината на централния ъгъл на сектора.","answer":"144","hint":"100% съответстват на 360°, следователно 1% е 3,6°.","solution":"40·3,6°=144°.","alt":[],"visual":"<svg viewBox=\"0 0 310 155\" role=\"img\" aria-label=\"Кръгова диаграма\"><circle cx=\"95\" cy=\"75\" r=\"58\"/><path class=\"slice\" d=\"M 95 75 L 95 17 A 58 58 0 0 1 129.1 121.9 Z\"/><text x=\"178\" y=\"66\">оцветен сектор</text><text x=\"178\" y=\"91\">40% от кръга</text></svg>"},{"q":"Резултатите от анкета сред 360 ученици са разпределени в четири категории с отношение 4 : 3 : 2 : 1. Колко градуса е централният ъгъл на сектора, отговарящ на частта „1“?","answer":"36","hint":"Сборът на частите отговаря на 360° — намерете градусите за 1 част.","solution":"4+3+2+1=10 части; 360°:10=36° за 1 част.","alt":["36°"],"visual":""}],"medium":[{"q":"Оцветеният сектор представлява 35% от данните в кръговата диаграма. Намерете големината на централния му ъгъл.","answer":"126","hint":"Умножи процента по 3,6°.","solution":"Централният ъгъл е 126°.","alt":[],"visual":"<svg viewBox=\"0 0 310 155\" role=\"img\" aria-label=\"Кръгова диаграма\"><circle cx=\"95\" cy=\"75\" r=\"58\"/><path class=\"slice\" d=\"M 95 75 L 95 17 A 58 58 0 0 1 141.9 109.1 Z\"/><text x=\"178\" y=\"66\">оцветен сектор</text><text x=\"178\" y=\"91\">35% от кръга</text></svg>"},{"q":"Работниците на строителен обект се разпределят в отношение технически ръководители : строителни работници : инженери = 7 : 10 : 3. Какъв процент от всички работници са инженери?","answer":"15%","hint":"Съберете всички части от отношението и изразете частта на инженерите като процент от общия сбор.","solution":"7+10+3=20 части; инженерите са 3/20=15%.","alt":["15"],"visual":""},{"q":"В партида от 90 изделия съотношението I : II : III качество е 6 : 5 : 4. Колко градуса е централният ъгъл на сектора „I качество“ в съответната кръгова диаграма?","answer":"144","hint":"Намерете каква част (в градуси) от 360° отговаря на 1 от 15-те части.","solution":"90 изделия = 15 части ⇒ 1 част = 6 изделия; I качество = 6 части = 36 изделия ⇒ ъгъл = (36/90)·360°=144°.","alt":["144°"],"visual":""},{"q":"Оцветеният сектор представлява 55% от данните в кръговата диаграма. Намерете големината на централния му ъгъл.","answer":"198","hint":"Умножи процента по 3,6°.","solution":"Централният ъгъл е 198°.","alt":[],"visual":"<svg viewBox=\"0 0 310 155\" role=\"img\" aria-label=\"Кръгова диаграма\"><circle cx=\"95\" cy=\"75\" r=\"58\"/><path class=\"slice\" d=\"M 95 75 L 95 17 A 58 58 0 1 1 77.1 130.2 Z\"/><text x=\"178\" y=\"66\">оцветен сектор</text><text x=\"178\" y=\"91\">55% от кръга</text></svg>"},{"q":"Учениците в училище се разпределят по извънкласни дейности в отношение спорт : изкуство : наука = 8 : 5 : 7. Какъв процент от всички ученици участват в дейност „наука“?","answer":"35%","hint":"Съберете всички части от отношението и изразете частта на „наука“ като процент от общия сбор.","solution":"8+5+7=20 части; наука=7/20=35%.","alt":["35"],"visual":""}],"hard":[{"q":"В кръговата диаграма оцветеният сектор представлява 15% от общо 120 ученици. Колко ученици са представени чрез този сектор?","answer":"18","hint":"Намери дадения процент от общия брой.","solution":"15% от 120 = 18 ученици.","alt":[],"visual":"<svg viewBox=\"0 0 310 155\" role=\"img\" aria-label=\"Кръгова диаграма\"><circle cx=\"95\" cy=\"75\" r=\"58\"/><path class=\"slice\" d=\"M 95 75 L 95 17 A 58 58 0 0 1 141.9 40.9 Z\"/><text x=\"178\" y=\"66\">оцветен сектор</text><text x=\"178\" y=\"91\">15% от кръга</text></svg>"},{"q":"В кръговата диаграма оцветеният сектор представлява 30% от общо 120 ученици. Колко ученици са представени чрез този сектор?","answer":"36","hint":"Намери дадения процент от общия брой.","solution":"30% от 120 = 36 ученици.","alt":[],"visual":"<svg viewBox=\"0 0 310 155\" role=\"img\" aria-label=\"Кръгова диаграма\"><circle cx=\"95\" cy=\"75\" r=\"58\"/><path class=\"slice\" d=\"M 95 75 L 95 17 A 58 58 0 0 1 150.2 92.9 Z\"/><text x=\"178\" y=\"66\">оцветен сектор</text><text x=\"178\" y=\"91\">30% от кръга</text></svg>"},{"q":"В кръговата диаграма оцветеният сектор представлява 40% от общо 120 ученици. Колко ученици са представени чрез този сектор?","answer":"48","hint":"Намери дадения процент от общия брой.","solution":"40% от 120 = 48 ученици.","alt":[],"visual":"<svg viewBox=\"0 0 310 155\" role=\"img\" aria-label=\"Кръгова диаграма\"><circle cx=\"95\" cy=\"75\" r=\"58\"/><pa /* Всяка гара използва общ генератор: избира псевдослучаен елемент от банката задачи
   за дадените умение (skill) и ниво на трудност (difficulty), чрез хеш от runSeed. */
function makeStationFactory(stationId){
  return function(skill,difficulty,n){
    const list = TASK_BANK[stationId][skill][difficulty];
    return choose(list, n);
  };
}
const TASK_FACTORIES = {};
for(let __i=1; __i<=18; __i++){ TASK_FACTORIES[__i] = makeStationFactory(__i); }


function getProgress(stationId){
  if(!state.stationProgress[stationId]){
    state.stationProgress[stationId]={correct:0,attempts:0,serial:0,currentTask:null,history:[],pendingRemediation:false,taskSolved:false,hintsUsed:0,skillOrder:shuffledSkills(stationId),
      /* поле за защита срещу блокиране на дефектна задача (не участва в точкуването/адаптивността) */
      wrongStreak:0,blockedHelpDismissed:false,forcedAdvances:0,skippedProblemCount:0};
  }
  return state.stationProgress[stationId];
}
/* ---- помощни функции за идентификация на конкретен вариант в TASK_BANK (гара:умение:ниво:индекс) ---- */
function taskListFor(stationId,skillKey,level){
  return (TASK_BANK[stationId] && TASK_BANK[stationId][skillKey] && TASK_BANK[stationId][skillKey][level]) || [];
}
function taskIndexOf(stationId,skillKey,level,taskObj){
  return taskListFor(stationId,skillKey,level).indexOf(taskObj);
}
function taskIdOf(stationId,skillKey,level,taskObjOrIndex){
  const idx = typeof taskObjOrIndex==='number' ? taskObjOrIndex : taskIndexOf(stationId,skillKey,level,taskObjOrIndex);
  return `${stationId}:${skillKey}:${level}:${idx}`;
}
function resetTaskAttemptFlags(progress){
  progress.wrongStreak=0;
  progress.blockedHelpDismissed=false;
  progress.pendingRemediation=false;
  progress.taskSolved=false;
}
function nextTaskFor(station,forceSimilar){
  const progress=getProgress(station.id);
  const skillIndex=Math.min(progress.correct+(progress.forcedAdvances||0),TASKS_PER_STATION-1);
  const skillKey=progress.skillOrder[skillIndex];
  const factory=TASK_FACTORIES[station.id];
  const previousQuestion=progress.currentTask && progress.currentTask.q;
  let candidate=null;
  let safety=0;
  do{
    const variant=hashNumber(state.runSeed,station.id,skillKey,progress.serial++);
    candidate=factory ? factory(skillKey,state.level,variant) : makeTask('Задачата не е налична.','', '','');
    safety++;
  }while(safety<12 && (
    (forceSimilar && candidate.q===previousQuestion) ||
    state.skippedProblemTaskIds.has(taskIdOf(station.id,skillKey,state.level,candidate))
  ));
  candidate.skillKey=skillKey;
  candidate.skillLabel=(SKILL_LABELS[station.id]||[])[SKILL_KEYS.indexOf(skillKey)]||'Математическо умение';
  candidate.taskId=taskIdOf(station.id,skillKey,state.level,candidate);
  state.seenTaskIds.add(candidate.taskId);
  progress.currentTask=candidate;
  resetTaskAttemptFlags(progress);
  return progress.currentTask;
}
/* Избира друг наличен вариант от същото умение/ниво за защитата срещу блокиране (виж markCurrentTaskProblem).
   Предпочита вариант, който още не е показван в тази сесия; никога не връща вече маркиран като проблемен
   или текущия вариант. Връща null, ако няма никакъв друг наличен вариант. */
function pickReplacementTask(station,skillKey,level,currentTask){
  const list = taskListFor(station.id,skillKey,level);
  const currentIndex = taskIndexOf(station.id,skillKey,level,currentTask);
  const candidates=[];
  for(let idx=0; idx<list.length; idx++){
    if(idx===currentIndex) continue;
    const id=taskIdOf(station.id,skillKey,level,idx);
    if(state.skippedProblemTaskIds.has(id)) continue;
    candidates.push({idx,id});
  }
  if(!candidates.length) return null;
  const unseen = candidates.filter(c=>!state.seenTaskIds.has(c.id));
  const pool = unseen.length ? unseen : candidates;
  const progress=getProgress(station.id);
  const pick = pool[hashNumber(state.runSeed,station.id,skillKey,level,'skip',progress.serial++) % pool.length];
  return {task:list[pick.idx], index:pick.idx, id:pick.id};
}

/* =========================================================
   АВТОМАТИЧНО ЗАПАЗВАНЕ НА ПРОГРЕСА (localStorage) — само в браузъра на ученика,
   не се изпраща никъде. Пази се само реален игрови прогрес (ниво, гари, история,
   защита срещу блокиране), никога преходни/визуални състояния (отворен модал,
   подсказка, чернова и т.н.).
   ========================================================= */
const SAVE_KEY='portal8_saved_game_v1';
const SAVE_VERSION=1;
/* Намира реалния обект на задачата от TASK_BANK по нейния стабилен taskId
   (гара:умение:ниво:индекс) — НЕ разчита на идентичност на обект (тя се губи
   при JSON.stringify/parse), а на директно търсене по индекс в TASK_BANK.
   Връща същия споделен обект, какъвто ползва останалата логика на играта, и
   го тагва отново с skillKey/skillLabel/taskId, за да работят коректно
   taskIndexOf/taskIdOf и защитата срещу блокиране след възстановяване. */
function taskByTaskId(taskId){
  if(!taskId || typeof taskId!=='string') return null;
  const parts=taskId.split(':');
  if(parts.length!==4) return null;
  const stationId=Number(parts[0]);
  const skillKey=parts[1];
  const level=parts[2];
  const idx=Number(parts[3]);
  if(!Number.isFinite(stationId) || !Number.isFinite(idx) || idx<0) return null;
  const list=taskListFor(stationId,skillKey,level);
  const task=list[idx];
  if(!task) return null;
  task.skillKey=skillKey;
  task.skillLabel=(SKILL_LABELS[stationId]||[])[SKILL_KEYS.indexOf(skillKey)]||'Математическо умение';
  task.taskId=taskIdOf(stationId,skillKey,level,idx);
  return task;
}
function serializeStationProgress(){
  const out={};
  for(const stId in state.stationProgress){
    const p=state.stationProgress[stId];
    out[stId]={
      correct:p.correct, attempts:p.attempts, serial:p.serial,
      currentTaskId:p.currentTask ? p.currentTask.taskId : null,
      history:p.history, pendingRemediation:p.pendingRemediation, taskSolved:p.taskSolved,
      hintsUsed:p.hintsUsed, skillOrder:p.skillOrder, wrongStreak:p.wrongStreak,
      blockedHelpDismissed:p.blockedHelpDismissed, forcedAdvances:p.forcedAdvances,
      skippedProblemCount:p.skippedProblemCount
    };
  }
  return out;
}
function deserializeStationProgress(saved){
  const out={};
  if(!saved || typeof saved!=='object') return out;
  for(const stId in saved){
    const p=saved[stId]||{};
    let currentTask=null;
    if(p.currentTaskId) currentTask=taskByTaskId(p.currentTaskId);
    const stationIdNum=Number(stId);
    out[stId]={
      correct:Number(p.correct)||0, attempts:Number(p.attempts)||0, serial:Number(p.serial)||0,
      currentTask, history:Array.isArray(p.history)?p.history:[],
      pendingRemediation:!!p.pendingRemediation, taskSolved:!!p.taskSolved,
      hintsUsed:Number(p.hintsUsed)||0,
      skillOrder:(Array.isArray(p.skillOrder) && p.skillOrder.length===SKILL_KEYS.length) ? p.skillOrder : shuffledSkills(stationIdNum),
      wrongStreak:Number(p.wrongStreak)||0, blockedHelpDismissed:!!p.blockedHelpDismissed,
      forcedAdvances:Number(p.forcedAdvances)||0, skippedProblemCount:Number(p.skippedProblemCount)||0
    };
  }
  return out;
}
/* Извиква се след всяка съществена промяна в игровия прогрес (виж местата на извикване по-долу).
   Не пази нищо, ако играта не е стартирана (state.level е null). */
function saveGameProgress(){
  if(!state.level) return;
  try{
    const payload={
      version:SAVE_VERSION,
      playerName:state.playerName,
      level:state.level,
      runSeed:state.runSeed,
      currentIndex:state.currentIndex,
      results:state.results,
      stationProgress:serializeStationProgress(),
      seenTaskIds:Array.from(state.seenTaskIds),
      skippedProblemTaskIds:Array.from(state.skippedProblemTaskIds),
      skippedTasksLog:state.skippedTasksLog,
      savedAt:Date.now()
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(payload));
  }catch(e){ /* localStorage недостъпен (частен режим, квота) — просто без запазване */ }
}
/* Чете и валидира запазения прогрес. При повреден/непълен/остарял запис го изтрива
   и връща null, вместо да блокира приложението. */
function loadGameProgress(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const data=JSON.parse(raw);
    if(!data || typeof data!=='object' || data.version!==SAVE_VERSION){ localStorage.removeItem(SAVE_KEY); return null; }
    if(!data.level || !LEVEL_META[data.level]){ localStorage.removeItem(SAVE_KEY); return null; }
    if(typeof data.results!=='object' || typeof data.stationProgress!=='object'){ localStorage.removeItem(SAVE_KEY); return null; }
    return data;
  }catch(e){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e2){}
    return null;
  }
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const CYRILLIC_TO_LATIN = {'а':'a','в':'b','к':'k','х':'x','у':'y','с':'c','е':'e','о':'o','р':'p','м':'m','т':'t','н':'h'};
function isMultiValueRaw(raw){
  // конвенция за записване на верните отговори: няколко решения се разделят със запетая,
  // ПОСЛЕДВАНА ОТ ИНТЕРВАЛ (напр. "0, 3" = две решения); единично десетично число се пише
  // без интервал след запетаята (напр. "7,2"). Ползва се, за да не се бърка "0,3" (0 и 3)
  // с десетичното 0,3 — проверката по-долу решава по този признак КАК да третира запетаята,
  // общо за цялото ниво (и за верния отговор, и за въведеното от ученика), а не по отделни задачи.
  return /,\s/.test(String(raw));
}
function normalize(str, skipDecimalComma){
  if(str===undefined||str===null) return '';
  let s = String(str).trim().toLowerCase();
  s = s.replace(/−/g,'-').replace(/∞/g,'inf').replace(/≥/g,'>=').replace(/≤/g,'<=');
  if(!skipDecimalComma && /^[+-]?\d+,\d+$/.test(s)) s = s.replace(',','.'); // десетична запетая само когато целият отговор е едно десетично число и нивото не е от тип "няколко решения"
  s = s.replace(/\s+/g,'');
  s = s.replace(/%/g,'');
  s = s.replace(/°/g,'');
  s = s.replace(/(?:cm|km|kg|лв|h)$/g,'');
  s = s.replace(/[абвгдежзийклмнопрстуфхцчшщъьюя]/g, ch => CYRILLIC_TO_LATIN[ch] || ch);
  s = s.replace(/⁰/g,'0').replace(/¹/g,'1').replace(/²/g,'2').replace(/³/g,'3')
       .replace(/⁴/g,'4').replace(/⁵/g,'5').replace(/⁶/g,'6').replace(/⁷/g,'7')
       .replace(/⁸/g,'8').replace(/⁹/g,'9');
  s = s.replace(/\^/g,'');
  s = s.replace(/[·*]/g,'');
  return s;
}
function parseNumberOrFraction(s){
  if(/^[+-]?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  let m = s.match(/^([+-]?\d+)\/(\d+)$/);
  if(m) return parseFloat(m[1])/parseFloat(m[2]);
  return null;
}
function termsOf(s){
  let str = (s[0]==='+'||s[0]==='-') ? s : '+'+s;
  return (str.match(/[+-][^+-]+/g) || []).sort();
}
function factorsOf(s){
  // разпознава низ, съставен изцяло от последователни множители в скоби, напр. "(a-b+c)(a-b-c)"
  if(!/^(\([^()]*\))+$/.test(s)) return null;
  return (s.match(/\([^()]*\)/g) || []).slice().sort();
}
function checkAnswer(userRaw, level){
  let rawList = [level.answer].concat(level.alt||[]);
  let isMulti = rawList.some(isMultiValueRaw); // определя се веднъж, общо за нивото — прилага се еднакво към верния отговор и към отговора на ученика
  let accepted = rawList.map(a => normalize(a, isMulti));
  let user = normalize(userRaw, isMulti);
  if(user==='') return false;
  if(accepted.includes(user)) return true;

  // числово сравнение
  let uNum = parseNumberOrFraction(user);
  for(const acc of accepted){
    let aNum = parseNumberOrFraction(acc);
    if(uNum!==null && aNum!==null && Math.abs(uNum-aNum)<0.01) return true;
  }
  // множества от отговори, разделени със запетая (ред без значение)
  for(const acc of accepted){
    if(acc.includes(',') || user.includes(',')){
      let aArr = acc.split(',');
      let uArr = user.split(',');
      if(aArr.length===uArr.length){
        let aSorted = aArr.slice().sort().join(',');
        let uSorted = uArr.slice().sort().join(',');
        if(aSorted===uSorted) return true;
        let aNums = aArr.map(parseNumberOrFraction).filter(v=>v!==null).sort((a,b)=>a-b);
        let uNums = uArr.map(parseNumberOrFraction).filter(v=>v!==null).sort((a,b)=>a-b);
        if(aNums.length===aArr.length && uNums.length===uArr.length && aNums.every((v,i)=>Math.abs(v-uNums[i])<0.01)) return true;
      }
    }
  }
  // сравнение на полиноми по членове (независимо от подредбата)
  for(const acc of accepted){
    let at = termsOf(acc), ut = termsOf(user);
    if(at.length>1 && at.length===ut.length && at.join('|')===ut.join('|')) return true;
  }
  // сравнение на произведение от множители в скоби (независимо от реда на множителите)
  for(const acc of accepted){
    let af = factorsOf(acc), uf = factorsOf(user);
    if(af && uf && af.length>1 && af.length===uf.length && af.join('|')===uf.join('|')) return true;
  }
  return false;
}

const RESULT_CODE_SALT = 'portal8-rezultat-v1';
function base36pad(num, width){
  return num.toString(36).toUpperCase().padStart(width,'0');
}
function buildResultCode(){
  const levelMap = {easy:'A', medium:'B', hard:'C'};
  const levelChar = levelMap[state.level] || 'A';
  const stationDigits = STATIONS.map(st => String((state.results[st.id] && state.results[st.id].correct) || 0)).join('');
  const attemptsTotal = STATIONS.reduce((sum,st)=> sum + ((state.results[st.id] && state.results[st.id].attempts) || 0), 0);
  const now = new Date();
  const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const payload = levelChar + stationDigits + base36pad(Math.min(attemptsTotal,46655),3) + dateStr;
  const checksum = base36pad(hashNumber(RESULT_CODE_SALT, payload) % 1679616, 4);
  const raw = payload + checksum;
  return raw.match(/.{1,6}/g).join('-');
}
function verifyResultCode(codeRaw){
  const clean = String(codeRaw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(clean.length !== 34) return {valid:false};
  const levelChar = clean.slice(0,1);
  const stationDigits = clean.slice(1,19);
  const attemptsPart = clean.slice(19,22);
  const dateStr = clean.slice(22,30);
  const checksum = clean.slice(30,34);
  const payload = levelChar + stationDigits + attemptsPart + dateStr;
  const expected = base36pad(hashNumber(RESULT_CODE_SALT, payload) % 1679616, 4);
  if(expected !== checksum || !/^[0-3]+$/.test(stationDigits)) return {valid:false};
  const levelNames = {A:'Лесно', B:'Средно', C:'Трудно'};
  const digits = stationDigits.split('').map(Number);
  const correctTotal = digits.reduce((a,b)=>a+b,0);
  const attemptsTotalDec = parseInt(attemptsPart,36);
  const dateFmt = `${dateStr.slice(6,8)}.${dateStr.slice(4,6)}.${dateStr.slice(0,4)}`;
  return {
    valid:true,
    level: levelNames[levelChar] || '—',
    correctTotal, totalTasks: STATIONS.length*TASKS_PER_STATION,
    attemptsTotal: attemptsTotalDec, date: dateFmt,
    perStation: STATIONS.map((st,i)=>({title:st.title, correct:digits[i]}))
  };
}

function readSoundPref(){
  try{ return localStorage.getItem('portal8-sound') !== '0'; }catch(e){ return true; }
}
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function playTone(freq,start,duration,type,gainPeak){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type||'triangle';
  osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(gainPeak||0.16,t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+duration);
  osc.start(t0); osc.stop(t0+duration+0.03);
}
function playCorrectSound(){
  if(!state.soundOn) return;
  playTone(660,0,0.12);
  playTone(880,0.09,0.16);
  playTone(1320,0.18,0.24);
}

  if(!state.soundOn) return;

function initMathKeyboardDrag(){
  const kb=document.getElementById('math-keyboard');
  const handle=document.getElementById('math-keyboard-handle');
  if(!kb || !handle) return;
  let dragging=false, dx=0, dy=0;
  const move=(e)=>{
    if(!dragging) return;
    const maxX=Math.max(4,window.innerWidth-kb.offsetWidth-4);
    const maxY=Math.max(4,window.innerHeight-kb.offsetHeight-4);
    const left=Math.min(maxX,Math.max(4,e.clientX-dx));
    const top=Math.min(maxY,Math.max(4,e.clientY-dy));
    kb.style.left=left+'px'; kb.style.top=top+'px'; kb.style.right='auto'; kb.style.bottom='auto';
  };
  const up=()=>{
    dragging=false;
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
  };
  handle.addEventListener('pointerdown',(e)=>{
    if(e.target.closest('button')) return;
    const r=kb.getBoundingClientRect();
    dx=e.clientX-r.left; dy=e.clientY-r.top;
    dragging=true;
    handle.setPointerCapture?.(e.pointerId);
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    e.preventDefault();
  });
}

    <button class="btn" data-action="start-game" ${state.level?'':'disabled'}>🚪 Влез в портала</button>
  </div>
  <footer class="note">18 гари · ${TASKS_PER_STATION} верни задачи на гара</footer>
  <div class="start-actions" style="margin-top:6px;">
    <button class="btn ghost" data-action="open-verify">🧑‍🏫 За учителя: проверка на код за резултат</button>
  </div>
  ${renderResourceCredit()}
  `;
}

function renderMap(){
  const rows = STATIONS.map((st, idx)=>{
    const result = state.results[st.id];
    const isCurrent = idx===state.currentIndex && !result;
    const locked = idx>state.currentIndex;
    let cls='station-node';
    if(locked) cls+=' locked';
    else if(isCurrent) cls+=' current';
    if(result) cls += result.status==='correct' ? ' correct' : ' wrong';
    const side = idx%2===0 ? 'left':'right';
    const clickable = !locked;
    return `
    <div class="station-row ${side}">
      <div class="${cls}" ${clickable?`data-action="open-station" data-index="${idx}"`:''}>
        <span class="num">${idx+1}</span>
        <span class="ic" style="--float-delay:${(idx*0.37 % 3).toFixed(2)}s">${result ? (result.status==='correct'?'✅':'❌') : st.icon}</span>
      </div>
      <div class="station-caption">
        <div class="station-label">${st.title}</div>
      </div>
    </div>`;
  }).join('');

  const allDone = Object.keys(state.results).length === STATIONS.length;

  return `
  ${renderTopbar()}
  ${renderGeoGuide('map',null,true)}
  <div class="path-wrap">
    <div class="path-line"></div>
    ${rows}
  </div>
  <div class="portal-goal-label">${allDone ? '🌟 Порталът е готов да се отвори!' : 'Порталът те очаква накрая'}</div>
  <div class="portal-goal ${allDone?'active':''}"></div>
  ${allDone ? `<div class="start-actions"><button class="btn" data-action="finish-game">🚪 Влез в 8. клас</button></div>` : ''}
  <footer class="note">Ниво: ${LEVEL_META[state.level].label} · Кликни следващата отключена гара, за да решиш задача</footer>
  ${renderResourceCredit()}
  `;
}

function renderQuestionModal(){
  if(state.activeIndex===null) return '';
  const st = STATIONS[state.activeIndex];
  const already = state.results[st.id];
  const isReview = state.reviewMode;
  const progress = getProgress(st.id);
  const lvl = progress.currentTask || st.levels[state.level];
  const prompts = socraticPrompts(lvl);
  const atLastPrompt = state.socraticStep >= prompts.length-1;

  let feedbackHtml = '';
  if(isReview){
    feedbackHtml = `
      <div class="feedback correct">
        <h4>✅ Гарата е завършена</h4>
        <div>Решени са ${already.correct} задачи. Направени опити: ${already.attempts}.</div>
      </div>`;
  }else if(state.answered){
    feedbackHtml = `
      <div class="feedback ${state.lastCorrect?'correct':'wrong'}">
        <h4>${state.lastCorrect ? '✅ Вярно!' : '🧭 Нека открием къде се е появила грешката.'}</h4>
        ${state.lastCorrect
          ? `<div>Добра работа! Верният отговор е <strong>${escapeHtml(lvl.answer)}</strong>.</div><div style="margin-top:6px;">${escapeHtml(lvl.solution)}</div>`
          : `<div>Отговорът още не е верен. Той няма да бъде разкрит автоматично — можеш да разсъждаваш с насочващи въпроси или да разгледаш решението.</div>`}
      </div>`;
  }

  const socraticHtml = state.socraticOpen && !state.lastCorrect ? `
    <div class="socratic-box">
      <h4>💬 Сократовски диалог · стъпка ${state.socraticStep+1} от ${prompts.length}</h4>
      <div class="socratic-question">${escapeHtml(prompts[state.socraticStep])}</div>

    </div>` : '';

  const solutionHtml = state.solutionShown && !state.lastCorrect ? `
    <div class="solution-box">
      <h4>📖 Решение стъпка по стъпка</h4>

  /* ---- защита срещу блокиране на дефектна задача (не влияе на точки/адаптивност) ---- */

  const showProblemLink = !isReview && state.answered && !state.lastCorrect && wrongStreak>=2 && !state.problemDialogOpen;
  const problemBoxHtml = (!isReview && state.problemDialogOpen) ? `
    <div class="problem-box">
      <h4>⚠️ Проблем със задачата</h4>

        <button class="btn ghost small" data-action="problem-retry">↩ Опитай пак</button>
        <button class="btn small" data-action="problem-skip">⏭ Друга задача</button>
      </div>

    <div class="problem-box blocked-help">
      <h4>🚧 Не оставай блокиран тук</h4>
      <div>Можеш да използваш помощ или да преминеш към друга задача.</div>
      <div class="problem-actions">
        <button class="btn ghost small" data-action="blocked-hint">💡 Виж подсказка</button>
        <button class="btn ghost small" data-action="blocked-solution">✅ Виж решение</button>

  return `

    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-title">
      <div class="modal-header">
        <span class="ic">${st.icon}</span>
        <div>
          <h2 id="task-title">Гара ${state.activeIndex+1}: ${st.title}</h2>
          <span class="level-tag ${LEVEL_META[state.level].cls}">${LEVEL_META[state.level].short}</span>
          ${!isReview ? `<div class="task-counter">Задача ${Math.min(progress.correct+(progress.forcedAdvances||0)+1,TASKS_PER_STATION)} от ${TASKS_PER_STATION} · ${lvl.skillLabel||'Математическо умение'}</div>` : ''}
          ${!isReview ? `<div class="mini-progress">${Array.from({length:TASKS_PER_STATION},(_,i)=>`<span class="${i<progress.correct+(progress.forcedAdvances||0)?'done':''}"></span>`).join('')}</div>` : ''}
        </div>
      </div>
      <div class="workspace"><section class="task-column" aria-label="Задача и отговор">
      ${renderGeoGuide(isReview?'review':'task',lvl)}
      <div class="task-reading" tabindex="0" aria-label="Условие и помощ">
      ${!isReview ? `<div class="question-text">${escapeHtml(lvl.q)}</div>` : ''}
      ${!isReview && lvl.visual ? `<details class="task-figure" open><summary>📐 Чертеж към задачата</summary><div class="task-visual">${lvl.visual}</div></details>` : ''}
      ${state.hintShown && !isReview ? `<div class="hint-box">💡 Подсказка: ${escapeHtml(lvl.hint)}</div>` : ''}
      ${feedbackHtml}
      ${socraticHtml}
      ${solutionHtml}
      ${problemBoxHtml}
      ${blockedHelpHtml}
      </div>
      ${(!state.answered && !isReview) ? `
        <div class="answer-row">
          <input type="text" id="answer-field" placeholder="Твоят отговор..." aria-label="Твоят отговор" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${state.mathKeyboardOpen?'none':'text'}">
        </div>

      `:''}
      <div class="modal-actions">
        <div>
          ${(!state.answered && !isReview) ? `        
          <button type="button" class="btn ghost small keyboard-toggle" aria-label="Покажи или свий математическите символи" title="Математически символи" data-action="toggle-keyboard">⌨️</button>
          <button type="button" class="btn ghost small native-keyboard-toggle" data-action="native-keyboard" title="Пиши с обичайната клавиатура">Aa</button>
        ` : ''}
          ${(!state.answered && !isReview) ? `<button class="btn ghost small" data-action="show-hint">💡 Подсказка</button>` : ''}
          ${(state.answered && !state.lastCorrect && !isReview) ? `<button class="btn ghost small" data-action="open-socratic">💬 Къде сгреших?</button>` : ''}
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
          <button class="btn secondary small" data-action="close-modal">${(state.answered||isReview)?'Затвори':'Изход'}</button>
          ${(!state.answered && !isReview) ? `<button class="btn small" data-action="submit-answer">Провери</button>` : ''}
          ${(state.answered && !state.lastCorrect && !isReview) ? `<button class="btn small" data-action="retry-task">🔁 Опитай пак</button>` : ''}
          ${(state.answered && !state.lastCorrect && !state.solutionShown && !isReview) ? `<button class="btn secondary small" data-action="show-solution">📖 Покажи решение</button>` : ''}
          ${(state.socraticOpen && !atLastPrompt && !state.lastCorrect && !isReview) ? `<button class="btn small" data-action="next-socratic">Следващ въпрос →</button>` : ''}
          ${(state.answered && !state.lastCorrect && (state.solutionShown || (state.socraticOpen && atLastPrompt)) && !isReview) ? `<button class="btn small" data-action="similar-task">🔄 Нова подобна задача</button>` : ''}
          ${(state.answered && state.lastCorrect && progress.correct<TASKS_PER_STATION && !isReview) ? `<button class="btn small" data-action="next-task">Следваща задача →</button>` : ''}
          ${(state.answered && state.lastCorrect && progress.correct>=TASKS_PER_STATION && !isReview) ? `<button class="btn small" data-action="complete-station">Към картата →</button>` : ''}
        </div>
      </div>
      ${showProblemLink ? `<div class="problem-link-row"><button type="button" class="fix-link" data-action="report-problem">⚠️ Нещо не е наред със задачата?</button></div>` : ''}
      </section>
      <aside class="tools-column" aria-label="Помощни инструменти">
      ${!isReview ? `
        <details class="scratchpad" ${isScratchOpen()?'open':''}>
          <summary>✍️ Чернова</summary>
          <div class="scratchpad-body">
            <div class="scratch-toolbar" role="toolbar" aria-label="Инструменти за черновата">
              <button type="button" class="scratch-tool ${state.scratchTool==='pen'?'active':''}" data-scratch-tool="pen" aria-pressed="${state.scratchTool==='pen'}">✏️ Писалка</button>
              <button type="button" class="scratch-tool ${state.scratchTool==='eraser'?'active':''}" data-scratch-tool="eraser" aria-pressed="${state.scratchTool==='eraser'}">🧽 Гума</button>
              <button type="button" class="scratch-tool" data-scratch-tool="undo">↶ Назад</button>
              <button type="button" class="scratch-tool" data-scratch-tool="clear">🗑️ Изчисти</button>
              <span class="scratch-hint">Пиши с мишка, пръст или писалка</span>
            </div>
            <div class="scratch-canvas-wrap">
              <canvas id="scratch-canvas" aria-label="Поле за ръчни пресмятания"></canvas>
            </div>
            <div class="scratch-note">Черновата е само за помощ и не се проверява автоматично.</div>
          </div>
        </details>
      ` : ''}
      ${(!state.answered && !isReview) ? renderMathKeyboard() : ''}
      </aside></div>
      ${renderResourceCredit(true)}
    </div>
  </div>`;
}



function attachModal(){
  persistScratchpad();
  let existing = document.querySelector('.overlay');
  if(existing) existing.remove();
  if(state.activeIndex!==null){
    document.getElementById('app').insertAdjacentHTML('beforeend', renderQuestionModal());
    initScratchpad();
    initMathKeyboardDrag();
    const field = document.getElementById('answer-field');
    if(field){
      field.focus();
      field.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ submitAnswer(); } });
    }
  }
}

function persistScratchpad(){
  const canvas=document.getElementById('scratch-canvas');
  if(canvas && canvas.dataset.ready && canvas.dataset.scratchKey===state.scratchKey) state.scratchImage=canvas.toDataURL('image/png');
}

function resetScratchpad(){
  state.scratchImage=null;
  state.scratchHistory=[];
  state.scratchTool='pen';
}

function prepareScratchpadForTask(station,task){
  const nextKey=station && task ? `${state.runSeed}|${station.id}|${getProgress(station.id).serial}|${task.q}` : null;
  if(state.scratchKey!==nextKey){
    resetScratchpad();
    state.scratchKey=nextKey;
  }
}

function initScratchpad(){
  const canvas=document.getElementById('scratch-canvas');
  if(!canvas) return;
  const wrap=canvas.parentElement;
  const ctx=canvas.getContext('2d');
  let drawing=false;
  let lastPoint=null;
  let resizeTimer=null;
  let imageVersion=0;

  function setTool(tool){
    state.scratchTool=tool;
    document.querySelectorAll('[data-scratch-tool="pen"],[data-scratch-tool="eraser"]').forEach(btn=>{
      const active=btn.dataset.scratchTool===tool;
      btn.classList.toggle('active',active);
      btn.setAttribute('aria-pressed',String(active));
    });
    wrap.style.cursor=tool==='eraser'?'cell':'crosshair';
  }

  function loadImage(source){
    if(!source) return;
    const version=++imageVersion;
    const img=new Image();
    img.onload=()=>{
      if(version!==imageVersion || !canvas.isConnected) return;
      const dpr=Math.min(window.devicePixelRatio||1,2);
      ctx.save();
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.drawImage(img,0,0,canvas.width/dpr,canvas.height/dpr);
      ctx.restore();
    };
    img.src=source;
  }

  function sizeCanvas(source){
    const rect=canvas.getBoundingClientRect();
    if(rect.width<1 || rect.height<1 || !canvas.closest('details').open) return;
    const saved=source || (canvas.dataset.ready ? canvas.toDataURL('image/png') : state.scratchImage);
    const pixelRatio=Math.min(window.devicePixelRatio||1,2);
    if(canvas.dataset.ready && canvas.width===Math.round(rect.width*pixelRatio) && canvas.height===Math.round(rect.height*pixelRatio)) return;
    canvas.dataset.ready='true';
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.round(rect.width*dpr));
    canvas.height=Math.max(1,Math.round(rect.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap='round';
    ctx.lineJoin='round';
    loadImage(saved);
  }

  function pointFromEvent(e){
    const rect=canvas.getBoundingClientRect();
    return {x:e.clientX-rect.left,y:e.clientY-rect.top};
  }

  function snapshot(){
    state.scratchHistory.push(canvas.toDataURL('image/png'));
    if(state.scratchHistory.length>20) state.scratchHistory.shift();
  }

  function startDrawing(e){
    e.preventDefault();
    ++imageVersion;
    snapshot();
    drawing=true;
    lastPoint=pointFromEvent(e);
    canvas.setPointerCapture(e.pointerId);
    ctx.beginPath();
    ctx.moveTo(lastPoint.x,lastPoint.y);
  }

  function draw(e){
    if(!drawing) return;
    e.preventDefault();
    const point=pointFromEvent(e);
    ctx.globalCompositeOperation=state.scratchTool==='eraser'?'destination-out':'source-over';
    ctx.strokeStyle='#16213d';
    const pressure=e.pressure && e.pressure>.05 ? e.pressure : .5;
    ctx.lineWidth=state.scratchTool==='eraser' ? 22 : Math.max(2,pressure*5);
    ctx.lineTo(point.x,point.y);
    ctx.stroke();
    lastPoint=point;
  }

  function stopDrawing(e){
    if(!drawing) return;
    draw(e);
    drawing=false;
    ctx.closePath();
    ctx.globalCompositeOperation='source-over';
    state.scratchImage=canvas.toDataURL('image/png');
  }

  canvas.addEventListener('pointerdown',startDrawing);
  canvas.addEventListener('pointermove',draw);
  canvas.addEventListener('pointerup',stopDrawing);
  canvas.addEventListener('pointercancel',stopDrawing);
  canvas.addEventListener('contextmenu',e=>e.preventDefault());

  document.querySelectorAll('[data-scratch-tool]').forEach(btn=>btn.addEventListener('click',()=>{
    const tool=btn.dataset.scratchTool;
    if(tool==='pen' || tool==='eraser') setTool(tool);
    else if(tool==='clear'){
      ++imageVersion;
      snapshot();
      ctx.clearRect(0,0,canvas.width,canvas.height);
      state.scratchImage=null;
    }else if(tool==='undo'){
      ++imageVersion;
      const previous=state.scratchHistory.pop();
      if(previous){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        state.scratchImage=previous;
        loadImage(previous);
      }
    }
  }));

  scratchResizeObserver=new ResizeObserver(()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>sizeCanvas(),80);
  });
  scratchResizeObserver.observe(wrap);
  canvas.dataset.scratchKey=state.scratchKey || '';
  sizeCanvas(state.scratchImage);
  setTool(state.scratchTool);
}

function renderEnd(){
  const total = STATIONS.length;
  const correctCount = Object.values(state.stationProgress).reduce((sum,p)=>sum+p.correct,0);
  const attempts = Object.values(state.stationProgress).reduce((sum,p)=>sum+p.attempts,0);
  const pct = attempts ? Math.round((correctCount/attempts)*100) : 0;
  let grade, gradeColor;
  if(pct>=90){grade='Отличен (6)';gradeColor='var(--success)';}
  else if(pct>=75){grade='Много добър (5)';gradeColor='var(--accent2)';}
  else if(pct>=60){grade='Добър (4)';gradeColor='var(--gold)';}
  else if(pct>=50){grade='Среден (3)';gradeColor='var(--accent3)';}
  else {grade='Слаб (2)';gradeColor='var(--danger)';}

  const rows = STATIONS.map(st=>{
    const r = state.results[st.id];
    const ok = r && r.status==='correct';
    const skippedNote = (ok && r.skippedProblemCount) ? ` · <span class="tag-bad" style="margin-left:4px;">${r.skippedProblemCount} пропусната поради проблем</span>` : '';
    return `<tr><td>${st.icon} ${st.title}</td><td>${ok?`<span class="tag-ok">${r.correct}/${TASKS_PER_STATION} верни · ${r.attempts} опита</span>${skippedNote}`:'<span class="tag-bad">Незавършена</span>'}</td></tr>`;
  }).join('');
  const totalSkippedProblem = state.skippedTasksLog.length;

  const reflectionTopics = [
    "Цели изрази и уравнения",
    "Геометрия (триъгълници, успоредник)",
    "Неравенства",
    "Вероятности и статистика"
  ];
  const reflectionHtml = reflectionTopics.map((t,i)=>`
    <div class="selfcheck-row">
      <span>${t}</span>
      <span>
        <label><input type="radio" name="refl${i}"> Уверен/а съм</label>
        <label><input type="radio" name="refl${i}"> Трябва още преговор</label>
      </span>
    </div>`).join('');

  return `
  <div class="hero">
    <div class="portal-icon"></div>
    <h1>Порталът е отворен!</h1>
    <p>${escapeHtml(state.playerName) || 'Приятелю'}, премина през всичките ${total} гари на 7. клас на ниво „${LEVEL_META[state.level].short}“.</p>
  </div>

  ${renderGeoGuide('end',null,true)}
  <div class="card" style="text-align:center;">
    <div class="grade-badge" style="border-color:${gradeColor};box-shadow:0 0 40px ${gradeColor}55;">${pct}%</div>
    <h2 style="margin:4px 0;color:${gradeColor};">${grade}</h2>
    <p style="color:var(--text-dim);">${correctCount} верни задачи от ${attempts} общо опита</p>
    ${totalSkippedProblem ? `<p style="color:var(--text-dim);font-size:.85rem;">🚧 ${totalSkippedProblem} задача${totalSkippedProblem===1?'':'и'} пропусната${totalSkippedProblem===1?'':'и'} поради проблем — не се броят нито като верни, нито като грешни.</p>` : ''}
  </div>

  <div class="card">
    <h3>Резултати по теми</h3>
    <table class="results"><tbody>${rows}</tbody></table>
  </div>

  <div class="card" style="text-align:center;">
    <h3>Код за резултат</h3>
    <p style="color:var(--text-dim);">Покажи или изпрати този код на учителя си като доказателство, че си решил/а задачите.</p>
    <div id="result-code-value" style="font-family:monospace;font-size:1.15rem;letter-spacing:1px;background:rgba(255,255,255,.06);border-radius:10px;padding:10px 14px;display:inline-block;margin:6px 0;">${buildResultCode()}</div>
    <div><button class="btn ghost" data-action="copy-result-code">📋 Копирай кода</button></div>
  </div>

  <div class="card">
    <h3>Самооценка</h3>
    ${reflectionHtml}
  </div>

  <div class="start-actions" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
    <button class="btn" data-action="restart-same">🔁 Играй пак на същото ниво</button>
    <button class="btn secondary" data-action="restart-new">🎚️ Смени ниво</button>
    <button class="btn ghost" data-action="print-results">🖨️ Разпечатай резултат</button>
  </div>
  <footer class="note">Успех в 8. клас! 🚀</footer>
  ${renderResourceCredit()}
  `;
}

function pickLevel(level){
  const nameInput = document.getElementById('name-input');
  if(nameInput) state.playerName = nameInput.value;
  state.level = level;
  renderApp();
}
function startGame(){
  const nameInput = document.getElementById('name-input');
  state.playerName = nameInput ? nameInput.value.trim() : '';
  if(!state.level) return;
  clearSavedGame();
  pendingSavedGame=null;
  state.runSeed=createRunSeed();
  state.screen='map';
  state.currentIndex=0;
  state.results={};
  state.stationProgress={};
  state.scratchKey=null;
  state.seenTaskIds=new Set();
  state.skippedProblemTaskIds=new Set();
  state.skippedTasksLog=[];
  state.problemDialogOpen=false;
  resetScratchpad();
  renderApp();
}
/* Възстановява запазена игра (данните вече заредени и валидирани в pendingSavedGame).
   Никога не отваря автоматично модал със задача — ученикът сам избира гара от картата. */
function continueGame(){
  const data=pendingSavedGame;
  if(!data) return;
  state.playerName=data.playerName || '';
  state.level=data.level;
  state.runSeed=data.runSeed;
  state.currentIndex=Number(data.currentIndex)||0;
  state.results=data.results || {};
  state.stationProgress=deserializeStationProgress(data.stationProgress);
  state.seenTaskIds=new Set(data.seenTaskIds || []);
  state.skippedProblemTaskIds=new Set(data.skippedProblemTaskIds || []);
  state.skippedTasksLog=Array.isArray(data.skippedTasksLog) ? data.skippedTasksLog : [];
  state.activeIndex=null;
  state.activeStation=null;
  state.reviewMode=false;
  state.scratchKey=null;
  state.newGamePromptOpen=false;
  state.screen='map';

}

/* Потвърдено изтриване на запазената игра от стартовия екран — показва обичайния
   стартов екран за нова игра (избор на име/ниво), без да пипа нищо друго. */
function confirmNewGame(){
  clearSavedGame();
  pendingSavedGame=null;
  state.newGamePromptOpen=false;
  renderApp();
}
function openStation(index){
  state.activeIndex = index;
  state.activeStation = STATIONS[index];
  state.reviewMode = !!state.results[STATIONS[index].id];
  const progress=getProgress(STATIONS[index].id);
  if(!state.reviewMode && !progress.currentTask) nextTaskFor(STATIONS[index],false);
  if(!state.reviewMode) prepareScratchpadForTask(STATIONS[index],progress.currentTask);
  state.hintShown=false;
  state.answered = state.reviewMode || progress.pendingRemediation || progress.taskSolved;
  state.lastCorrect = state.reviewMode || progress.taskSolved;
  state.socraticOpen=false;
  state.socraticStep=0;
  state.solutionShown=false;
  state.problemDialogOpen=false;
  saveGameProgress();
  attachModal();
}
function closeModal(){
  state.activeIndex=null;
  state.activeStation=null;
  state.reviewMode=false;
  state.answered=false;
  state.hintShown=false;
  state.socraticOpen=false;
  state.socraticStep=0;
  state.solutionShown=false;
  state.problemDialogOpen=false;
  attachModal();
}
function showHint(){
  state.hintShown = true;
  const st=STATIONS[state.activeIndex];
  if(st) getProgress(st.id).hintsUsed++;
  attachModal();
}
function submitAnswer(){
  const field = document.getElementById('answer-field');
  if(!field) return;
  const st = STATIONS[state.activeIndex];
  const progress=getProgress(st.id);
  const lvl = progress.currentTask;
  const correct = checkAnswer(field.value, lvl);
  progress.attempts++;
  progress.history.push({taskId:lvl.taskId,q:lvl.q,userAnswer:field.value.trim(),correct,hintUsed:state.hintShown});
  state.answered = true;
  state.lastCorrect = correct;
  state.socraticOpen=false;
  state.socraticStep=0;
  state.solutionShown=false;
  if(correct){
    progress.correct++;
    progress.taskSolved=true;
    progress.pendingRemediation=false;
  }else{
    progress.pendingRemediation=true;
    progress.taskSolved=false;
    progress.wrongStreak=(progress.wrongStreak||0)+1; // брой грешни опити на ТЕКУЩАТА задача — задейства защитата срещу блокиране
  }
  if(correct){
    playCorrectSound();
    showRewardPop(['⭐','🌟','✨','🏆'][Math.floor(Math.random()*4)]);
  }
  saveGameProgress();
  attachModal();
}
/* Позволява ново въвеждане на СЪЩАТА задача (без да се сменя вариантът и без да се пипат
   точки/статистика) — използва се от бутона „🔁 Опитай пак“ и от диалога „⚠️ Проблем със задачата“. */
function retryTask(){
  state.answered=false;
  state.lastCorrect=false;
  state.problemDialogOpen=false;
  attachModal();
}
function openProblemDialog(){
  state.problemDialogOpen=true;
  attachModal();
}
/* Бутоните от автоматичното съобщение след 3 грешни опита — просто показват подсказка/решение
   (съществуващите функции) и скриват съобщението за тази задача, за да не изскача многократно. */
function blockedShowHint(){
  const st=STATIONS[state.activeIndex];
  if(st) getProgress(st.id).blockedHelpDismissed=true;
  showHint();
}
function blockedShowSolution(){
  const st=STATIONS[state.activeIndex];
  if(st) getProgress(st.id).blockedHelpDismissed=true;
  showSolution();
}
/* Основна функция на защитата срещу блокиране: маркира текущия вариант вътрешно като
   „пропуснат поради проблем“ (никога не се брои като верен или грешен опит, не пипа точки,
   опити или адаптивното ниво) и зарежда друг наличен вариант от същата гара/умение/ниво. */
function markCurrentTaskProblem(){
  const st=STATIONS[state.activeIndex];
  if(!st) return;
  const progress=getProgress(st.id);
  const lvl=progress.currentTask;
  if(!lvl) return;
  const skillKey=lvl.skillKey;
  const level=state.level;
  const idx=taskIndexOf(st.id,skillKey,level,lvl);
  const id=taskIdOf(st.id,skillKey,level,idx);
  // премахва от историята и от броя опити всички записи, принадлежащи именно на маркираната
  // като проблемна задача — те не трябва да влияят на процента, оценката, адаптивната логика
  // или кода за резултат; опитите на всички останали задачи остават непокътнати.
  const removedCount=progress.history.filter(h=>h.taskId===lvl.taskId).length;
  progress.history=progress.history.filter(h=>h.taskId!==lvl.taskId);
  progress.attempts=Math.max(0,progress.attempts-removedCount);
  state.skippedProblemTaskIds.add(id);
  state.skippedTasksLog.push({station:st.id,stationTitle:st.title,skill:skillKey,skillLabel:lvl.skillLabel,level,taskIndex:idx,q:lvl.q,time:Date.now()});
  progress.skippedProblemCount=(progress.skippedProblemCount||0)+1;
  state.problemDialogOpen=false;

  const replacement=pickReplacementTask(st,skillKey,level,lvl);
  if(replacement){
    // има друг наличен вариант от същото умение/ниво — зарежда се веднага, опитите тръгват от 0,
    // гарата/умението/нивото/мястото в поредицата (progress.correct) остават непроменени.
    replacement.task.skillKey=skillKey;
    replacement.task.skillLabel=lvl.skillLabel;
    replacement.task.taskId=replacement.id;
    state.seenTaskIds.add(replacement.id);
    progress.currentTask=replacement.task;
    resetTaskAttemptFlags(progress);
    prepareScratchpadForTask(st,progress.currentTask);
    state.answered=false;
    state.lastCorrect=false;
    state.hintShown=false;
    state.socraticOpen=false;
    state.socraticStep=0;
    state.solutionShown=false;
    saveGameProgress();
    attachModal();
    return;
  }
  // няма никакъв друг наличен вариант от това умение/ниво (всички вече показани или маркирани) —
  // ученикът не остава блокиран: преминава се към следващата стъпка от гарата БЕЗ да се брои за
  // вярна и БЕЗ да се пипа progress.correct (истинският брой верни отговори, ползван за резултата
  // и кода за учителя). За навигацията се ползва отделен брояч forcedAdvances.
  progress.forcedAdvances=(progress.forcedAdvances||0)+1;
  resetTaskAttemptFlags(progress);
  if(progress.correct+progress.forcedAdvances>=TASKS_PER_STATION){
    completeStation(); // вече затваря модала, показва картата и НЕ маркира форсирания преход като верен
    return;
  }
  nextTaskFor(st,false);
  prepareScratchpadForTask(st,progress.currentTask);
  state.answered=false;
  state.lastCorrect=false;
  state.hintShown=false;
  state.socraticOpen=false;
  state.socraticStep=0;
  state.solutionShown=false;
  saveGameProgress();
  attachModal();
}
function openSocratic(){
  state.socraticOpen=true;
  state.socraticStep=0;
  attachModal();
}
function nextSocratic(){
  const st=STATIONS[state.activeIndex];
  const prompts=socraticPrompts(getProgress(st.id).currentTask);
  state.socraticStep=Math.min(state.socraticStep+1,prompts.length-1);
  attachModal();
}
function showSolution(){
  state.solutionShown=true;
  attachModal();
}
function prepareFreshTask(forceSimilar){
  const st=STATIONS[state.activeIndex];
  nextTaskFor(st,forceSimilar);
  prepareScratchpadForTask(st,getProgress(st.id).currentTask);
  state.answered=false;
  state.lastCorrect=false;
  state.hintShown=false;
  state.socraticOpen=false;
  state.socraticStep=0;
  state.solutionShown=false;
  state.problemDialogOpen=false;
  saveGameProgress();
  attachModal();
}
function similarTask(){ prepareFreshTask(true); }
function nextTask(){ prepareFreshTask(true); }
function completeStation(){
  const st=STATIONS[state.activeIndex];
  const progress=getProgress(st.id);
  // progress.correct е истинският брой самостоятелно верни отговори (влиза в резултата и кода за учителя);
  // forcedAdvances е брой стъпки, преминати без наличен вариант след маркиране на проблемна задача — не се
  // брои за верен отговор, но позволява гарата да бъде завършена, ако не остава никаква друга задача.
  if(progress.correct+(progress.forcedAdvances||0)<TASKS_PER_STATION) return;
  state.results[st.id]={status:'correct',correct:progress.correct,attempts:progress.attempts,hintsUsed:progress.hintsUsed,history:progress.history,forcedAdvances:progress.forcedAdvances||0,skippedProblemCount:progress.skippedProblemCount||0};
  if(state.activeIndex===state.currentIndex) state.currentIndex=Math.min(state.currentIndex+1,STATIONS.length);
  playStationCompleteSound();
  showStationBanner('🎉 Гара завършена!');
  closeModal();
  if(Object.keys(state.results).length===STATIONS.length){
    // всички 18 гари са завършени — незавършеният автоматичен запис вече не е нужен
    // (при следващо отваряне не бива да се предлага „Продължи играта“ за завършено пътешествие)
    clearSavedGame();
  }else{
    saveGameProgress();
  }
  renderApp();
}
function finishGame(){
  state.screen='end';
  renderApp();
}
function restartSame(){
  clearSavedGame();
  pendingSavedGame=null;
  state.runSeed=createRunSeed();
  state.screen='map';
  state.currentIndex=0;
  state.results={};

  state.problemDialogOpen=false;

  renderApp();
}
function restartNew(){

  pendingSavedGame=null;
  state.screen='start';
  state.level=null;
  state.currentIndex=0;
  state.results={};
  state.stationProgress={};
  state.activeIndex=null;
  state.scratchKey=null;
  state.seenTaskIds=new Set();
  state.skippedProblemTaskIds=new Set();

}

/* Responsive controls. Keep the answer, drawing and caret through UI rerenders. */
let scratchResizeObserver=null;
let draftPanelObserver=null;
let cleanupKeyboardDrag=()=>{};
let lastDialogTaskKey=null;
const smallTools=()=>matchMedia('(max-width:700px), (max-height:600px)').matches;
function isScratchOpen(){return state.scratchOpen===null ? !smallTools() : state.scratchOpen;}
function syncViewport(){
  const v=window.visualViewport;
  const root=document.documentElement.style;
  root.setProperty('--view-height',(v?v.height:innerHeight)+'px');
  root.setProperty('--view-width',(v?v.width:innerWidth)+'px');
  root.setProperty('--view-top',(v?v.offsetTop:0)+'px');
  root.setProperty('--view-left',(v?v.offsetLeft:0)+'px');
  resetFloatingKeyboard();
  requestAnimationFrame(fitTaskFigure);
}
window.addEventListener('resize',syncViewport);

window.visualViewport?.addEventListener('scroll',syncViewport);
syncViewport();

function fitTaskFigure(){
  const reading=document.querySelector('.task-reading');
  const figure=document.querySelector('.task-figure');
  if(!reading || !figure || figure.dataset.manual) return;
  figure.open=true;
  if(reading.scrollHeight>reading.clientHeight+2) figure.open=false;

// Short guidance is always visible. The full original guidance remains expandable.
const fullGeoGuide=renderGeoGuide;
renderGeoGuide=function(mode='task',lvl=null,compact=false){
  if(compact) return fullGeoGuide(mode,lvl,compact);
  let short=state.answered ? (state.lastCorrect?'Браво! Верен отговор. 🌟':'Провери знаците и стъпките си.') : 'Прочети условието и запиши отговора.';
  if(mode==='review') short='Тази гара вече е завършена.';
  const original=fullGeoGuide(mode,lvl,compact);
  return original.replace('<span class="geo-name">Гео:</span>'+geoMessage(mode,lvl),'<span class="geo-name">Гео:</span>'+short+' <span class="geo-extra">'+geoMessage(mode,lvl)+'</span><button class="geo-more" data-action="toggle-geo" aria-expanded="false">Още</button>');

function toggleGeo(){

renderMathKeyboard=function(){
  if(!state.mathKeyboardOpen) return '<button type="button" class="math-keyboard-fab" data-action="toggle-keyboard" aria-label="Покажи математическите символи">⌨️ Математически символи</button>';
  const basic=['7','8','9','+','−','·','/','=','4','5','6','(',')','[',']',';','1','2','3','0','x','y',',','.','²'];
  const group=state.keyboardPage ? MATH_KEY_ROWS.flat().filter(key=>!basic.includes(key)) : basic;
  const keys=group.map(key=>`<button type="button" class="math-key" data-action="math-key" data-key="${key.replaceAll('"','&quot;')}">${key==='<'?'&lt;':key}</button>`).join('');
  return `<div class="keyboard-slot"><div class="math-keyboard" id="math-keyboard" aria-label="Математическа клавиатура">
    <div class="math-keyboard-header" id="math-keyboard-handle"><span>⌨️ Математически символи</span><span class="drag-note">премести с влачене</span><button type="button" class="math-keyboard-min" data-action="toggle-keyboard" aria-label="Свий клавиатурата">−</button></div>
    <div class="keyboard-pages" aria-label="Групи символи">${['123 · x² · ( )','a · ≥ · ∠'].map((name,i)=>`<button type="button" data-action="keyboard-page" data-page="${i}" aria-pressed="${state.keyboardPage===i}">${name}</button>`).join('')}</div>
    <div class="math-keyboard-body"><div class="math-key-grid">${keys}
      <button type="button" class="math-key action wide" data-action="keyboard-left" aria-label="Курсор наляво">← курсор</button>
      <button type="button" class="math-key action wide" data-action="keyboard-right" aria-label="Курсор надясно">курсор →</button>
      <button type="button" class="math-key action wide" data-action="keyboard-backspace">⌫ изтрий</button>
      <button type="button" class="math-key action wide" data-action="keyboard-clear">C изчисти</button>
    </div></div></div></div>`;
};
function switchKeyboardPage(page){state.keyboardPage=page;attachModal();}
toggleMathKeyboard=function(){
  state.nativeInput=false;
  const showingDraft=smallTools() && isScratchOpen();
  state.mathKeyboardOpen=showingDraft || !state.mathKeyboardOpen;
  if(state.mathKeyboardOpen && smallTools()) state.scratchOpen=false;
  attachModal();
};
function useNativeKeyboard(){
  state.nativeInput=true;
  state.mathKeyboardOpen=false;
  if(smallTools()) state.scratchOpen=false;
  attachModal();
  const field=document.getElementById('answer-field');
  field?.focus({preventScroll:true});
}
function resetFloatingKeyboard(){
  const kb=document.getElementById('math-keyboard');
  if(!kb)return;
  kb.classList.remove('floating');kb.removeAttribute('style');
  const slot=kb.parentElement;slot.style.height='';
}
initMathKeyboardDrag=function(){
  cleanupKeyboardDrag();
  const kb=document.getElementById('math-keyboard'),handle=document.getElementById('math-keyboard-handle');
  if(!kb||!handle)return;
  let dragging=false,dx=0,dy=0;
  const up=()=>{dragging=false;};
  const move=e=>{
    if(!dragging)return;
    const column=document.querySelector('.tools-column').getBoundingClientRect();
    // The floating keyboard stays in its tool lane, outside the question and answer.
    const left=Math.max(column.left,Math.min(column.right-kb.offsetWidth,e.clientX-dx));
    const top=Math.max(column.top,Math.min(column.bottom-kb.offsetHeight,e.clientY-dy));
    kb.style.left=left+'px';kb.style.top=top+'px';
  };
  handle.addEventListener('pointerdown',e=>{
    if(smallTools() || e.target.closest('button'))return;
    const rect=kb.getBoundingClientRect();
    kb.parentElement.style.height=rect.height+'px';
    kb.classList.add('floating');kb.style.width=rect.width+'px';kb.style.left=rect.left+'px';kb.style.top=rect.top+'px';
    dx=e.clientX-rect.left;dy=e.clientY-rect.top;dragging=true;
    handle.setPointerCapture(e.pointerId);e.preventDefault();
  });
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  cleanupKeyboardDrag=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);};
};

attachModal=function(){
  const oldField=document.getElementById('answer-field');
  const oldTaskKey=document.querySelector('.modal')?.dataset.taskKey;
  const saved=oldField?{value:oldField.value,start:oldField.selectionStart,end:oldField.selectionEnd}:null;
  persistScratchpad();
  scratchResizeObserver?.disconnect();scratchResizeObserver=null;
  draftPanelObserver?.disconnect();draftPanelObserver=null;
  cleanupKeyboardDrag();
  document.querySelector('.overlay')?.remove();
  document.body.classList.toggle('modal-open',state.activeIndex!==null);
  if(state.activeIndex===null){lastDialogTaskKey=null;return;}
  document.getElementById('app').insertAdjacentHTML('beforeend',renderQuestionModal());
  const modal=document.querySelector('.modal');
  modal.classList.toggle('native-input',!!state.nativeInput);
  modal.dataset.taskKey=state.scratchKey || '';
  const field=document.getElementById('answer-field');
  if(field){
    if(saved && oldTaskKey===state.scratchKey){field.value=saved.value;field.setSelectionRange(saved.start,saved.end);}
    field.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitAnswer();}});
    // Focus only when a physical keyboard is likely, never summon a phone keypad on render.
    if(matchMedia('(hover:hover) and (pointer:fine)').matches)field.focus({preventScroll:true});
  }
  initScratchpad();initMathKeyboardDrag();
  const draft=document.querySelector('.scratchpad');
  if(draft){
    const sizeDraft=()=>{if(draft.open){const available=draft.clientHeight-draft.querySelector('summary').offsetHeight;draft.querySelector('.scratchpad-body').style.height=Math.max(0,available)+'px';}};
    draftPanelObserver=new ResizeObserver(sizeDraft);draftPanelObserver.observe(draft);sizeDraft();
  }
  draft?.addEventListener('toggle',()=>{state.scratchOpen=draft.open;resetFloatingKeyboard();requestAnimationFrame(fitTaskFigure);});
  document.querySelector('.task-figure summary')?.addEventListener('click',()=>{document.querySelector('.task-figure').dataset.manual='true';});
  const reading=document.querySelector('.task-reading');
  requestAnimationFrame(()=>{
    fitTaskFigure();
    if(state.answered){const focusPanel=reading.querySelector('.solution-box')||reading.querySelector('.socratic-box')||reading.querySelector('.feedback');if(focusPanel)reading.scrollTop=focusPanel.offsetTop-reading.offsetTop;}
  });
  // Keep touch and mouse symbol taps from moving the text caret or opening a native keypad.
  modal.querySelectorAll('.math-key').forEach(btn=>btn.addEventListener('pointerdown',e=>e.preventDefault()));
  lastDialogTaskKey=state.scratchKey;
};

/* Проверка за запазена игра при първоначално зареждане на страницата — ако е валидна,
   стартовият екран ще покаже картата "Има запазена игра" вместо обичайния избор. */
pendingSavedGame=loadGameProgress();
/* Резервен запис при затваряне/презареждане на раздела — не е единственият механизъм
   (виж saveGameProgress() след всяка съществена промяна по-горе), а само подсигуряване. */
window.addEventListener('beforeunload', saveGameProgress);
renderApp();
</script>
