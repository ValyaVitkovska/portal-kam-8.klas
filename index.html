-6x^3y^3"],"visual":""},{"q":"Намерете нормалния вид на едночлена A=2x³·3x².","answer":"6x⁵","hint":"Умножете числените множители, съберете степените на x.","solution":"A=2x³·3x²=6x⁵.","alt":["6x^5"],"visual":""},{"q":"Едночленът C=(−2ax)³·3y⁴z е записан в нормален вид, като a е параметър. Каква е степента му (относно x, y, z)?","answer":"8","hint":"Степента отчита само показателите на променливите x, y, z, не и на параметъра a.","solution":"C=(−2ax)³·3y⁴z=−24a³x³y⁴z, степента (по x,y,z) е 3+4+1=8.","alt":[],"visual":""},{"q":"Приведете в нормален вид: 3y·(−4x²y)·x.","answer":"-12x³y²","hint":"Умножи коефициентите и събери показателите на еднаквите букви.","solution":"3·(−4)=−12; x²·x=x³; y·y=y².","alt":["-12x^3y^2"],"visual":""},{"q":"Едночленът D=(−3bx)²·2y³z е записан в нормален вид, като b е параметър. Каква е степента му (относно x, y, z)?","answer":"6","hint":"Степента отчита само показателите на променливите x, y, z, не и на параметъра b.","solution":"D=(−3bx)²·2y³z=18b²x²y³z, степента (по x,y,z) е 2+3+1=6.","alt":[],"visual":""}],"hard":[{"q":"Приведете едночлена −2a²b·3ab³·(−b) в нормален вид, определете степента му и запишете като отговор само степента.","answer":"8","hint":"След нормализиране събери всички показатели.","solution":"Получава се 6a³b⁵, чиято степен е 3+5=8.","alt":["8"],"visual":""},{"q":"Кой е коефициентът на едночлена (1/5−4)xyz, след като приведете числовия множител?","answer":"-3,8","hint":"Пресметнете числовия израз в скобата: 1/5−4.","solution":"1/5−4=−19/5=−3,8, следователно коефициентът е −3,8.","alt":["-3.8","-19/5"],"visual":""},{"q":"Едночленът 3ax²y⁵z⁸ е записан в нормален вид, като a е параметър. Намерете степента му (относно x, y, z).","answer":"15","hint":"Съберете степенните показатели само на променливите x, y, z; a е параметър.","solution":"2+5+8=15, следователно едночленът е от 15-а степен.","alt":[],"visual":""},{"q":"Приведете едночлена 2a³b²·(−3ab)·(−2a²) в нормален вид, определете степента му и запишете като отговор само степента.","answer":"9","hint":"След нормализиране събери всички показатели.","solution":"Получава се 12a⁶b³, чиято степен е 6+3=9.","alt":[],"visual":""},{"q":"Кой е коефициентът на едночлена (2/5−3)x²y, след като приведете числовия множител?","answer":"-2,6","hint":"Пресметнете числовия израз в скобата: 2/5−3.","solution":"2/5−3=−13/5=−2,6, следователно коефициентът е −2,6.","alt":["-13/5"],"visual":""}]},"skill2":{"easy":[{"q":"Съберете подобните едночлени: 5x² + 3x².","answer":"8x²","hint":"Събери само коефициентите.","solution":"5+ 3 = 8, следователно 8x².","alt":["8x^2"],"visual":""},{"q":"Съберете подобните едночлени: 8x² − 2x².","answer":"6x²","hint":"Събери само коефициентите.","solution":"8− 2 = 6, следователно 6x².","alt":["6x^2"],"visual":""},{"q":"Съберете подобните едночлени: -4x² + 7x².","answer":"3x²","hint":"Събери само коефициентите.","solution":"-4+ 7 = 3, следователно 3x².","alt":["3x^2"],"visual":""},{"q":"Съберете подобните едночлени: 6x² + 5x².","answer":"11x²","hint":"Събери само коефициентите.","solution":"6+5=11, следователно 11x².","alt":["11x^2"],"visual":""},{"q":"Съберете подобните едночлени: -5x² + 9x².","answer":"4x²","hint":"Събери само коефициентите.","solution":"-5+9=4, следователно 4x².","alt":["4x^2"],"visual":""}],"medium":[{"q":"Извършете действията и приведете израза в нормален вид: 4a²b − 7a²b + 5a²b.","answer":"2a²b","hint":"Трите едночлена са подобни. Събери коефициентите 4−7+5.","solution":"(4−7+5)a²b=2a²b.","alt":["2a^2b"],"visual":""},{"q":"Извършете действието: 9,5xy−3xy.","answer":"6,5xy","hint":"Извадете коефициентите на подобните едночлени.","solution":"9,5xy−3xy=6,5xy.","alt":["6.5xy"],"visual":""},{"q":"Ако u=−3x³, v=4x³, намерете u+v.","answer":"x³","hint":"Съберете коефициентите −3 и 4.","solution":"u+v=−3x³+4x³=x³.","alt":["x^3"],"visual":""},{"q":"Извършете действията и приведете израза в нормален вид: 6a²b − 2a²b − a²b.","answer":"3a²b","hint":"Трите едночлена са подобни. Събери коефициентите 6−2−1.","solution":"(6−2−1)a²b=3a²b.","alt":["3a^2b"],"visual":""},{"q":"Извършете действието: 7,2xy − 2,5xy.","answer":"4,7xy","hint":"Извадете коефициентите на подобните едночлени.","solution":"7,2xy−2,5xy=4,7xy.","alt":["4.7xy"],"visual":""}],"hard":[{"q":"Извършете действията и приведете многочлена в нормален вид: −3x²y + 5xy² + 8x²y − 2xy².","answer":"5x²y+3xy²","hint":"Групирай отделно членовете x²y и xy².","solution":"(−3+8)x²y +(5−2)xy² = 5x²y+3xy².","alt":["5x^2y+3xy^2","3xy²+5x²y","3xy^2+5x^2y"],"visual":""},{"q":"Направете приведение: A=−2y−8y+12y+2y−4y.","answer":"0","hint":"Съберете всички коефициенти внимателно, включително знаците.","solution":"A=(−2−8+12+2−4)y=0.","alt":[],"visual":""},{"q":"Направете приведение: B=−7xy+3xy+10xy−3xy−7xy.","answer":"-4xy","hint":"Съберете коефициентите: −7+3+10−3−7.","solution":"B=(−7+3+10−3−7)xy=−4xy.","alt":[],"visual":""},{"q":"Извършете действията и приведете многочлена в нормален вид: 4x²y − 6xy² − 9x²y + 10xy².","answer":"-5x²y+4xy²","hint":"Групирай отделно членовете x²y и xy².","solution":"(4−9)x²y +(−6+10)xy² = −5x²y+4xy².","alt":["-5x^2y+4xy^2","4xy²-5x²y","4xy^2-5x^2y"],"visual":""},{"q":"Направете приведение: C=5a−9a+3a−2a+6a.","answer":"3a","hint":"Съберете всички коефициенти внимателно, включително знаците.","solution":"C=(5−9+3−2+6)a=3a.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"Извършете умножението и приведете получения едночлен в нормален вид: 3x²·4x³.","answer":"12x⁵","hint":"Умножи коефициентите и събери показателите.","solution":"3·4=12, x²·x³=x⁵.","alt":["12x^5"],"visual":""},{"q":"Намерете u·v, ако u=2xy, v=3xy².","answer":"6x²y³","hint":"Умножете коефициентите и съберете степените на еднаквите букви.","solution":"u·v=2xy·3xy²=6x²y³.","alt":["6x^2y^3"],"visual":""},{"q":"Извършете степенуването: (4x³)².","answer":"16x⁶","hint":"Степенувайте всеки множител поотделно.","solution":"(4x³)²=4²(x³)²=16x⁶.","alt":["16x^6"],"visual":""},{"q":"Извършете умножението и приведете получения едночлен в нормален вид: 5x³·2x⁴.","answer":"10x⁷","hint":"Умножи коефициентите и събери показателите.","solution":"5·2=10, x³·x⁴=x⁷.","alt":["10x^7"],"visual":""},{"q":"Извършете степенуването: (3x²)³.","answer":"27x⁶","hint":"Степенувайте всеки множител поотделно.","solution":"(3x²)³=3³(x²)³=27x⁶.","alt":["27x^6"],"visual":""}],"medium":[{"q":"Извършете умножението и приведете получения едночлен в нормален вид: (−2x²y)·(5xy³).","answer":"-10x³y⁴","hint":"Събери показателите на еднаквите букви.","solution":"−2·5=−10, x²·x=x³, y·y³=y⁴.","alt":["-10x^3y^4"],"visual":""},{"q":"Намерете u·v, ако u=−2x⁵, v=−x²y.","answer":"2x⁷y","hint":"Произведение на две отрицателни числа е положително.","solution":"u·v=(−2x⁵)(−x²y)=2x⁷y.","alt":["2x^7y"],"visual":""},{"q":"Извършете деленето u:v, ако u=3x²yz, v=0,5xy.","answer":"6xz","hint":"Разделете коефициентите и извадете степенните показатели на еднаквите букви.","solution":"u:v=3x²yz/0,5xy=6xz.","alt":[],"visual":""},{"q":"Извършете умножението и приведете получения едночлен в нормален вид: (−3xy²)·(4x²y).","answer":"-12x³y³","hint":"Събери показателите на еднаквите букви.","solution":"−3·4=−12, x·x²=x³, y²·y=y³.","alt":["-12x^3y^3"],"visual":""},{"q":"Извършете деленето u:v, ако u=8x³y²z, v=2xy.","answer":"4x²yz","hint":"Разделете коефициентите и извадете степенните показатели на еднаквите букви.","solution":"u:v=8x³y²z/2xy=4x²yz.","alt":["4x^2yz"],"visual":""}],"hard":[{"q":"Извършете действията и приведете получения едночлен в нормален вид: (−2x²y)³ : (4x³y).","answer":"-2x³y²","hint":"Първо степенувай произведението, после раздели коефициентите и извади показателите.","solution":"(−2)³x⁶y³ : 4x³y = −2x³y².","alt":["-2x^3y^2"],"visual":""},{"q":"Извършете степенуването: (−ax)⁵.","answer":"-a⁵x⁵","hint":"Нечетна степен на отрицателен израз остава отрицателна.","solution":"(−ax)⁵=(−a)⁵x⁵=−a⁵x⁵.","alt":["-a^5x^5"],"visual":""},{"q":"Намерете числената стойност на израза A=−2x·5x³+(−5x²)²+x⁵:x за x=−1.","answer":"16","hint":"Приведете израза до един едночлен, преди да заместите x.","solution":"A=−10x⁴+25x⁴+x⁴=16x⁴; за x=−1, A=16.","alt":[],"visual":""},{"q":"Извършете действията и приведете получения едночлен в нормален вид: (−2xy²)³ : (2x²y).","answer":"-4xy⁵","hint":"Първо степенувай произведението, после раздели коефициентите и извади показателите.","solution":"(−2)³x³y⁶ : 2x²y = −4xy⁵.","alt":["-4xy^5"],"visual":""},{"q":"Извършете степенуването: (−by)⁴.","answer":"b⁴y⁴","hint":"Четна степен на отрицателен израз е положителна.","solution":"(−by)⁴=(−b)⁴y⁴=b⁴y⁴.","alt":["b^4y^4"],"visual":""}]}},"3":{"skill1":{"easy":[{"q":"Приведете в нормален вид: 3x² + 5x − x² + 2x.","answer":"2x²+7x","hint":"Събери подобните членове.","solution":"(3−1)x²+(5+2)x=2x²+7x.","alt":["2x^2+7x"],"visual":""},{"q":"Направете приведение: 2x²y−3x²y−2x²y−x²y+6x²y.","answer":"2x²y","hint":"Съберете коефициентите на подобните едночлени.","solution":"(2−3−2−1+6)x²y=2x²y.","alt":["2x^2y"],"visual":""},{"q":"Приведете в нормален вид: 3xy²−3xy+2xy+5y.","answer":"3xy²-xy+5y","hint":"Обединете само подобните едночлени (−3xy и 2xy).","solution":"3xy²−3xy+2xy+5y=3xy²−xy+5y.","alt":["3xy^2-xy+5y"],"visual":""},{"q":"Приведете в нормален вид многочлена: 4x²+5x−3x²−3−3x.","answer":"x²+2x-3","hint":"Групирайте членовете от еднаква степен.","solution":"4x²+5x−3x²−3−3x=x²+2x−3.","alt":["x^2+2x-3"],"visual":""}],"medium":[{"q":"Приведете в нормален вид: 4x³ − 2x + 5 − x³ + 7x − 8.","answer":"3x³+5x-3","hint":"Групирай членовете от една и съща степен.","solution":"3x³+5x−3.","alt":["3x^3+5x-3"],"visual":""},{"q":"Приведете в нормален вид: v=3x²−7x+3+5x−4x².","answer":"-x²-2x+3","hint":"Групирайте членовете от x², от x и свободните членове поотделно.","solution":"v=3x²−7x+3+5x−4x²=−x²−2x+3.","alt":["-x^2-2x+3"],"visual":""},{"q":"Определете степента на многочлена 10x⁸−2x⁶+x⁵y⁵−xy+2.","answer":"10","hint":"Степента на многочлен е най-високата степен сред членовете му (тук x⁵y⁵ е от степен 5+5).","solution":"Членът x⁵y⁵ е от степен 10, най-висока сред всички — многочленът е от 10-а степен.","alt":[],"visual":""},{"q":"Многочленът 3ax⁸+8ax⁵+axy−1 е от коя степен относно x, ако a е параметър?","answer":"8","hint":"Отчитаме само степента на x, тъй като a е параметър.","solution":"Членът 3ax⁸ има най-висок показател на x — 8, значи многочленът е от осма степен относно x.","alt":[],"visual":""}],"hard":[{"q":"Приведете в нормален вид: 2x(x−3)+x²−(4x−5).","answer":"3x²-10x+5","hint":"Разкрий скобите, после приведи подобните членове.","solution":"2x²−6x+x²−4x+5=3x²−10x+5.","alt":["3x^2-10x+5"],"visual":""},{"q":"В многочлена A=−x⁵+2x⁴−5x³−x+1,5, какъв е коефициентът на члена от трета степен?","answer":"-5","hint":"Намерете члена, съдържащ x³, и посочете числото пред него.","solution":"Членът от трета степен е −5x³, следователно коефициентът е −5.","alt":[],"visual":""},{"q":"Многочленът B=7x⁶−2,5x⁵−2x³+4x²−x−1 има свободен член. Кой е той?","answer":"-1","hint":"Свободният член е този без променлива (степен нула).","solution":"Свободният член на B е −1.","alt":[],"visual":""},{"q":"Приведете в нормален вид: 3x(x−2)+2x²−(5x−7).","answer":"5x²-11x+7","hint":"Разкрий скобите, после приведи подобните членове.","solution":"3x²−6x+2x²−5x+7=5x²−11x+7.","alt":["5x^2-11x+7"],"visual":""},{"q":"В многочлена C=4x⁷−3x⁵+6x⁴−2x+0,5, какъв е коефициентът на члена от пета степен?","answer":"-3","hint":"Намерете члена, съдържащ x⁵, и посочете числото пред него.","solution":"Членът от пета степен е −3x⁵, следователно коефициентът е −3.","alt":[],"visual":""}]},"skill2":{"easy":[{"q":"Извършете събирането и приведете получения многочлен в нормален вид: (3x + 5) + (2x − 1).","answer":"5x+4","hint":"Премахни скобите и събери подобните членове.","solution":"3x+5+2x−1=5x+4.","alt":[],"visual":""},{"q":"Съберете многочлените: u=2x²−x+5, v=x−1.","answer":"2x²+4","hint":"Съберете подобните членове.","solution":"u+v=(2x²−x+5)+(x−1)=2x²+4.","alt":["2x^2+4"],"visual":""},{"q":"Разкрийте скобите и направете приведение: (2x²−4xy−y)−(−x²+xy)+(3x²+y).","answer":"6x²-5xy","hint":"Пред скоба с минус пред нея всички знаци вътре се сменят.","solution":"(2x²−4xy−y)−(−x²+xy)+(3x²+y)=6x²−5xy.","alt":["6x^2-5xy"],"visual":""},{"q":"Намерете u−v, ако u=2x²−x³+x, v=x³+1−x.","answer":"-2x³+2x²+2x-1","hint":"Извадете многочлените, като смените знака на всеки член на v.","solution":"u−v=(2x²−x³+x)−(x³+1−x)=−2x³+2x²+2x−1.","alt":["-2x^3+2x^2+2x-1"],"visual":""}],"medium":[{"q":"Извършете изваждането и приведете получения многочлен в нормален вид: (4x² − 3x + 2) − (x² + 5x − 4).","answer":"3x²-8x+6","hint":"Минусът пред втората скоба сменя знаците.","solution":"4x²−3x+2−x²−5x+4=3x²−8x+6.","alt":["3x^2-8x+6"],"visual":""},{"q":"Покажете, че стойността на израза A=4x²+y²−(3x²+2xy+5)−(x²−2xy+y²) не зависи от x и y, като приведете израза.","answer":"-5","hint":"Разкрийте скобите и приведете подобните членове — променливите ще се съкратят.","solution":"A=4x²+y²−3x²−2xy−5−x²+2xy−y²=−5.","alt":[],"visual":""},{"q":"Покажете, че изразът A=2x²−5x+3−(x²−5x−1) приема положителни стойности за всяка стойност на x, като го приведете до най-проста форма.","answer":"x²+4","hint":"Разкрийте скобата и приведете подобните членове.","solution":"A=2x²−5x+3−x²+5x+1=x²+4.","alt":["x^2+4"],"visual":""},{"q":"Съберете многочлените u и v: u=4x²y−3x+4, v=−x²y−x−3.","answer":"3x²y-4x+1","hint":"Съберете подобните едночлени.","solution":"u+v=3x²y−4x+1.","alt":["3x^2y-4x+1"],"visual":""}],"hard":[{"q":"Извършете действията и приведете получения многочлен в нормален вид: 2(x² − 3x + 1) − 3(2x² − x − 4).","answer":"-4x²-3x+14","hint":"Умножи всеки член в скобите, после приведи подобните.","solution":"2x²−6x+2−6x²+3x+12=−4x²−3x+14.","alt":["-4x^2-3x+14"],"visual":""},{"q":"Намерете най-малката стойност на израза A=4x²−5x+4−(2x²−3x)+(−x²+2x−1).","answer":"3","hint":"Приведете израза до вида x²+c; квадратът е ≥0, а най-малката му стойност е 0.","solution":"A=x²+3; най-малката стойност е 3 (при x=0).","alt":[],"visual":""},{"q":"Намерете най-голямата стойност на израза A=9y³−(2y³−3y²+5)+(−7y³−8y²−9).","answer":"-14","hint":"Приведете израза — членовете с y³ се съкращават и остава израз от вида −5y²+c.","solution":"A=−5y²−14; тъй като −5y²≤0, най-голямата стойност е −14 (при y=0).","alt":[],"visual":""},{"q":"Разкрийте скобите и направете приведение: 1−(15xy−y)−(5−(2xy−1)+y).","answer":"-13xy-5","hint":"Внимавайте с два последователни минуса пред скоби.","solution":"1−(15xy−y)−(5−(2xy−1)+y)=−13xy−5.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"Извършете умножението и приведете получения многочлен в нормален вид: x(x + 5).","answer":"x²+5x","hint":"Умножи x по всеки член в скобата.","solution":"x·x+x·5=x²+5x.","alt":["x^2+5x"],"visual":""},{"q":"Извършете умножението: 5x(x²−y).","answer":"5x³-5xy","hint":"Умножете едночлена 5x с всеки член на скобата.","solution":"5x(x²−y)=5x³−5xy.","alt":["5x^3-5xy"],"visual":""},{"q":"Извършете умножението: x(2x³+x²−3x+1).","answer":"2x⁴+x³-3x²+x","hint":"Умножете x с всеки член на многочлена.","solution":"x(2x³+x²−3x+1)=2x⁴+x³−3x²+x.","alt":["2x^4+x^3-3x^2+x"],"visual":""},{"q":"Извършете умножението: (x+4)(x+1).","answer":"x²+5x+4","hint":"Умножете всеки член на първата скоба с всеки член на втората.","solution":"(x+4)(x+1)=x²+x+4x+4=x²+5x+4.","alt":["x^2+5x+4"],"visual":""}],"medium":[{"q":"Извършете умножението и приведете получения многочлен в нормален вид: (x + 2)(x + 4).","answer":"x²+6x+8","hint":"Всеки член от първата скоба умножи по всеки от втората.","solution":"x²+4x+2x+8=x²+6x+8.","alt":["x^2+6x+8"],"visual":""},{"q":"Извършете умножението: (2x−3)(x−4).","answer":"2x²-11x+12","hint":"Умножете почленно и приведете подобните.","solution":"(2x−3)(x−4)=2x²−8x−3x+12=2x²−11x+12.","alt":["2x^2-11x+12"],"visual":""},{"q":"Извършете умножението: (x²+3)(2x−3).","answer":"2x³-3x²+6x-9","hint":"Умножете x²+3 с всеки член на двучлена 2x−3.","solution":"(x²+3)(2x−3)=2x³−3x²+6x−9.","alt":["2x^3-3x^2+6x-9"],"visual":""},{"q":"Извършете умножението: (x−5)(x²+x+1).","answer":"x³-4x²-4x-5","hint":"Умножете всеки член на многочлена с x и с −5.","solution":"(x−5)(x²+x+1)=x³−4x²−4x−5.","alt":["x^3-4x^2-4x-5"],"visual":""}],"hard":[{"q":"Извършете действията и приведете получения многочлен в нормален вид: (2x − 3)(x + 4) − x(x − 1).","answer":"x²+6x-12","hint":"Разкрий двете произведения и приведи подобните членове.","solution":"2x²+8x−3x−12−x²+x=x²+6x−12.","alt":["x^2+6x-12"],"visual":""},{"q":"Извършете умножението: (x²−3)(x²+2x−5).","answer":"x⁴+2x³-8x²-6x+15","hint":"Умножете всеки член на първия многочлен с всеки член на втория.","solution":"(x²−3)(x²+2x−5)=x⁴+2x³−8x²−6x+15.","alt":["x^4+2x^3-8x^2-6x+15"],"visual":""},{"q":"Извършете умножението: (2x−y−1)(x−2y+1).","answer":"2x²-5xy+2y²+x+y-1","hint":"Разгледайте всеки от трите члена на първата скоба поотделно.","solution":"(2x−y−1)(x−2y+1)=2x²−5xy+2y²+x+y−1.","alt":["2x^2-5xy+2y^2+x+y-1"],"visual":""},{"q":"Извършете умножението: (x+2)(x²−x+1)(x−2).","answer":"x⁴-x³-3x²+4x-4","hint":"Умножете последователно два от множителите, после резултата с третия.","solution":"(x+2)(x²−x+1)(x−2)=x⁴−x³−3x²+4x−4.","alt":["x^4-x^3-3x^2+4x-4"],"visual":""}]}},"4":{"skill1":{"easy":[{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x+2)².","answer":"x²+4x+4","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²+4x+4.","alt":["x^2+4x+4"],"visual":""},{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x+3)².","answer":"x²+6x+9","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²+6x+9.","alt":["x^2+6x+9"],"visual":""},{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x+4)².","answer":"x²+8x+16","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²+8x+16.","alt":["x^2+8x+16"],"visual":""},{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x+5)².","answer":"x²+10x+25","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²+10x+25.","alt":["x^2+10x+25"],"visual":""},{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x+10)².","answer":"x²+20x+100","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²+20x+100.","alt":["x^2+20x+100"],"visual":""}],"medium":[{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x−5)².","answer":"x²-10x+25","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²−10x+25.","alt":["x^2-10x+25"],"visual":""},{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x−6)².","answer":"x²-12x+36","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²−12x+36.","alt":["x^2-12x+36"],"visual":""},{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x−7)².","answer":"x²-14x+49","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²−14x+49.","alt":["x^2-14x+49"],"visual":""},{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x−8)².","answer":"x²-16x+64","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²−16x+64.","alt":["x^2-16x+64"],"visual":""},{"q":"Използвайте формула за съкратено умножение и приведете израза в нормален вид: (x−9)².","answer":"x²-18x+81","hint":"Използвай (a±b)²=a²±2ab+b².","solution":"x²−18x+81.","alt":["x^2-18x+81"],"visual":""}],"hard":[{"q":"Попълнете липсващия коефициент: (x + 8)² = x² + □x + 64.","answer":"16","hint":"Средният член е 2·x·k, затова коефициентът пред x е 2k.","solution":"Липсващият коефициент е 16.","alt":[],"visual":""},{"q":"Попълнете липсващия коефициент: (x + 9)² = x² + □x + 81.","answer":"18","hint":"Средният член е 2·x·k, затова коефициентът пред x е 2k.","solution":"Липсващият коефициент е 18.","alt":[],"visual":""},{"q":"Попълнете липсващия коефициент: (x + 11)² = x² + □x + 121.","answer":"22","hint":"Средният член е 2·x·k, затова коефициентът пред x е 2k.","solution":"Липсващият коефициент е 22.","alt":[],"visual":""},{"q":"Попълнете липсващия коефициент: (x + 7)² = x² + □x + 49.","answer":"14","hint":"Средният член е 2·x·k, затова коефициентът пред x е 2k.","solution":"Липсващият коефициент е 14.","alt":[],"visual":""},{"q":"Попълнете липсващия коефициент: (x + 12)² = x² + □x + 144.","answer":"24","hint":"Средният член е 2·x·k, затова коефициентът пред x е 2k.","solution":"Липсващият коефициент е 24.","alt":[],"visual":""}]},"skill2":{"easy":[{"q":"Използвайте формула за съкратено умножение и приведете произведението в нормален вид: (x − 5)(x + 5).","answer":"x²-25","hint":"Това е разлика на квадрати.","solution":"(x−5)(x+5)=x²−25.","alt":["x^2-25"],"visual":""},{"q":"Извършете умножението: (a+2)(a−2).","answer":"a²-4","hint":"Приложете формулата (a+b)(a−b)=a²−b².","solution":"(a+2)(a−2)=a²−4.","alt":["a^2-4"],"visual":""},{"q":"Извършете умножението: (x+3)(x−3).","answer":"x²-9","hint":"Произведение на сбор и разлика на едни и същи изрази.","solution":"(x+3)(x−3)=x²−9.","alt":["x^2-9"],"visual":""},{"q":"Извършете умножението: (x−6)(x+6).","answer":"x²-36","hint":"Това е разлика на квадрати.","solution":"(x−6)(x+6)=x²−36.","alt":["x^2-36"],"visual":""},{"q":"Извършете умножението: (b+4)(b−4).","answer":"b²-16","hint":"Приложете формулата (a+b)(a−b)=a²−b².","solution":"(b+4)(b−4)=b²−16.","alt":["b^2-16"],"visual":""}],"medium":[{"q":"Пресметнете по рационален начин, като използвате формула за съкратено умножение: 53² − 47².","answer":"600","hint":"Използвай a²−b²=(a−b)(a+b).","solution":"(53−47)(53+47)=6·100=600.","alt":[],"visual":""},{"q":"Пресметнете рационално: 27·33.","answer":"891","hint":"Представете 27=30−3 и 33=30+3, приложете a²−b².","solution":"27·33=(30−3)(30+3)=900−9=891.","alt":[],"visual":""},{"q":"Пресметнете рационално: 62·58.","answer":"3596","hint":"Представете 62=60+2 и 58=60−2.","solution":"62·58=(60+2)(60−2)=3600−4=3596.","alt":[],"visual":""},{"q":"Пресметнете по рационален начин, като използвате формула за съкратено умножение: 45² − 35².","answer":"800","hint":"Използвай a²−b²=(a−b)(a+b).","solution":"(45−35)(45+35)=10·80=800.","alt":[],"visual":""},{"q":"Пресметнете рационално: 24·36.","answer":"864","hint":"Представете 24=30−6 и 36=30+6, приложете a²−b².","solution":"24·36=(30−6)(30+6)=900−36=864.","alt":[],"visual":""}],"hard":[{"q":"Използвайте формули за съкратено умножение и приведете израза в нормален вид: (3x − 2)(3x + 2) − (3x − 1)².","answer":"6x-5","hint":"Използвай разлика на квадрати и квадрат на разлика.","solution":"9x²−4−(9x²−6x+1)=6x−5.","alt":[],"visual":""},{"q":"Опростете израза: (a+3)(a−3)(a²+9).","answer":"a⁴-81","hint":"Първо приложете a²−b² за първите два множителя.","solution":"(a+3)(a−3)(a²+9)=(a²−9)(a²+9)=a⁴−81.","alt":["a^4-81"],"visual":""},{"q":"Пресметнете рационално: 59·61.","answer":"3599","hint":"Представете числата като 60−1 и 60+1.","solution":"59·61=(60−1)(60+1)=3600−1=3599.","alt":[],"visual":""},{"q":"Използвайте формули за съкратено умножение и приведете израза в нормален вид: (2x − 3)(2x + 3) − (2x − 1)².","answer":"4x-10","hint":"Използвай разлика на квадрати и квадрат на разлика.","solution":"4x²−9−(4x²−4x+1)=4x−10.","alt":[],"visual":""},{"q":"Пресметнете рационално: 98·102.","answer":"9996","hint":"Представете числата като 100−2 и 100+2.","solution":"98·102=(100−2)(100+2)=10000−4=9996.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"Разложете многочлена x³ − 8 на множители чрез формула за съкратено умножение.","answer":"(x-2)(x²+2x+4)","hint":"Използвай a³−b³=(a−b)(a²+ab+b²).","solution":"x³−2³=(x−2)(x²+2x+4).","alt":["(x-2)(x^2+2x+4)"],"visual":""},{"q":"Извършете степенуването: (a−2)³.","answer":"a³-6a²+12a-8","hint":"Приложете формулата (a−b)³=a³−3a²b+3ab²−b³.","solution":"(a−2)³=a³−3a²·2+3a·4−8=a³−6a²+12a−8.","alt":["a^3-6a^2+12a-8"],"visual":""},{"q":"Извършете степенуването: (3+x)³.","answer":"27+27x+9x²+x³","hint":"Приложете формулата (a+b)³=a³+3a²b+3ab²+b³ с a=3, b=x.","solution":"(3+x)³=27+27x+9x²+x³.","alt":["27+27x+9x^2+x^3"],"visual":""},{"q":"Разложете многочлена x³ − 27 на множители чрез формула за съкратено умножение.","answer":"(x-3)(x²+3x+9)","hint":"Използвай a³−b³=(a−b)(a²+ab+b²).","solution":"x³−3³=(x−3)(x²+3x+9).","alt":["(x-3)(x^2+3x+9)"],"visual":""},{"q":"Извършете степенуването: (a−3)³.","answer":"a³-9a²+27a-27","hint":"Приложете формулата (a−b)³=a³−3a²b+3ab²−b³.","solution":"(a−3)³=a³−3a²·3+3a·9−27=a³−9a²+27a−27.","alt":["a^3-9a^2+27a-27"],"visual":""}],"medium":[{"q":"Използвайте формула за съкратено умножение и приведете израза (x + 2)³ в нормален вид.","answer":"x³+6x²+12x+8","hint":"Използвай (a+b)³=a³+3a²b+3ab²+b³.","solution":"x³+6x²+12x+8.","alt":["x^3+6x^2+12x+8"],"visual":""},{"q":"Извършете степенуването: (2x+3)³.","answer":"8x³+36x²+54x+27","hint":"a=2x, b=3 в (a+b)³.","solution":"(2x+3)³=8x³+3·4x²·3+3·2x·9+27=8x³+36x²+54x+27.","alt":["8x^3+36x^2+54x+27"],"visual":""},{"q":"Запишете като произведение на двучлен и тричлен разликата: 8x³−125.","answer":"(2x-5)(4x²+10x+25)","hint":"Приложете a³−b³=(a−b)(a²+ab+b²) с a=2x, b=5.","solution":"8x³−125=(2x)³−5³=(2x−5)(4x²+10x+25).","alt":["(2x-5)(4x^2+10x+25)"],"visual":""},{"q":"Използвайте формула за съкратено умножение и приведете израза (x + 4)³ в нормален вид.","answer":"x³+12x²+48x+64","hint":"Използвай (a+b)³=a³+3a²b+3ab²+b³.","solution":"x³+12x²+48x+64.","alt":["x^3+12x^2+48x+64"],"visual":""},{"q":"Запишете като произведение на двучлен и тричлен разликата: 27x³−8.","answer":"(3x-2)(9x²+6x+4)","hint":"Приложете a³−b³=(a−b)(a²+ab+b²) с a=3x, b=2.","solution":"27x³−8=(3x)³−2³=(3x−2)(9x²+6x+4).","alt":["(3x-2)(9x^2+6x+4)"],"visual":""}],"hard":[{"q":"Използвайте формули за съкратено умножение и приведете израза (x + 1)³ − (x − 1)³ в нормален вид.","answer":"6x²+2","hint":"Разкрий двата куба и извади втория израз.","solution":"(x³+3x²+3x+1)−(x³−3x²+3x−1)=6x²+2.","alt":["6x^2+2"],"visual":""},{"q":"Опростете израза: (x+2)³−x(x−2)².","answer":"10x²+8x+8","hint":"Разкрийте куба и квадрата поотделно, после приведете.","solution":"(x+2)³−x(x−2)²=x³+6x²+12x+8−x³+4x²−4x=10x²+8x+8.","alt":["10x^2+8x+8"],"visual":""},{"q":"При x=−4/3 намерете числената стойност на израза A=x³+3x²+3x+1.","answer":"-1/27","hint":"Разпознайте, че A=(x+1)³.","solution":"A=(x+1)³=(−4/3+1)³=(−1/3)³=−1/27.","alt":[],"visual":""},{"q":"Използвайте формули за съкратено умножение и приведете израза (x + 2)³ − (x − 2)³ в нормален вид.","answer":"12x²+16","hint":"Разкрий двата куба и извади втория израз.","solution":"(x³+6x²+12x+8)−(x³−6x²+12x−8)=12x²+16.","alt":["12x^2+16"],"visual":""},{"q":"Опростете израза: (x+3)³ − x(x−3)².","answer":"15x²+18x+27","hint":"Разкрийте куба и квадрата поотделно, после приведете.","solution":"(x+3)³−x(x−3)²=x³+9x²+27x+27−x³+6x²−9x=15x²+18x+27.","alt":["15x^2+18x+27"],"visual":""}]}},"5":{"skill1":{"easy":[{"q":"Разложете многочлена 6x² − 12x на множители чрез изнасяне на общ множител.","answer":"6x(x-2)","hint":"Изнеси най-големия общ множител.","solution":"6x²−12x=6x(x−2).","alt":[],"visual":""},{"q":"Разложете на множители: 3a+15.","answer":"3(a+5)","hint":"Изнесете общия множител 3.","solution":"3a+15=3a+3·5=3(a+5).","alt":[],"visual":""},{"q":"Разложете на множители: 12x−18.","answer":"6(2x-3)","hint":"Намерете най-големия общ делител на 12 и 18.","solution":"12x−18=6(2x−3).","alt":[],"visual":""},{"q":"Разложете на множители: 4m+8.","answer":"4(m+2)","hint":"Изнесете общия множител 4.","solution":"4m+8=4(m+2).","alt":[],"visual":""}],"medium":[{"q":"Разложете многочлена 8a³b − 12a²b² на множители чрез изнасяне на общ множител.","answer":"4a²b(2a-3b)","hint":"Общият множител е 4a²b.","solution":"8a³b−12a²b²=4a²b(2a−3b).","alt":["4a^2b(2a-3b)"],"visual":""},{"q":"Разложете на множители: 4a+8ab+12ab².","answer":"4a(1+2b+3b²)","hint":"Изнесете общия множител 4a.","solution":"4a+8ab+12ab²=4a·1+4a·2b+4a·3b²=4a(1+2b+3b²).","alt":["4a(1+2b+3b^2)"],"visual":""},{"q":"Разложете на множители: a²x²−ax³+a³x².","answer":"ax²(a-x+a²)","hint":"Изнесете най-ниските степени на общите букви a и x.","solution":"a²x²−ax³+a³x²=ax²(a−x+a²).","alt":["ax^2(a-x+a^2)"],"visual":""},{"q":"Разложете на множители: 15u³v²+10u²v−20u²v³.","answer":"5u²v(3uv+2-4v²)","hint":"Изнесете общия множител 5u²v.","solution":"15u³v²+10u²v−20u²v³=5u²v(3uv+2−4v²).","alt":["5u^2v(3uv+2-4v^2)"],"visual":""}],"hard":[{"q":"Разложете многочлена 15x⁴y² + 10x³y³ − 5x²y² на множители чрез изнасяне на общ множител.","answer":"5x²y²(3x²+2xy-1)","hint":"Изнеси общ множител от всички три члена.","solution":"Общият множител е 5x²y², следователно 15x⁴y² + 10x³y³ − 5x²y² = 5x²y²(3x² + 2xy − 1).","alt":["5x^2y^2(3x^2+2xy-1)"],"visual":""},{"q":"Разложете на множители: 5a(a−b)+b(b−a).","answer":"(a-b)(5a-b)","hint":"Използвайте, че b−a=−(a−b).","solution":"5a(a−b)+b(b−a)=5a(a−b)−b(a−b)=(a−b)(5a−b).","alt":[],"visual":""},{"q":"Разложете на множители: a²(x−1)−3(1−x)².","answer":"(x-1)(a²-3x+3)","hint":"Забележете, че (1−x)²=(x−1)², после изнесете общия множител (x−1).","solution":"a²(x−1)−3(1−x)²=a²(x−1)−3(x−1)²=(x−1)(a²−3(x−1))=(x−1)(a²−3x+3).","alt":["(x-1)(a^2-3x+3)"],"visual":""},{"q":"Разложете на множители: p(x−y)²−q(x−y)².","answer":"(x-y)²(p-q)","hint":"(x−y)² е общ множител.","solution":"p(x−y)²−q(x−y)²=(x−y)²(p−q).","alt":["(x-y)^2(p-q)"],"visual":""}]},"skill2":{"easy":[{"q":"Разложете многочлена x² − 49 на множители чрез формула за съкратено умножение.","answer":"(x-7)(x+7)","hint":"Разлика на квадрати.","solution":"x²−7²=(x−7)(x+7).","alt":["(x+7)(x-7)"],"visual":""},{"q":"Разложете на множители: x²−9.","answer":"(x+3)(x-3)","hint":"Разпознайте разлика на квадрати: x²−3².","solution":"x²−9=x²−3²=(x+3)(x−3).","alt":[],"visual":""},{"q":"Разложете на множители: 16a²−b².","answer":"(4a+b)(4a-b)","hint":"16a²=(4a)².","solution":"16a²−b²=(4a)²−b²=(4a+b)(4a−b).","alt":[],"visual":""},{"q":"Разложете на множители: x²+4x+4.","answer":"(x+2)²","hint":"Проверете дали трите члена отговарят на a²+2ab+b².","solution":"x²+4x+4=x²+2·x·2+2²=(x+2)².","alt":["(x+2)^2"],"visual":""}],"medium":[{"q":"Разложете многочлена x² + 10x + 25 на множители чрез формула за съкратено умножение.","answer":"(x+5)²","hint":"Разпознай квадрат на сбор.","solution":"x²+2·5x+25=(x+5)².","alt":["(x+5)^2"],"visual":""},{"q":"Разложете на множители: 9m²−6m+1.","answer":"(3m-1)²","hint":"Подредете тричлена и проверете условието за точен квадрат.","solution":"9m²−6m+1=(3m)²−2·3m·1+1²=(3m−1)².","alt":["(3m-1)^2"],"visual":""},{"q":"Разложете на множители: x³+3x²y+3xy²+y³.","answer":"(x+y)³","hint":"Проверете формата a³+3a²b+3ab²+b³.","solution":"x³+3x²y+3xy²+y³=(x+y)³.","alt":["(x+y)^3"],"visual":""},{"q":"Разложете на множители: 27−27x+9x²−x³.","answer":"(3-x)³","hint":"Подредете по намаляващи степени на x и сравнете с (a−b)³.","solution":"27−27x+9x²−x³=3³−3·3²x+3·3x²−x³=(3−x)³.","alt":["(3-x)^3"],"visual":""}],"hard":[{"q":"Разложете многочлена 9x² − 24x + 16 на множители чрез формула за съкратено умножение.","answer":"(3x-4)²","hint":"Разпознай квадрат на разлика.","solution":"(3x)²−2·3x·4+4²=(3x−4)².","alt":["(3x-4)^2"],"visual":""},{"q":"Разложете на множители: 8x³−12x²+6x−1.","answer":"(2x-1)³","hint":"Проверете дали изразът отговаря на a³−3a²b+3ab²−b³ с a=2x, b=1.","solution":"8x³−12x²+6x−1=(2x)³−3(2x)²·1+3·2x·1²−1³=(2x−1)³.","alt":["(2x-1)^3"],"visual":""},{"q":"Разложете на множители: a³−27.","answer":"(a-3)(a²+3a+9)","hint":"27=3³, приложете a³−b³=(a−b)(a²+ab+b²).","solution":"a³−27=(a−3)(a²+3a+9).","alt":["(a-3)(a^2+3a+9)"],"visual":""},{"q":"Изразът 9a²−12a+4 в разложен вид е?","answer":"(3a-2)²","hint":"Проверете дали 12a=2·3a·2.","solution":"9a²−12a+4=(3a)²−2·3a·2+2²=(3a−2)².","alt":["(3a-2)^2"],"visual":""}]},"skill3":{"easy":[{"q":"Разложете многочлена ax + ay + bx + by на множители чрез групиране.","answer":"(a+b)(x+y)","hint":"Групирай първите два и последните два члена.","solution":"a(x+y)+b(x+y)=(a+b)(x+y).","alt":["(x+y)(a+b)"],"visual":""},{"q":"Разложете на множители чрез групиране: ax+a+3x+3.","answer":"(a+3)(x+1)","hint":"Групирайте първите два и последните два члена.","solution":"ax+a+3x+3=a(x+1)+3(x+1)=(a+3)(x+1).","alt":[],"visual":""},{"q":"Разложете на множители чрез групиране: x²+3x+2.","answer":"(x+1)(x+2)","hint":"Разбийте средния член 3x=x+2x.","solution":"x²+3x+2=x²+x+2x+2=x(x+1)+2(x+1)=(x+1)(x+2).","alt":[],"visual":""},{"q":"Разложете на множители чрез групиране: x²−5x+6.","answer":"(x-2)(x-3)","hint":"Разбийте средния член: −5x=−2x−3x.","solution":"x²−5x+6=x²−2x−3x+6=x(x−2)−3(x−2)=(x−2)(x−3).","alt":[],"visual":""}],"medium":[{"q":"Разложете многочлена x² + 3x + 2x + 6 на множители чрез групиране.","answer":"(x+2)(x+3)","hint":"Групирай по двойки.","solution":"x(x+3)+2(x+3)=(x+2)(x+3).","alt":["(x+3)(x+2)"],"visual":""},{"q":"Разложете на множители: A=x²+ax−2x−2a.","answer":"(x+a)(x-2)","hint":"Групирайте членовете по двойки: (x²+ax) и (−2x−2a).","solution":"A=x(x+a)−2(x+a)=(x+a)(x−2).","alt":[],"visual":""},{"q":"Разложете чрез групиране: x²y−y+xy²−x.","answer":"(x+y)(xy-1)","hint":"Групирайте (x²y+xy²) и (−y−x), после изнесете отново.","solution":"x²y−y+xy²−x=xy(x+y)−(x+y)=(x+y)(xy−1).","alt":[],"visual":""},{"q":"Разложете на множители: x²+2x−15.","answer":"(x-3)(x+5)","hint":"Разбийте средния член: 2x=−3x+5x.","solution":"x²+2x−15=x²−3x+5x−15=x(x−3)+5(x−3)=(x−3)(x+5).","alt":[],"visual":""}],"hard":[{"q":"Разложете многочлена 3x³ − 12x на множители, като приложите последователно подходящи методи.","answer":"3x(x-2)(x+2)","hint":"Първо изнеси общ множител, после използвай разлика на квадрати.","solution":"3x(x²−4)=3x(x−2)(x+2).","alt":["3x(x+2)(x-2)"],"visual":""},{"q":"Разложете на множители: a²−2ab+b²−c².","answer":"(a-b+c)(a-b-c)","hint":"Първите три члена образуват точен квадрат (a−b)².","solution":"a²−2ab+b²−c²=(a−b)²−c²=(a−b+c)(a−b−c).","alt":[],"visual":""},{"q":"Разложете на множители: a⁴−b⁴.","answer":"(a-b)(a+b)(a²+b²)","hint":"Приложете разлика на квадрати два пъти.","solution":"a⁴−b⁴=(a²−b²)(a²+b²)=(a−b)(a+b)(a²+b²).","alt":["(a-b)(a+b)(a^2+b^2)"],"visual":""},{"q":"Разложете на множители: 4a²−x²+6x−9.","answer":"(2a-x+3)(2a+x-3)","hint":"Последните три члена образуват −(x−3)², после разлика на квадрати.","solution":"4a²−x²+6x−9=4a²−(x²−6x+9)=(2a)²−(x−3)²=(2a−x+3)(2a+x−3).","alt":[],"visual":""}]}},"6":{"skill1":{"easy":[{"q":"Решете уравнението: 3x − 4 = 14.","answer":"6","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"3x = 18 ⇒ x = 6.","alt":[],"visual":""},{"q":"Решете уравнението: 5x + 7 = 17.","answer":"2","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"5x = 10 ⇒ x = 2.","alt":[],"visual":""},{"q":"Решете уравнението: 4x − 9 = 11.","answer":"5","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"4x = 20 ⇒ x = 5.","alt":[],"visual":""},{"q":"Решете уравнението: 6x − 7 = 17.","answer":"4","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"6x = 24 ⇒ x = 4.","alt":[],"visual":""},{"q":"Решете уравнението: 8x + 6 = 30.","answer":"3","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"8x = 24 ⇒ x = 3.","alt":[],"visual":""}],"medium":[{"q":"Решете уравнението: 7x − 11 = 17.","answer":"4","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"7x = 28 ⇒ x = 4.","alt":[],"visual":""},{"q":"Решете уравнението: 9x + 5 = -13.","answer":"-2","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"9x = -18 ⇒ x = -2.","alt":[],"visual":""},{"q":"Решете уравнението: 6x − 13 = 35.","answer":"8","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"6x = 48 ⇒ x = 8.","alt":[],"visual":""},{"q":"Решете уравнението: 8x + 9 = −15.","answer":"-3","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"8x = −24 ⇒ x = −3.","alt":[],"visual":""},{"q":"Решете уравнението: 5x − 14 = 21.","answer":"7","hint":"Изолирай члена с x, после раздели на коефициента.","solution":"5x = 35 ⇒ x = 7.","alt":[],"visual":""}],"hard":[{"q":"Решете уравнението: 0,4x − 1,2 = 2,8.","answer":"10","hint":"Премести свободния член и раздели на 0,4.","solution":"0,4x = 4 ⇒ x = 10.","alt":[],"visual":""},{"q":"Решете уравнението: −1,5x + 2,5 = 7.","answer":"-3","hint":"Премести 2,5 в дясната страна и раздели на −1,5.","solution":"−1,5x = 4,5 ⇒ x = −3.","alt":["−3"],"visual":""},{"q":"Решете уравнението: 2,4x + 3,6 = −6.","answer":"-4","hint":"Премести 3,6 в дясната страна и раздели на 2,4.","solution":"2,4x = −9,6 ⇒ x = −4.","alt":["−4"],"visual":""},{"q":"Решете уравнението: 0,3x + 1,4 = 4,1.","answer":"9","hint":"Премести свободния член и раздели на 0,3.","solution":"0,3x = 2,7 ⇒ x = 9.","alt":[],"visual":""},{"q":"Решете уравнението: −0,8x + 1,6 = 8.","answer":"-8","hint":"Премести 1,6 в дясната страна и раздели на −0,8.","solution":"−0,8x = 6,4 ⇒ x = −8.","alt":["−8"],"visual":""}]},"skill2":{"easy":[{"q":"Решете уравнението: 2(x + 3) = 14.","answer":"4","hint":"Раздели на 2, после извади 3.","solution":"x+3=7 ⇒ x=4.","alt":[],"visual":""},{"q":"Решете: 5(1−x)=−10x.","answer":"-1","hint":"Разкрий скобата вляво.","solution":"5−5x=−10x ⇒ 5x=−5 ⇒ x=−1.","alt":[],"visual":""},{"q":"Решете: 2(x+4)=4(x−1).","answer":"6","hint":"Разкрий и двете скоби.","solution":"2x+8=4x−4 ⇒ −2x=−12 ⇒ x=6.","alt":[],"visual":""},{"q":"Решете уравнението: 5(x − 1) = 20.","answer":"5","hint":"Раздели на 5, после прибави 1.","solution":"x − 1 = 4 ⇒ x = 5.","alt":[],"visual":""},{"q":"Решете: 3(2 − x) = −6x.","answer":"-2","hint":"Разкрий скобата вляво.","solution":"6 − 3x = −6x ⇒ 3x = −6 ⇒ x = −2.","alt":[],"visual":""}],"medium":[{"q":"Решете уравнението: 3(x − 4) + 5 = 2x + 1.","answer":"8","hint":"Разкрий скобата и събери подобните членове.","solution":"3x−12+5=2x+1 ⇒ x=8.","alt":[],"visual":""},{"q":"Решете: 3(x−2)−4(x+3)=2x+3.","answer":"-7","hint":"Внимавай със знака минус пред втората скоба.","solution":"3x−6−4x−12=2x+3 ⇒ −x−18=2x+3 ⇒ −3x=21 ⇒ x=−7.","alt":[],"visual":""},{"q":"Решете: 2(3−x)+(x−1)−15=3(2x−1).","answer":"-1","hint":"Разкрий и трите скоби, приведи подобните членове.","solution":"−x−10=6x−3 ⇒ −7x=7 ⇒ x=−1.","alt":[],"visual":""},{"q":"Решете уравнението: 4(x − 3) + 7 = 3x − 2.","answer":"3","hint":"Разкрий скобата и събери подобните членове.","solution":"4x − 12 + 7 = 3x − 2 ⇒ x = 3.","alt":[],"visual":""},{"q":"Решете: 4(x − 1) − 3(x + 2) = 3x − 4.","answer":"-3","hint":"Внимавай със знака минус пред втората скоба.","solution":"4x − 4 − 3x − 6 = 3x − 4 ⇒ x − 10 = 3x − 4 ⇒ −2x = 6 ⇒ x = −3.","alt":[],"visual":""}],"hard":[{"q":"Решете уравнението: 4 − 2(3x − 5) = 5(x + 1) − 7.","answer":"16/11","hint":"Разкрий двете скоби, като обърнеш внимание на знака минус пред първата скоба, и приведи подобните членове.","solution":"14 − 6x = 5x − 2 ⇒ 16 = 11x ⇒ x = 16/11.","alt":[],"visual":""},{"q":"Решете: 3−(x+1−(x−6))=4x+5.","answer":"-9/4","hint":"Опрости вложената скоба x+1−(x−6) първо.","solution":"3−7=4x+5 ⇒ −4=4x+5 ⇒ x=−9/4.","alt":[],"visual":""},{"q":"Решете: 5−x−(−x+2(x−1))=4x+5.","answer":"1/3","hint":"Опрости вложената скоба −x+2(x−1) първо.","solution":"7−2x=4x+5 ⇒ 2=6x ⇒ x=1/3.","alt":[],"visual":""},{"q":"Решете уравнението: 3 − 2(2x − 3) = 5(x − 1) + 4.","answer":"10/9","hint":"Разкрий двете скоби, като обърнеш внимание на знака минус пред първата скоба, и приведи подобните членове.","solution":"3 − 4x + 6 = 5x − 1 ⇒ 9 − 4x = 5x − 1 ⇒ 10 = 9x ⇒ x = 10/9.","alt":[],"visual":""},{"q":"Решете: 8 − x − (−x + 3(x − 2)) = 5x + 1.","answer":"13/8","hint":"Опрости вложената скоба −x + 3(x − 2) първо.","solution":"14 − 3x = 5x + 1 ⇒ 13 = 8x ⇒ x = 13/8.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"Решете уравнението: 5x + 2 = 3x + 10.","answer":"4","hint":"Събери членовете с x от едната страна.","solution":"2x=8 ⇒ x=4.","alt":[],"visual":""},{"q":"Решете: 6x+13=3x+4.","answer":"-3","hint":"Пренеси членовете с x вляво, числата — вдясно.","solution":"3x=−9 ⇒ x=−3.","alt":[],"visual":""},{"q":"Решете: 2x−5=x+2.","answer":"7","hint":"Пренеси x вляво, числата — вдясно.","solution":"x=7.","alt":[],"visual":""},{"q":"Решете уравнението: 7x − 3 = 4x + 15.","answer":"6","hint":"Пренеси членовете с x вляво, числата — вдясно.","solution":"3x = 18 ⇒ x = 6.","alt":[],"visual":""},{"q":"Решете: 3x + 8 = x − 2.","answer":"-5","hint":"Пренеси x вляво, числата — вдясно.","solution":"2x = −10 ⇒ x = −5.","alt":[],"visual":""}],"medium":[{"q":"Решете уравнението: 4(x − 2) = 2(2x − 4).","answer":"всяко x","hint":"След разкриване на скобите двете страни съвпадат.","solution":"Получава се 4x−8=4x−8, вярно за всяко x.","alt":["всяко х","всички реални числа","всяко число"],"visual":""},{"q":"Решете: 8x−5−3x=2x+7.","answer":"4","hint":"Приведи подобните членове вляво.","solution":"5x−5=2x+7 ⇒ 3x=12 ⇒ x=4.","alt":[],"visual":""},{"q":"Решете: 5,5x−3=0,5x+12.","answer":"3","hint":"Пренеси членовете с x вляво.","solution":"5x=15 ⇒ x=3.","alt":[],"visual":""},{"q":"Решете: 9x − 7 − 4x = 3x + 13.","answer":"10","hint":"Приведи подобните членове вляво.","solution":"5x − 7 = 3x + 13 ⇒ 2x = 20 ⇒ x = 10.","alt":[],"visual":""},{"q":"Решете уравнението: 6,5x + 2 = 6,5x − 3.","answer":"няма решение","hint":"Извади 6,5x от двете страни и виж какво остава.","solution":"2 = −3 — невярно, следователно няма решение.","alt":["няма корени"],"visual":""}],"hard":[{"q":"Решете уравнението: 3(x + 2) = 3x + 1.","answer":"няма решение","hint":"След разкриване неизвестните се унищожават.","solution":"3x+6=3x+1 ⇒ 6=1 — невярно, следователно няма решение.","alt":["няма корени"],"visual":""},{"q":"Решете уравнението: 2(2x − 3) + 5 = 4x − 1.","answer":"всяко x","hint":"Провери какво остава след разкриване на скобите.","solution":"4x−6+5=4x−1 ⇒ 4x−1=4x−1 — вярно за всяко x.","alt":["всяко х","всички реални числа"],"visual":""},{"q":"Решете: 4,5x−9=x+1,5x−1.","answer":"4","hint":"Приведи подобните членове вдясно.","solution":"4,5x−9=2,5x−1 ⇒ 2x=8 ⇒ x=4.","alt":[],"visual":""},{"q":"Решете уравнението: 5(2x − 1) = 10x − 5.","answer":"всяко x","hint":"Разкрий скобата и сравни двете страни.","solution":"10x − 5 = 10x − 5 — вярно за всяко x.","alt":["всяко х","всички реални числа","всяко число"],"visual":""},{"q":"Решете: 3,5x − 4 = x + 1,5x + 6.","answer":"10","hint":"Приведи подобните членове вдясно.","solution":"3,5x − 4 = 2,5x + 6 ⇒ x = 10.","alt":[],"visual":""}]}},"7":{"skill1":{"easy":[{"q":"Решете уравнението (x − 3)(x + 2) = 0. Запишете всички решения, разделени със запетая.","answer":"3,-2","hint":"Произведение е нула, ако поне един множител е нула.","solution":"x=3 или x=−2.","alt":[],"visual":""},{"q":"Решете: (x−6)(x−5)=0.","answer":"6, 5","hint":"Приравни всеки множител на нула.","solution":"x−6=0 ⇒ x=6; x−5=0 ⇒ x=5.","alt":[],"visual":""},{"q":"Решете: (x−6)(7−x)=0.","answer":"6, 7","hint":"Приравни всеки множител на нула.","solution":"x−6=0 ⇒ x=6; 7−x=0 ⇒ x=7.","alt":[],"visual":""},{"q":"Решете: (8−x)(9−x)=0.","answer":"8, 9","hint":"Приравни всеки множител на нула.","solution":"8−x=0 ⇒ x=8; 9−x=0 ⇒ x=9.","alt":[],"visual":""}],"medium":[{"q":"Решете уравнението (2x − 6)(x + 5) = 0. Запишете всички решения, разделени със запетая.","answer":"3,-5","hint":"Приравни всеки множител на нула.","solution":"2x−6=0 ⇒ x=3; x+5=0 ⇒ x=−5.","alt":[],"visual":""},{"q":"Решете: x²−4=0.","answer":"2,-2","hint":"Разложи като разлика на квадрати: (x−2)(x+2).","solution":"(x−2)(x+2)=0 ⇒ x=2 или x=−2.","alt":[],"visual":""},{"q":"Решете: 4x²−1=0.","answer":"1/2,-1/2","hint":"Разложи като разлика на квадрати.","solution":"(2x−1)(2x+1)=0 ⇒ x=1/2 или x=−1/2.","alt":[],"visual":""},{"q":"Решете: x²−3x=0.","answer":"0, 3","hint":"Изнеси общия множител x.","solution":"x(x−3)=0 ⇒ x=0 или x=3.","alt":[],"visual":""}],"hard":[{"q":"Решете уравнението (x² − 9)(x − 2) = 0. Запишете всички решения, разделени със запетая.","answer":"-3, 2, 3","hint":"Първо разложи x²−9 на множители.","solution":"(x−3)(x+3)(x−2)=0 ⇒ x=−3,2,3.","alt":[],"visual":""},{"q":"Решете: x²−6x+9=0.","answer":"3","hint":"Разпознай пълен квадрат (x−3)².","solution":"(x−3)²=0 ⇒ x=3 (двоен корен).","alt":[],"visual":""},{"q":"Решете: x²+4x−5=0.","answer":"-5, 1","hint":"Допълни до пълен квадрат или разложи на множители.","solution":"(x+5)(x−1)=0 ⇒ x=−5 или x=1.","alt":[],"visual":""},{"q":"Решете: (2x+3)²=(x−2)².","answer":"-1/3,-5","hint":"Пренеси всичко вляво и приложи a²−b².","solution":"(x+5)(3x+1)=0 ⇒ x=−1/3 или x=−5.","alt":[],"visual":""}]},"skill2":{"easy":[{"q":"Решете уравнението |x − 2| = 5. Запишете всички решения, разделени със запетая.","answer":"-3, 7","hint":"Разгледай x−2=5 и x−2=−5.","solution":"x=7 или x=−3.","alt":[],"visual":""},{"q":"Решете: |x−2|=5.","answer":"7,-3","hint":"Два случая: x−2=5 и x−2=−5.","solution":"x=7 или x=−3.","alt":[],"visual":""},{"q":"Решете: |x−1|=3.","answer":"4,-2","hint":"Два случая: x−1=3 и x−1=−3.","solution":"x=4 или x=−2.","alt":[],"visual":""},{"q":"Решете: |x+6|=1.","answer":"-5,-7","hint":"Два случая: x+6=1 и x+6=−1.","solution":"x=−5 или x=−7.","alt":[],"visual":""}],"medium":[{"q":"Решете уравнението |2x − 3| = 7. Запишете всички решения, разделени със запетая.","answer":"-2, 5","hint":"Два случая: 2x−3=7 и 2x−3=−7.","solution":"x=5 или x=−2.","alt":[],"visual":""},{"q":"Решете: |x−2|=−1.","answer":"няма решение","hint":"Модулът не може да бъде отрицателно число.","solution":"|x−2|≥0 за всяко x, а −1<0 ⇒ няма решение.","alt":["няма корени"],"visual":""},{"q":"Решете: −3|x−5|=−9.","answer":"8, 2","hint":"Раздели двете страни на −3 първо.","solution":"|x−5|=3 ⇒ x=8 или x=2.","alt":[],"visual":""},{"q":"Решете: |10−x|=5.","answer":"5, 15","hint":"Два случая: 10−x=5 и 10−x=−5.","solution":"x=5 или x=15.","alt":[],"visual":""}],"hard":[{"q":"Решете уравнението |x² − 4x| = 0. Запишете всички решения, разделени със запетая.","answer":"0, 4","hint":"Модул е нула само когато изразът вътре е нула.","solution":"x²−4x=x(x−4)=0 ⇒ x=0 или x=4.","alt":[],"visual":""},{"q":"Решете: |3(x−1)+4|=5.","answer":"4/3,-2","hint":"Опрости израза в модула, преди да разделиш на случаи.","solution":"|3x+1|=5 ⇒ x=4/3 или x=−2.","alt":[],"visual":""},{"q":"Решете: |x+3|−|−5x−15|=−8.","answer":"-1,-5","hint":"−5x−15=−5(x+3), затова |−5x−15|=5|x+3|.","solution":"|x+3|−5|x+3|=−4|x+3|=−8 ⇒ |x+3|=2 ⇒ x=−1 или x=−5.","alt":[],"visual":""},{"q":"Решете: 2|3x−1|−3|1−3x|=5.","answer":"няма решение","hint":"|1−3x|=|3x−1|.","solution":"−|3x−1|=5 ⇒ |3x−1|=−5 ⇒ няма решение.","alt":["няма корени"],"visual":""}]},"skill3":{"easy":[{"q":"Решете уравнението x(x + 2) − x² = 10.","answer":"5","hint":"Разкрий произведението — квадратните членове ще се съкратят.","solution":"x²+2x−x²=10 ⇒ 2x=10 ⇒ x=5.","alt":[],"visual":""},{"q":"Решете: (x+2)²−x(x+1)=0.","answer":"-4/3","hint":"Разкрий скобата и множението, x² се съкращава.","solution":"x²+4x+4−x²−x=0 ⇒ 3x+4=0 ⇒ x=−4/3.","alt":[],"visual":""},{"q":"Решете: (x−3)²−x(x+4)=5x−6.","answer":"1","hint":"Разкрий скобите — x² се съкращава от двете страни.","solution":"−10x+9=5x−6 ⇒ −15x=−15 ⇒ x=1.","alt":[],"visual":""},{"q":"Решете: (x+1)²−(x+2)(x−3)=x+15.","answer":"4","hint":"Разкрий скобите — x² се съкращава.","solution":"3x+7=x+15 ⇒ 2x=8 ⇒ x=4.","alt":[],"visual":""}],"medium":[{"q":"Решете уравнението (x + 3)² − x(x + 6) = 9.","answer":"всяко x","hint":"Разкрий двата израза и сравни страните.","solution":"x²+6x+9−x²−6x=9 ⇒ 9=9 — вярно за всяко x.","alt":["всяко х","всички реални числа"],"visual":""},{"q":"Решете: 6x²−(2x−1)(3x+1)=3(1−x).","answer":"1/2","hint":"Разкрий произведението (2x−1)(3x+1) — x² се съкращава.","solution":"x+1=3−3x ⇒ 4x=2 ⇒ x=1/2.","alt":[],"visual":""},{"q":"Решете: (2x+1)²−3=4(x²+1)+x.","answer":"2","hint":"Разкрий квадрата — членовете с x² се съкращават.","solution":"4x−2=4+x ⇒ 3x=6 ⇒ x=2.","alt":[],"visual":""},{"q":"Решете: (2x−5)²−(x+1)(x−1)=3(x²+2).","answer":"1","hint":"Разкрий скобите — x² се съкращава.","solution":"3x²−20x+26=3x²+6 ⇒ −20x=−20 ⇒ x=1.","alt":[],"visual":""}],"hard":[{"q":"Решете уравнението (x − 4)² − x(x − 8) = 5.","answer":"няма решение","hint":"След тъждествено преобразуване неизвестното може да изчезне.","solution":"x²−8x+16−x²+8x=5 ⇒ 16=5 — няма решение.","alt":["няма корени"],"visual":""},{"q":"Решете: (x−3)²=2(x−1)+11.","answer":"0, 8","hint":"Разкрий квадрата, приведи в едната страна и разложи на множители.","solution":"x²−8x=0 ⇒ x(x−8)=0 ⇒ x=0 или x=8.","alt":[],"visual":""},{"q":"Решете: (x+1)³−3x=(x+2)(x²−2x+4)+5.","answer":"2,-2","hint":"Разкрий куба и произведението — x³ се съкращава.","solution":"3x²+1=13 ⇒ x²=4 ⇒ x=2 или x=−2.","alt":[],"visual":""},{"q":"Решете: |x²−1|=3.","answer":"2,-2","hint":"Раздели на два случая: x²−1=3 и x²−1=−3.","solution":"x²−1=3 ⇒ x²=4 ⇒ x=2 или x=−2; x²−1=−3 няма решение (x²=−2).","alt":[],"visual":""}]}},"8":{"skill1":{"easy":[{"q":"Два автомобила тръгват едновременно един срещу друг от два града, разстоянието между които е 180 km. Скоростите им са 40 km/h и 50 km/h. След колко часа ще се срещнат?","answer":"2","hint":"Сборът на скоростите е 90 km/h.","solution":"(40+50)t=180 ⇒ t=2 h.","alt":[],"visual":""},{"q":"Разстоянието между градовете A и B е 360 km. От A за B тръгва камион със скорост 80 km/h, а в същото време от B за A тръгва лека кола със скорост с 20 km/h по-висока. Намерете след колко часа двете превозни средства ще се срещнат.","answer":"2","hint":"Сборът от изминатите разстояния е равен на 360 km.","solution":"80x+100x=360 ⇒ x=2 h.","alt":[],"visual":""},{"q":"Град C е между градовете A и B, като AC=40 km. От A за B тръгва лека кола със скорост 90 km/h, а от C за B — камион със скорост 70 km/h, в един и същ момент. Пристигат едновременно в B. Намерете времето на пътуване в часове.","answer":"2","hint":"Времената на двете превозни средства са равни.","solution":"90x=70x+40 ⇒ x=2 h.","alt":[],"visual":""},{"q":"Два автомобила тръгват едновременно един срещу друг от два града, разстоянието между които е 315 km. Скоростите им са 45 km/h и 60 km/h. След колко часа ще се срещнат?","answer":"3","hint":"Сборът на скоростите е 105 km/h.","solution":"(45+60)t=315 ⇒ t=3 h.","alt":[],"visual":""},{"q":"Град M е между градовете A и B, като AM=50 km. От A за B тръгва лека кола със скорост 90 km/h, а от M за B — камион със скорост 65 km/h, в един и същ момент. Пристигат едновременно в B. Намерете времето на пътуване в часове.","answer":"2","hint":"Времената на двете превозни средства са равни.","solution":"90x=65x+50 ⇒ x=2 h.","alt":[],"visual":""}],"medium":[{"q":"Моторист тръгва от дадено място със скорост 48 km/h. Един час по-късно от същото място, по същия път и в същата посока тръгва автомобил със скорост 72 km/h. След колко часа от тръгването си автомобилът ще настигне моториста?","answer":"2","hint":"Преднината е 48 km, а относителната скорост е 24 km/h.","solution":"48:(72−48)=2 h.","alt":[],"visual":""},{"q":"Моторна лодка изминава разстоянието между две пристанища и се връща обратно за 5½ h. Скоростта на лодката в спокойна вода е 16,5 km/h, а скоростта на течението е 1,5 km/h. Намерете разстоянието между пристанищата (в km).","answer":"45","hint":"Скоростта по течението е 18 km/h, а срещу течението — 15 km/h.","solution":"x/18+x/15=5,5 ⇒ x=45 km.","alt":[],"visual":""},{"q":"Пътник пътувал с влак от София за Кюстендил (90 km), престоял на гарата 20 min и се върнал в София със същия влак. Пътуването и престоят му отнели общо 3 h 40 min. Намерете скоростта на влака в km/h.","answer":"54","hint":"Извади престоя от общото време, за да получиш чистото време за път (за 180 km).","solution":"t=3ч40мин−20мин=10/3 h за 180 km ⇒ v=180:(10/3)=54 km/h.","alt":[],"visual":""},{"q":"Велосипедист тръгва от дадено място със скорост 18 km/h. Един час по-късно от същото място, по същия път и в същата посока тръгва мотоциклетист със скорост 30 km/h. След колко часа от тръгването си мотоциклетистът ще настигне велосипедиста?","answer":"1,5","hint":"Преднината е 18 km, а относителната скорост е 12 km/h.","solution":"18:(30−18)=1,5 h.","alt":[],"visual":""},{"q":"Моторна лодка изминава разстоянието между две пристанища и се връща обратно за 5 h. Скоростта на лодката в спокойна вода е 15 km/h, а скоростта на течението е 3 km/h. Намерете разстоянието между пристанищата (в km).","answer":"36","hint":"Скоростта по течението е 18 km/h, а срещу течението — 12 km/h.","solution":"x/18+x/12=5 ⇒ x=36 km.","alt":[],"visual":""}],"hard":[{"q":"Скоростта на моторна лодка в спокойна вода е 18 km/h, а скоростта на течението е 3 km/h. За колко часа общо лодката ще измине 63 km по течението и 45 km срещу течението?","answer":"6","hint":"Скоростите са 21 km/h и 15 km/h.","solution":"63:21 + 45:15 = 3+3=6 h.","alt":[],"visual":""},{"q":"Моторна лодка изминала разстоянието между две пристанища по течението на реката за 4 h, а обратно — срещу течението — за 5 h. Скоростта на течението е 2 km/h. Намерете разстоянието между пристанищата (в km).","answer":"80","hint":"Означи с v скоростта в спокойна вода и изравни разстоянията: 4(v+2)=5(v−2).","solution":"v=18 km/h ⇒ разстояние=4·20=80 km.","alt":[],"visual":""},{"q":"Турист, вървял от хижа към жп гара, изминал през първия час 3 km. Преценил, че ако запази скоростта си, ще закъснее за влака с 10 min. Затова изминал останалия път със скорост с 1 km/h по-висока и пристигнал 15 min преди тръгването на влака. Намерете разстоянието от хижата до гарата (в km).","answer":"8","hint":"Означи с x оставащото разстояние след първия час и изравни времената T.","solution":"x/3−1/6=x/4+1/4 ⇒ x=5 ⇒ общо разстояние=3+5=8 km.","alt":[],"visual":""},{"q":"Скоростта на моторна лодка в спокойна вода е 16 km/h, а скоростта на течението е 2 km/h. За колко часа общо лодката ще измине 90 km по течението и 70 km срещу течението?","answer":"10","hint":"Скоростите са 18 km/h и 14 km/h.","solution":"90:18 + 70:14 = 5+5=10 h.","alt":[],"visual":""},{"q":"Моторна лодка изминала разстоянието между две пристанища по течението на реката за 3 h, а обратно — срещу течението — за 5 h. Скоростта на течението е 4 km/h. Намерете разстоянието между пристанищата (в km).","answer":"60","hint":"Означи с v скоростта в спокойна вода и изравни разстоянията: 3(v+4)=5(v−4).","solution":"v=16 km/h ⇒ разстояние=3·20=60 km.","alt":[],"visual":""}]},"skill2":{"easy":[{"q":"Един работник може да извърши дадена работа за 6 h, а друг — за 3 h. За колко часа двамата ще извършат работата, ако работят заедно?","answer":"2","hint":"За 1 h извършват 1/6+1/3 от работата.","solution":"1/6+2/6=1/2 ⇒ 2 h.","alt":[],"visual":""},{"q":"Един работник може да свърши определена работа за 15 дни, а друг — за 10 дни. За колко дни ще я свършат заедно?","answer":"6","hint":"За 1 ден вършат заедно 1/15+1/10 от работата.","solution":"1/15+1/10=1/6 ⇒ 6 дни.","alt":[],"visual":""},{"q":"Един работник извършва определена работа за 2 h, а друг — за 4 h повече. За колко часа двамата заедно ще свършат тази работа?","answer":"1,5","hint":"Вторият работи за 6 h — намери сумата от нормите им за 1 h.","solution":"1/2+1/6=2/3 ⇒ време=3/2=1,5 h.","alt":["3/2"],"visual":""},{"q":"Един работник може да извърши дадена работа за 4 h, а друг — за 12 h. За колко часа двамата ще извършат работата, ако работят заедно?","answer":"3","hint":"За 1 h извършват 1/4+1/12 от работата.","solution":"3/12+1/12=4/12=1/3 ⇒ 3 h.","alt":[],"visual":""},{"q":"Един работник може да свърши определена работа за 20 дни, а друг — за 5 дни. За колко дни ще я свършат заедно?","answer":"4","hint":"За 1 ден вършат заедно 1/20+1/5 от работата.","solution":"1/20+4/20=5/20=1/4 ⇒ 4 дни.","alt":[],"visual":""}],"medium":[{"q":"Една тръба може да напълни басейн за 4 h, а друга — за 6 h. Каква част от басейна ще напълнят двете тръби заедно за 1 h?","answer":"5/12","hint":"Събери производителностите.","solution":"1/4+1/6=3/12+2/12=5/12.","alt":[],"visual":""},{"q":"Конвейер в автомобилен завод сглобява за 24 дни определено количество автомобили. Работил 22 дни с увеличена с 5 автомобила на ден норма и от конвейера слезли 80 автомобила над определеното количество. Намерете дневната норма на конвейера по план.","answer":"15","hint":"Съставете уравнение: 24x+80=22(x+5).","solution":"24x+80=22(x+5) ⇒ x=15 автомобила на ден.","alt":[],"visual":""},{"q":"Една тръба може да напълни басейн за 15 часа, а друга — за 10 часа. Ако първата тръба е работила сама 3 часа, а после отворили и втората, за колко часа общо се е напълнил басейнът?","answer":"7,8","hint":"Означи с x времето, през което двете тръби работят заедно, и изравни свършената работа с 1.","solution":"(x+3)/15+x/10=1 ⇒ 2(x+3)+3x=30 ⇒ 5x+6=30 ⇒ x=4,8 ⇒ общо време=3+4,8=7,8 h.","alt":["7.8","39/5"],"visual":""},{"q":"Една тръба може да напълни резервоар за 5 h, а друга — за 15 h. Каква част от резервоара ще напълнят двете тръби заедно за 1 h?","answer":"4/15","hint":"Събери производителностите.","solution":"1/5+1/15=3/15+1/15=4/15.","alt":[],"visual":""},{"q":"Една тръба може да напълни басейн за 10 часа, а друга — за 15 часа. Ако първата тръба е работила сама 5 часа, а после отворили и втората, за колко часа общо се е напълнил басейнът?","answer":"8","hint":"Означи с x общото време след включване на втората тръба и изравни свършената работа с 1.","solution":"(5+x)/10+x/15=1 ⇒ x=3 ⇒ общо време=5+3=8 h.","alt":[],"visual":""}],"hard":[{"q":"Работник A може да извърши дадена работа за 8 h, а работник B — за 12 h. A работи сам 2 h, след което двамата продължават заедно. Колко часа съвместна работа са необходими за довършване на работата?","answer":"18/5","hint":"След 2 h A е свършил 1/4 от работата. Остават 3/4.","solution":"Общата производителност е 5/24. t=(3/4):(5/24)=18/5 h.","alt":["3.6"],"visual":""},{"q":"Иван може да боядиса апартамент сам за 8 h, а Георги — за 12 h. Иван започва работа в 7 h, а Георги се включва в 10 h. В колко часа ще приключи работата?","answer":"13","hint":"Иван работи сам 3 h, после двамата довършват останалата работа заедно.","solution":"Останала работа=5/8, обща норма=5/24 ⇒ време=3 h ⇒ 10+3=13 h.","alt":[],"visual":""},{"q":"Асен трябвало да реши даден брой задачи за определен срок, като решава по 15 задачи на ден. Първите три дни той работил по план. След това увеличил дневната си норма с 20% и решил всички задачи 4 дни преди срока. Колко задачи е трябвало да реши Асен?","answer":"405","hint":"Увеличената норма е 18 задачи на ден; изравни общия брой задачи по двата начина.","solution":"15x=45+18(x−7) ⇒ x=27 ⇒ задачи=15·27=405.","alt":[],"visual":""},{"q":"Работник A може да извърши дадена работа за 10 h, а работник B — за 15 h. A работи сам 3 h, след което двамата продължават заедно. Колко часа съвместна работа са необходими за довършване на работата?","answer":"21/5","hint":"След 3 h A е свършил 3/10 от работата. Остават 7/10.","solution":"Общата производителност е 1/6. t=(7/10):(1/6)=21/5 h.","alt":["4,2"],"visual":""},{"q":"Стефан може да боядиса ограда сам за 9 h, а Радо — за 18 h. Стефан започва работа в 9 h, а Радо се включва в 12 h. В колко часа ще приключи работата?","answer":"16","hint":"Стефан работи сам 3 h, после двамата довършват останалата работа заедно.","solution":"Останала работа=2/3, обща норма=1/6 ⇒ време=4 h ⇒ 12+4=16 h.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"Бащата е с 24 години по-възрастен от сина си. След 4 години възрастта на бащата ще бъде два пъти възрастта на сина. На колко години е синът сега?","answer":"20","hint":"Нека синът е x, бащата x+24.","solution":"x+28=2(x+4) ⇒ x=20.","alt":[],"visual":""},{"q":"Стока струва 80 лв. Цената ѝ е намалена с 15%. Намерете новата цена на стоката.","answer":"68","hint":"Намалението е 12 лв.","solution":"80−0,15·80=68 лв.","alt":[],"visual":""},{"q":"Намислих число. Увеличих го с 3 и полученото число умножих с 5. Получих число, което е с 43 по-голямо от намисленото. Кое число съм намислил?","answer":"7","hint":"Съставете уравнението 5(x+3)=x+43.","solution":"5x+15=x+43 ⇒ 4x=28 ⇒ x=7.","alt":[],"visual":""},{"q":"Майката е с 27 години по-възрастна от дъщеря си. След 9 години възрастта на майката ще бъде два пъти възрастта на дъщерята. На колко години е дъщерята сега?","answer":"18","hint":"Нека дъщерята е x, майката x+27.","solution":"x+36=2(x+9) ⇒ x=18.","alt":[],"visual":""},{"q":"Стока струва 60 лв. Цената ѝ е увеличена с 20%. Намерете новата цена на стоката.","answer":"72","hint":"Увеличението е 12 лв.","solution":"60+0,20·60=72 лв.","alt":[],"visual":""}],"medium":[{"q":"Сума от 1200 лв. е внесена за една година при 5% годишна лихва. Намерете сумата в края на годината.","answer":"1260","hint":"Намери 5% от 1200 и прибави.","solution":"60+1200=1260 лв.","alt":[],"visual":""},{"q":"Смес с маса 10 kg съдържа 30% сол. Колко килограма сол има в сместа?","answer":"3","hint":"Намери 30% от 10.","solution":"0,30·10=3 kg.","alt":[],"visual":""},{"q":"Намислих положително число. Увеличих го 8 пъти и от полученото число извадих 5. Получих число, което е с 9 по-голямо от намисленото число. Кое число съм намислил?","answer":"2","hint":"Съставете уравнението 8x−5=x+9.","solution":"7x=14 ⇒ x=2.","alt":[],"visual":""},{"q":"Сума от 2000 лв. е внесена за една година при 4% годишна лихва. Намерете сумата в края на годината.","answer":"2080","hint":"Намери 4% от 2000 и прибави.","solution":"80+2000=2080 лв.","alt":[],"visual":""},{"q":"Разтвор с маса 40 kg съдържа 25% сол. Колко килограма сол има в разтвора?","answer":"10","hint":"Намери 25% от 40.","solution":"0,25·40=10 kg.","alt":[],"visual":""}],"hard":[{"q":"Смесват се 4 kg сплав, съдържаща 25% мед, и 6 kg сплав, съдържаща 50% мед. Колко процента мед съдържа получената сплав?","answer":"40","hint":"Намери количеството мед във всяка сплав, после раздели на общата маса.","solution":"1 kg + 3 kg = 4 kg мед от 10 kg ⇒ 40%.","alt":[],"visual":""},{"q":"След увеличение с 20% заплатата става 1800 лв. Намерете заплатата преди увеличението.","answer":"1500","hint":"Новата заплата е 120% от старата.","solution":"1,2x=1800 ⇒ x=1500 лв.","alt":[],"visual":""},{"q":"Един служител получил в края на месеца 828 лв. При пресмятане на заплатата му начислили над основната заплата 15% за прослужено време, а от получената брутна сума удържали общо 20% данъци и осигуровки. Определете основната заплата на служителя.","answer":"900","hint":"Брутната заплата е x+0,15x; удържат 20% от нея.","solution":"x+0,15x−0,2(x+0,15x)=828 ⇒ x=900 лв.","alt":[],"visual":""},{"q":"Смесват се 3 kg сплав, съдържаща 20% никел, и 7 kg сплав, съдържаща 60% никел. Колко процента никел съдържа получената сплав?","answer":"48","hint":"Намери количеството никел във всяка сплав, после раздели на общата маса.","solution":"0,6 kg + 4,2 kg = 4,8 kg никел от 10 kg ⇒ 48%.","alt":[],"visual":""},{"q":"След намаление с 25% цената на телевизор става 630 лв. Намерете цената преди намалението.","answer":"840","hint":"Новата цена е 75% от старата.","solution":"0,75x=630 ⇒ x=840 лв.","alt":[],"visual":""}]}},"9":{"skill1":{"easy":[{"q":"Две прави се пресичат. Един ъгъл е 42°. Колко е противоположният (връхният) му ъгъл?","answer":"42","hint":"Противоположните (връхните) ъгли са равни.","solution":"Ъгълът е 42°.","alt":[],"visual":""},{"q":"Две прави се пресичат. Един ъгъл е 68°. Колко е противоположният (връхният) му ъгъл?","answer":"68","hint":"Противоположните (връхните) ъгли са равни.","solution":"Ъгълът е 68°.","alt":[],"visual":""},{"q":"Две прави се пресичат. Един ъгъл е 115°. Колко е противоположният (връхният) му ъгъл?","answer":"115","hint":"Противоположните (връхните) ъгли са равни.","solution":"Ъгълът е 115°.","alt":[],"visual":""},{"q":"Две прави се пресичат. Един ъгъл е 137°. Колко е противоположният (връхният) му ъгъл?","answer":"137","hint":"Противоположните (връхните) ъгли са равни.","solution":"Ъгълът е 137°.","alt":[],"visual":""}],"medium":[{"q":"Две прави се пресичат. Един ъгъл е 42°. Колко е съседният му ъгъл?","answer":"138","hint":"Съседните ъгли имат сбор 180°.","solution":"180°−42°=138°.","alt":[],"visual":""},{"q":"Две прави се пресичат. Един ъгъл е 68°. Колко е съседният му ъгъл?","answer":"112","hint":"Съседните ъгли имат сбор 180°.","solution":"180°−68°=112°.","alt":[],"visual":""},{"q":"Две прави се пресичат. Един ъгъл е 115°. Колко е съседният му ъгъл?","answer":"65","hint":"Съседните ъгли имат сбор 180°.","solution":"180°−115°=65°.","alt":[],"visual":""},{"q":"Две прави се пресичат. Един ъгъл е 137°. Колко е съседният му ъгъл?","answer":"43","hint":"Съседните ъгли имат сбор 180°.","solution":"180°−137°=43°.","alt":[],"visual":""}],"hard":[{"q":"Два съседни ъгъла са в отношение 2:3. Намерете по-малкия.","answer":"72","hint":"Нека са 2x и 3x, а сборът им е 180°.","solution":"5x=180 ⇒ x=36, по-малкият е 72°.","alt":[],"visual":""},{"q":"Съседният ъгъл на ъгъл α=38°20′ е:","answer":"141°40′","hint":"Извади от 180° и внимавай при заемане на минути.","solution":"180°−38°20′=179°60′−38°20′=141°40′.","alt":[],"visual":""},{"q":"Съседният ъгъл на ъгъл α=125°55′ е:","answer":"54°5′","hint":"Извади от 180°, като заемеш от градусите.","solution":"179°60′−125°55′=54°5′.","alt":[],"visual":""},{"q":"Два съседни ъгъла са в отношение 4:5. Намерете по-големия.","answer":"100","hint":"Нека са 4x и 5x, а сборът им е 180°.","solution":"9x=180 ⇒ x=20, по-големият е 5·20=100°.","alt":[],"visual":""},{"q":"Съседният ъгъл на ъгъл α=52°35′ е:","answer":"127°25′","hint":"Извади от 180° и внимавай при заемане на минути.","solution":"180°−52°35′=179°60′−52°35′=127°25′.","alt":[],"visual":""}]},"skill2":{"easy":[{"q":"Каква е големината на всеки от ъглите, образувани от две перпендикулярни прави?","answer":"90","hint":"Перпендикулярните прави образуват прави ъгли.","solution":"Ъгълът е 90°.","alt":[],"visual":""},{"q":"Две прави, които при пресичане образуват прав ъгъл, се наричат:","answer":"перпендикулярни","hint":"Търси определението в началото на урока за перпендикулярни прави.","solution":"Това е определението за перпендикулярни прави.","alt":[],"visual":""},{"q":"Ако a ⟂ b, колко градуса е ъгълът между правите a и b?","answer":"90","hint":"Перпендикулярните прави образуват прав ъгъл.","solution":"Ъгълът е точно 90°.","alt":[],"visual":""},{"q":"Две прави, които при пресичане образуват четири равни ъгъла, се наричат:","answer":"перпендикулярни","hint":"Четирите ъгъла около пресечната точка имат сбор 360°.","solution":"Ако всички четири ъгъла са равни, всеки е 360°:4=90°, значи правите са перпендикулярни.","alt":[],"visual":""},{"q":"Лъчите OA и OB тръгват от точка O и сключват ъгъл 90°. Перпендикулярни ли са правите, на които лежат OA и OB?","answer":"да","hint":"Ъгъл 90° между две прави означава, че те са перпендикулярни.","solution":"Да — ъгълът е точно 90°, значи правите, на които лежат OA и OB, са перпендикулярни.","alt":[],"visual":""}],"medium":[{"q":"Ако a ⟂ c и b ⟂ c в една равнина, как са разположени a и b? Напишете „успоредни“ или „перпендикулярни“.","answer":"успоредни","hint":"Две прави, перпендикулярни на една и съща права, са успоредни.","solution":"a ∥ b.","alt":[],"visual":""},{"q":"Два съседни ъгъла са равни помежду си. Какви по вид ъгли са те?","answer":"прави","hint":"Ако α=β и α+β=180°, реши за α.","solution":"2α=180° ⇒ α=90°, значи и двата са прави.","alt":["90"],"visual":""},{"q":"Ъглополовящите на два съседни ъгъла винаги сключват помежду си ъгъл от колко градуса?","answer":"90","hint":"Ако съседните ъгли са 2α и 2β, ъглополовящите ги разполовяват.","solution":"2α+2β=180° ⇒ α+β=90°, т.е. ъгълът между ъглополовящите е 90°.","alt":[],"visual":""},{"q":"Правите a и b са перпендикулярни. Правата c е успоредна на a. Как е разположена c спрямо b — успоредни или перпендикулярни?","answer":"перпендикулярни","hint":"Ако c ∥ a, тя сключва с b същия ъгъл, какъвто a сключва с b.","solution":"Тъй като c ∥ a и a ⟂ b, ъгълът между c и b също е 90°, значи c ⟂ b.","alt":[],"visual":""},{"q":"При пресичане на две прави единият от два противоположни (вертикални) ъгъла е прав. Какво следва за правите?","answer":"перпендикулярни","hint":"Ако един ъгъл е 90°, намери и противоположния, и съседните му ъгли.","solution":"Противоположният му ъгъл също е 90° (вертикалните ъгли са равни), а всеки съседен е 180°−90°=90°. Всички ъгли са прави, значи правите са перпендикулярни.","alt":[],"visual":""}],"hard":[{"q":"През точка P, която не лежи на правата g, е построена права p, перпендикулярна на g. Може ли през P да се построи друга, различна от p, права, перпендикулярна на g?","answer":"не","hint":"През дадена точка към дадена права има единствен перпендикуляр.","solution":"Не — перпендикулярът е единствен.","alt":[],"visual":""},{"q":"При пресичане на две прави три от четирите получени ъгъла са равни помежду си. Колко градуса е всеки от тях?","answer":"90","hint":"Ъглите са само два вида по мярка: x и 180−x; ако три от четирите съвпадат, x=180−x.","solution":"От x=180−x ⇒ 2x=180 ⇒ x=90°, значи правите са перпендикулярни и всеки ъгъл е 90°.","alt":[],"visual":""},{"q":"Правите a и b са перпендикулярни в точка O. Правата c минава през O и също е перпендикулярна на a. Как е разположена c спрямо b?","answer":"съвпадат","hint":"Използвай единствеността на перпендикуляра през дадена точка.","solution":"През O минава само една права, перпендикулярна на a — това е b, значи c съвпада с b.","alt":["c≡b","съвпада с b"],"visual":""},{"q":"През точка M, която лежи на правата a, е построена права b, перпендикулярна на a. Може ли през M да се построи друга, различна от b, права, перпендикулярна на a?","answer":"не","hint":"И през точка от правата, както и през точка извън нея, перпендикулярът е единствен.","solution":"Не — през M минава само една права, перпендикулярна на a, а именно b.","alt":[],"visual":""},{"q":"При пресичане на две прави четирите получени ъгъла се отнасят 1:1:1:1. Перпендикулярни ли са правите?","answer":"да","hint":"Четирите ъгъла около пресечната точка имат сбор 360°; намери стойността на всеки.","solution":"4x=360 ⇒ x=90°, всички ъгли са прави, значи правите са перпендикулярни.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"С кой инструмент се запазва дадена дължина при пренасяне на отсечка в построение с линия и пергел?","answer":"пергел","hint":"С него запазваме дължината при пренасянето.","solution":"Използва се пергел.","alt":[],"visual":""},{"q":"Кои два чертожни инструмента се използват при построителните задачи в геометрията?","answer":"линия и пергел","hint":"Те трябва да бъдат \"чисти\" — без деления.","solution":"Използват се линия без деления и пергел.","alt":["пергел и линия"],"visual":""},{"q":"С кой чертожен инструмент се пренася дадена отсечка или дадена окръжност при построение?","answer":"пергел","hint":"Инструментът служи за пренасяне на дължина.","solution":"Отсечки и окръжности се пренасят с пергел.","alt":[],"visual":""},{"q":"С кой инструмент се построява окръжност с даден радиус?","answer":"пергел","hint":"Той служи за чертане на окръжности и дъги със зададен радиус.","solution":"Използва се пергел.","alt":[],"visual":""},{"q":"Кой чертожен инструмент служи само за прокарване на прави линии, без деления за измерване?","answer":"линия","hint":"Той не трябва да има деления за измерване на дължини.","solution":"Използва се линия (линийка) без деления.","alt":["линийка"],"visual":""}],"medium":[{"q":"При построяване на перпендикуляр от точка M, която не лежи на правата a, към правата a първата окръжност се построява с център в коя точка?","answer":"M","hint":"Центърът е дадената точка M, която не лежи на правата a.","solution":"Първата окръжност е с център M.","alt":["m"],"visual":""},{"q":"Отсечка a=6 cm. Построена е отсечка c=3a. Колко cm е c?","answer":"18","hint":"Пренеси отсечката a три пъти последователно.","solution":"c=3·6=18 cm.","alt":[],"visual":""},{"q":"Отсечка a=7 cm. Построена е отсечка c=4a. Колко cm е c?","answer":"28","hint":"Пренеси отсечката a четири пъти последователно.","solution":"c=4·7=28 cm.","alt":[],"visual":""},{"q":"При построяване на ъглополовяща на ъгъл с връх O първата дъга се построява с център в коя точка?","answer":"O","hint":"Центърът е върхът на дадения ъгъл.","solution":"Първата дъга е с център в точка O — върха на ъгъла.","alt":["o"],"visual":""},{"q":"Дадени са отсечки a=5 cm и b=8 cm. С пергел е пренесена последователно всяка от тях върху една права, за да се получи отсечка c=a+b. Колко cm е c?","answer":"13","hint":"Пренеси последователно двете отсечки на една права, за да получиш сбора им.","solution":"c=5+8=13 cm.","alt":[],"visual":""}],"hard":[{"q":"При построяване на ъгъл, равен на даден, от двата върха се построяват дъги с един и същ разтвор на пергела. Какво трябва да е еднакво за тези дъги?","answer":"радиуса","hint":"Построението се основава на равни радиуси и равни хорди.","solution":"Радиусите на дъгите трябва да са равни; след това се пренася и съответната хорда.","alt":["радиус"],"visual":""},{"q":"Дадена е отсечка a=5 cm. Построени са отсечки b=3a и c=2a, а после d=b−c. Колко cm е d?","answer":"5","hint":"Пресметни b и c чрез a, после намери разликата им.","solution":"b=15 cm, c=10 cm, d=15−10=5 cm (равна на a).","alt":[],"visual":""},{"q":"Дадени са остри ъгли α=54° и β=39° (α>β). Построен е ъгъл γ=180°−(α+β). Колко градуса е γ?","answer":"87","hint":"Първо намери сбора α+β, после извади от 180°.","solution":"α+β=93°, γ=180−93=87°.","alt":[],"visual":""},{"q":"При построяване на симетрала (перпендикулярен ъглополовящ) на отсечка AB от двата края A и B се построяват дъги с един и същ разтвор на пергела, по-голям от половината на AB. Какво трябва да е еднакво за тези дъги?","answer":"радиуса","hint":"Само тогава дъгите от A и B ще се пресекат в две точки, определящи симетралата.","solution":"Радиусите (разтворите на пергела) на дъгите от A и B трябва да са равни.","alt":["радиус"],"visual":""},{"q":"Дадени са остри ъгли α=47° и β=29° (α>β). Построен е ъгъл γ=180°−(α+β). Колко градуса е γ?","answer":"104","hint":"Първо намери сбора α+β, после извади от 180°.","solution":"α+β=76°, γ=180−76=104°.","alt":[],"visual":""}]}},"10":{"skill1":{"easy":[{"q":"По чертежа определете какви са ъглите 3 и 6: вътрешни кръстни, съответни или прилежащи.","answer":"вътрешни кръстни","hint":"И двата са между правите a и b и са от различни страни на сечащата.","solution":"Ъгли 3 и 6 са вътрешни кръстни.","alt":["кръстни"],"visual":"<svg viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Две успоредни прави, пресечени от сечаща\">\n    <line x1=\"28\" y1=\"52\" x2=\"330\" y2=\"52\"/><line x1=\"28\" y1=\"118\" x2=\"330\" y2=\"118\"/>\n    <line x1=\"125\" y1=\"12\" x2=\"230\" y2=\"154\"/>\n    <text x=\"43\" y=\"43\">a</text><text x=\"43\" y=\"109\">b</text><text x=\"215\" y=\"25\">c</text>\n    <text x=\"139\" y=\"43\">1</text><text x=\"171\" y=\"43\">2</text><text x=\"151\" y=\"72\">3</text><text x=\"185\" y=\"72\">4</text>\n    <text x=\"187\" y=\"108\">5</text><text x=\"219\" y=\"108\">6</text><text x=\"199\" y=\"139\">7</text><text x=\"231\" y=\"139\">8</text>\n  </svg>"},{"q":"На чертежа при пресичане на две прави a, b от трета права c, ∢3 и ∢6 как се наричат тези ъгли?","answer":"кръстни","hint":"Намират се от двете страни на секущата, между правите a и b.","solution":"∢3 и ∢6 са вътрешни кръстни ъгли.","alt":["вътрешни кръстни"],"visual":"<svg viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Две успоредни прави, пресечени от сечаща\">\n    <line x1=\"28\" y1=\"52\" x2=\"330\" y2=\"52\"/><line x1=\"28\" y1=\"118\" x2=\"330\" y2=\"118\"/>\n    <line x1=\"125\" y1=\"12\" x2=\"230\" y2=\"154\"/>\n    <text x=\"43\" y=\"43\">a</text><text x=\"43\" y=\"109\">b</text><text x=\"215\" y=\"25\">c</text>\n    <text x=\"139\" y=\"43\">1</text><text x=\"171\" y=\"43\">2</text><text x=\"151\" y=\"72\">3</text><text x=\"185\" y=\"72\">4</text>\n    <text x=\"187\" y=\"108\">5</text><text x=\"219\" y=\"108\">6</text><text x=\"199\" y=\"139\">7</text><text x=\"231\" y=\"139\">8</text>\n  </svg>"},{"q":"На чертежа ∢1 и ∢5 как се наричат тези ъгли?","answer":"съответни","hint":"Намират се от една и съща страна на секущата, на едно и също място спрямо двете прави.","solution":"∢1 и ∢5 са съответни ъгли.","alt":[],"visual":"<svg viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Две успоредни прави, пресечени от сечаща\">\n    <line x1=\"28\" y1=\"52\" x2=\"330\" y2=\"52\"/><line x1=\"28\" y1=\"118\" x2=\"330\" y2=\"118\"/>\n    <line x1=\"125\" y1=\"12\" x2=\"230\" y2=\"154\"/>\n    <text x=\"43\" y=\"43\">a</text><text x=\"43\" y=\"109\">b</text><text x=\"215\" y=\"25\">c</text>\n    <text x=\"139\" y=\"43\">1</text><text x=\"171\" y=\"43\">2</text><text x=\"151\" y=\"72\">3</text><text x=\"185\" y=\"72\">4</text>\n    <text x=\"187\" y=\"108\">5</text><text x=\"219\" y=\"108\">6</text><text x=\"199\" y=\"139\">7</text><text x=\"231\" y=\"139\">8</text>\n  </svg>"},{"q":"На чертежа ∢2 и ∢6 как се наричат тези ъгли?","answer":"съответни","hint":"Намират се от една и съща страна на секущата, на едно и също място спрямо двете прави.","solution":"∢2 и ∢6 са съответни ъгли.","alt":["съответни ъгли"],"visual":"<svg viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Две успоредни прави, пресечени от сечаща\">\n    <line x1=\"28\" y1=\"52\" x2=\"330\" y2=\"52\"/><line x1=\"28\" y1=\"118\" x2=\"330\" y2=\"118\"/>\n    <line x1=\"125\" y1=\"12\" x2=\"230\" y2=\"154\"/>\n    <text x=\"43\" y=\"43\">a</text><text x=\"43\" y=\"109\">b</text><text x=\"215\" y=\"25\">c</text>\n    <text x=\"139\" y=\"43\">1</text><text x=\"171\" y=\"43\">2</text><text x=\"151\" y=\"72\">3</text><text x=\"185\" y=\"72\">4</text>\n    <text x=\"187\" y=\"108\">5</text><text x=\"219\" y=\"108\">6</text><text x=\"199\" y=\"139\">7</text><text x=\"231\" y=\"139\">8</text>\n  </svg>"},{"q":"По чертежа определете какви са ъглите 4 и 5: вътрешни кръстни, съответни или прилежащи.","answer":"вътрешни кръстни","hint":"И двата са между правите a и b и са от различни страни на сечащата.","solution":"Ъгли 4 и 5 са вътрешни кръстни.","alt":["кръстни"],"visual":"<svg viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Две успоредни прави, пресечени от сечаща\">\n    <line x1=\"28\" y1=\"52\" x2=\"330\" y2=\"52\"/><line x1=\"28\" y1=\"118\" x2=\"330\" y2=\"118\"/>\n    <line x1=\"125\" y1=\"12\" x2=\"230\" y2=\"154\"/>\n    <text x=\"43\" y=\"43\">a</text><text x=\"43\" y=\"109\">b</text><text x=\"215\" y=\"25\">c</text>\n    <text x=\"139\" y=\"43\">1</text><text x=\"171\" y=\"43\">2</text><text x=\"151\" y=\"72\">3</text><text x=\"185\" y=\"72\">4</text>\n    <text x=\"187\" y=\"108\">5</text><text x=\"219\" y=\"108\">6</text><text x=\"199\" y=\"139\">7</text><text x=\"231\" y=\"139\">8</text>\n  </svg>"}],"medium":[{"q":" ко ∢2=108°.","answer":"108","hint":"∢5+∢6=180°, извади от 288°, за да намериш ∢7.","solution":"∢7=288−180=108°=∢2, а ∢2 и ∢7 са външни кръстни ъгли ⇒ a∥b.","alt":["да","a∥b"],"visual":"<svg viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Две успоредни прави, пресечени от сечаща\">\n    <line x1=\"28\" y1=\"52\" x2=\"330\" y2=\"52\"/><line x1=\"28\" y1=\"118\" x2=\"330\" y2=\"118\"/>\n    <line x1=\"125\" y1=\"12\" x2=\"230\" y2=\"154\"/>\n    <text x=\"43\" y=\"43\">a</text><text x=\"43\" y=\"109\">b</text><text x=\"215\" y=\"25\">c</text>\n    <text x=\"139\" y=\"43\">1</text><text x=\"171\" y=\"43\">2</text><text x=\"151\" y=\"72\">3</text><text x=\"185\" y=\"72\">4</text>\n    <text x=\"187\" y=\"108\">5</text><text x=\"219\" y=\"108\">6</text><text x=\"199\" y=\"139\">7</text><text x=\"231\" y=\"139\">8</text>\n  </svg>"},{"q":"∢1 и ∢2 са съседни ъгли в една пресечна точка, като ∢1:∢2=2:7. Намерете ∢2.","answer":"140","hint":"Сборът на съседните ъгли е 180°; използвай отношението, за да намериш x.","solution":"2x+7x=180 ⇒ x=20, ∢2=7·20=140°.","alt":[],"visual":"<svg viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Две успоредни прави, пресечени от сечаща\">\n    <line x1=\"28\" y1=\"52\" x2=\"330\" y2=\"52\"/><line x1=\"28\" y1=\"118\" x2=\"330\" y2=\"118\"/>\n    <line x1=\"125\" y1=\"12\" x2=\"230\" y2=\"154\"/>\n    <text x=\"43\" y=\"43\">a</text><text x=\"43\" y=\"109\">b</text><text x=\"215\" y=\"25\">c</text>\n    <text x=\"139\" y=\"43\">1</text><text x=\"171\" y=\"43\">2</text><text x=\"151\" y=\"72\">3</text><text x=\"185\" y=\"72\">4</text>\n    <text x=\"187\" y=\"108\">5</text><text x=\"219\" y=\"108\">6</text><text x=\"199\" y=\"139\">7</text><text x=\"231\" y=\"139\">8</text>\n  </svg>"},{"q":"∢5+∢6+∢7=268°, а ∢5 и ∢6 са съседни. Намерете ∢7 и определете дали a∥b, ако е дадено, че ∢2=88° (∢2 и ∢7 са кръстни ъгли).","answer":"88","hint":"∢5+∢6=180°, извади от 268°, за да намериш ∢7.","solution":"∢7=268−180=88°=∢2, а ∢2 и ∢7 са външни кръстни ъгл
