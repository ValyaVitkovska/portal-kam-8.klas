<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Портал към 8. клас — Преговор по математика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&subset=cyrillic&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#0b1026;
    --bg-darker:#05070f;
    --accent:#7c5cff;
    --accent2:#22d3ee;
    --accent3:#f472b6;
    --gold:#fbbf24;
    --success:#34d399;
    --danger:#f87171;
    --text:#eef0fb;
    --text-dim:#a5abcf;
    --card:#151b3d;
    --card2:#1b2450;
    --card-border:#2c3570;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:radial-gradient(ellipse at top, #1b2358 0%, var(--bg-dark) 45%, var(--bg-darker) 100%);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    line-height:1.5;
  }
  h1,h2,h3,.title-font{font-family:'Comfortaa',cursive;}
  #stars-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:1;}}

  #app{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:20px 16px 90px;min-height:100vh;}

  .btn{
    font-family:'Nunito',sans-serif;
    font-weight:800;
    border:none;
    border-radius:14px;
    padding:14px 28px;
    font-size:1.02rem;
    cursor:pointer;
    color:#0b1026;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    box-shadow:0 6px 0 #3d3592, 0 10px 20px rgba(124,92,255,.35);
    transition:transform .12s ease, box-shadow .12s ease;
    color:#fff;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(2px);box-shadow:0 3px 0 #3d3592;}
  .btn.secondary{background:linear-gradient(135deg,#3a4270,#232a56);box-shadow:0 6px 0 #171c3d;}
  .btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--card-border);color:var(--text-dim);padding:10px 18px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.small{padding:8px 16px;font-size:.85rem;border-radius:10px;}

  /* ---------- START SCREEN ---------- */
  .hero{text-align:center;padding:20px 0 10px;}
  .portal-icon{
    width:150px;height:150px;margin:0 auto 14px;border-radius:50%;
    position:relative;
    background:conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent3), var(--gold), var(--accent));
    animation:spin 6s linear infinite;
    box-shadow:0 0 60px 10px rgba(124,92,255,.55);
  }
  .portal-icon::before{
    content:'';position:absolute;inset:14px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #1b2358, var(--bg-darker) 70%);
  }
  .portal-icon::after{
    content:'8.';font-family:'Comfortaa',cursive;font-weight:700;
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:2.4rem;color:#fff;text-shadow:0 0 14px var(--accent2);
    animation:counterspin 6s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes counterspin{to{transform:rotate(-360deg);}}

  .hero h1{font-size:1.9rem;margin:6px 0 4px;background:linear-gradient(90deg,var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--text-dim);max-width:560px;margin:0 auto;font-size:1rem;}

  .card{
    background:linear-gradient(145deg,var(--card),var(--card2));
    border:1px solid var(--card-border);
    border-radius:18px;padding:20px;margin:16px 0;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  label.field-label{display:block;font-weight:800;margin-bottom:8px;color:var(--text);}
  input[type=text]{
    width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--card-border);
    background:#0e1330;color:var(--text);font-size:1rem;font-family:inherit;
  }
  input[type=text]:focus{outline:none;border-color:var(--accent2);}

  .level-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px;}
  .level-card{
    border:2px solid var(--card-border);border-radius:16px;padding:16px;cursor:pointer;
    background:#101636;transition:transform .12s ease, border-color .12s ease;text-align:left;
  }
  .level-card:hover{transform:translateY(-3px);}
  .level-card.selected{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(34,211,238,.25);background:#132049;}
  .level-card .badge{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:8px;}
  .level-card h3{margin:4px 0;font-size:1.05rem;}
  .level-card p{margin:0;color:var(--text-dim);font-size:.88rem;}
  .b-easy{background:rgba(52,211,153,.18);color:var(--success);}
  .b-medium{background:rgba(251,191,36,.18);color:var(--gold);}
  .b-hard{background:rgba(244,114,182,.18);color:var(--accent3);}

  .start-actions{text-align:center;margin-top:18px;}

  /* ---------- TOP BAR (map & question screens) ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;background:rgba(21,27,61,.7);
    border:1px solid var(--card-border);border-radius:16px;padding:12px 16px;margin-bottom:18px;
    position:sticky;top:10px;z-index:5;backdrop-filter:blur(6px);
  }
  .topbar .who{font-weight:800;font-size:.95rem;flex:0 0 auto;}
  .topbar .who span{color:var(--accent2);}
  .progress-track{flex:1;height:12px;border-radius:999px;background:#0e1330;overflow:hidden;border:1px solid var(--card-border);}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent2),var(--accent),var(--accent3));transition:width .5s ease;}
  .score-pill{background:#0e1330;border:1px solid var(--card-border);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.85rem;white-space:nowrap;}

  /* ---------- MAP / PATH ---------- */
  .path-wrap{position:relative;padding:10px 0 10px;}
  .path-line{position:absolute;left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);
    background:repeating-linear-gradient(180deg,var(--card-border) 0 14px, transparent 14px 24px);
    border-radius:6px;z-index:0;overflow:hidden;}
  .path-line::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(180deg,var(--accent2) 0 10px, transparent 10px 24px);
    opacity:.65;animation:pathFlow 1.6s linear infinite;}
  @keyframes pathFlow{to{background-position:0 24px;}}
  .station-row{position:relative;z-index:1;display:flex;margin:6px 0;min-height:92px;align-items:center;}
  .station-row.left{justify-content:flex-start;}
  .station-row.right{justify-content:flex-end;}
  .station-row.center{justify-content:center;}
  .station-node{
    width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:3px solid var(--card-border);background:#161c40;cursor:pointer;position:relative;
    transition:transform .15s ease;flex-shrink:0;perspective:220px;
  }
  .station-node .ic{font-size:1.6rem;line-height:1;display:inline-block;transform-style:preserve-3d;animation:iconFloat3d 5s ease-in-out infinite;animation-delay:var(--float-delay,0s);}
  .station-node.locked .ic{animation:none;transform:none;}
  @keyframes iconFloat3d{
    0%,100%{transform:rotateY(0deg) rotateX(0deg) translateZ(0);}
    25%{transform:rotateY(20deg) rotateX(8deg) translateZ(6px);}
    50%{transform:rotateY(0deg) rotateX(-8deg) translateZ(0);}
    75%{transform:rotateY(-20deg) rotateX(8deg) translateZ(6px);}
  }
  @media (prefers-reduced-motion: reduce){
    .station-node .ic{animation:none!important;}
    .path-line{animation:none!important;}
  }
  .station-node .num{position:absolute;top:-8px;left:-8px;background:#0e1330;border:2px solid var(--card-border);border-radius:50%;
    width:24px;height:24px;font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:800;}
  .station-node:hover{transform:scale(1.06);}
  .station-node.locked{opacity:.45;cursor:not-allowed;}
  .station-node.locked:hover{transform:none;}
  .station-node.current{border-color:var(--accent2);box-shadow:0 0 0 6px rgba(34,211,238,.18),0 0 24px rgba(34,211,238,.5);animation:pulse 1.8s ease-in-out infinite;}
  .station-node.correct{border-color:var(--success);background:#122a24;}
  .station-node.wrong{border-color:var(--danger);background:#2a1414;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
  .station-label{max-width:150px;font-size:.78rem;font-weight:700;color:var(--text-dim);text-align:center;margin-top:4px;}
  .station-caption{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .station-row.left .station-caption{align-items:flex-start;margin-left:14px;order:2;}
  .station-row.right .station-caption{align-items:flex-end;margin-right:14px;order:-1;text-align:right;}

  .portal-goal{
    margin:28px auto 6px;width:150px;height:150px;border-radius:50%;position:relative;
    background:conic-gradient(from 0deg,#333 0%,#333 100%);
  }
  .portal-goal.active{
    background:conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent3), var(--gold), var(--accent));
    animation:spin 5s linear infinite;box-shadow:0 0 70px 14px rgba(124,92,255,.6);
  }
  .portal-goal::before{content:'';position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#1b2358,var(--bg-darker) 70%);}
  .portal-goal-label{text-align:center;font-weight:800;color:var(--text-dim);margin-bottom:6px;}

  /* ---------- QUESTION MODAL ---------- */
  .overlay{position:fixed;inset:0;background:rgba(4,6,16,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);}
  .modal{
    background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--card-border);
    border-radius:20px;max-width:680px;width:100%;padding:24px;max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-header{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .modal-header .ic{font-size:2rem;}
  .modal-header h2{margin:0;font-size:1.2rem;}
  .modal .level-tag{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:999px;margin-top:4px;}
  .question-text{font-size:1.08rem;font-weight:700;margin:16px 0 14px;color:#fff;}
  .hint-box{background:#0e1330;border-left:4px solid var(--gold);padding:10px 14px;border-radius:10px;margin:10px 0;font-size:.92rem;color:var(--text-dim);}
  .answer-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .answer-row input{flex:1;min-width:160px;}
  .feedback{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:.95rem;}
  .feedback.correct{background:rgba(52,211,153,.14);border:1px solid var(--success);}
  .feedback.wrong{background:rgba(248,113,113,.14);border:1px solid var(--danger);}
  .feedback h4{margin:0 0 6px;}
  .feedback.correct h4{color:var(--success);}
  .feedback.wrong h4{color:var(--danger);}
  .task-counter{margin-top:5px;color:var(--text-dim);font-size:.8rem;font-weight:700;}
  .socratic-box{margin-top:14px;padding:14px 16px;border-radius:14px;background:rgba(34,211,238,.1);border:1px solid var(--accent2);}
  .socratic-box h4{margin:0 0 8px;color:var(--accent2);}
  .socratic-question{font-size:1rem;font-weight:700;line-height:1.45;}
  .socratic-note{margin-top:8px;color:var(--text-dim);font-size:.85rem;}
  .solution-box{margin-top:14px;padding:14px 16px;border-radius:14px;background:#0e1330;border-left:4px solid var(--success);}
  .solution-box h4{margin:0 0 7px;color:var(--success);}
  .mini-progress{display:flex;gap:6px;margin-top:9px;}
  .mini-progress span{width:28px;height:6px;border-radius:999px;background:var(--card-border);}
  .mini-progress span.done{background:var(--success);}
  .modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .fix-link{background:none;border:none;color:var(--accent2);text-decoration:underline;cursor:pointer;font-size:.85rem;font-family:inherit;padding:0;}
  .problem-link-row{margin-top:10px;text-align:center;}
  .problem-box{margin-top:14px;padding:14px 16px;border-radius:14px;background:rgba(251,191,36,.1);border:1px solid var(--gold);}
  .problem-box h4{margin:0 0 8px;color:var(--gold);}
  .problem-box.blocked-help{background:rgba(248,113,113,.08);border-color:var(--danger);}
  .problem-box.blocked-help h4{color:var(--danger);}
  .problem-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  /* ---------- INTERACTIVE SCRATCHPAD ---------- */
  .task-visual{margin:12px 0 4px;padding:10px;border:1px solid var(--card-border);border-radius:14px;background:rgba(255,255,255,.025);display:flex;justify-content:center;}
  .task-visual svg{width:min(100%,460px);height:auto;max-height:220px;}
  .task-visual svg line,.task-visual svg polygon,.task-visual svg circle{stroke:var(--text);stroke-width:2.2;fill:none;}
  .task-visual svg text{fill:var(--text);font-size:15px;font-weight:700;}
  .task-visual svg .slice{fill:rgba(34,211,238,.28);stroke:var(--accent2);stroke-width:2;}
  .task-visual svg .ray{stroke:var(--accent2);stroke-width:5;fill:none;}
  .task-visual svg circle.open{fill:var(--card);stroke:var(--accent2);stroke-width:3;}
  .task-visual svg circle.filled{fill:var(--accent2);stroke:var(--accent2);stroke-width:3;}
  .scratchpad{margin:14px 0 4px;border:1px solid var(--card-border);border-radius:14px;overflow:hidden;background:#0e1330;}
  .scratchpad summary{display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 12px;font-weight:800;color:var(--accent2);list-style:none;user-select:none;}
  .scratchpad summary::-webkit-details-marker{display:none;}
  .scratchpad summary::after{content:'▾';margin-left:auto;transition:transform .15s ease;}
  .scratchpad:not([open]) summary::after{transform:rotate(-90deg);}
  .scratchpad-body{padding:0 10px 10px;}
  .scratch-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px;}
  .scratch-tool{min-height:40px;border:1px solid var(--card-border);border-radius:9px;padding:7px 11px;background:#171e43;color:var(--text);font:700 .82rem 'Nunito',sans-serif;cursor:pointer;}
  .scratch-tool:hover,.scratch-tool.active{border-color:var(--accent2);background:#21305a;}
  .scratch-tool:focus-visible{outline:3px solid rgba(34,211,238,.45);outline-offset:2px;}
  .scratch-hint{margin-left:auto;color:var(--text-dim);font-size:.75rem;}
  .scratch-canvas-wrap{height:245px;border-radius:10px;overflow:hidden;border:2px solid #cad3e5;background-color:#fff;
    background-image:linear-gradient(#dfe7f3 1px,transparent 1px),linear-gradient(90deg,#dfe7f3 1px,transparent 1px);
    background-size:24px 24px;cursor:crosshair;}
  #scratch-canvas{display:block;width:100%;height:100%;touch-action:none;}
  .scratch-note{margin:6px 2px 0;color:var(--text-dim);font-size:.74rem;}

  @media(max-width:520px){
    .modal{padding:17px;}
    .scratch-canvas-wrap{height:210px;}
    .scratch-hint{width:100%;margin-left:0;}
    .scratch-tool{flex:1;min-width:72px;}
  }


  /* ---------- GEO, AUTHOR CREDIT & FLOATING MATH KEYBOARD ---------- */
  .geo-guide{
    display:flex;align-items:center;gap:12px;margin:10px 0 14px;
    padding:10px 13px 10px 8px;border-radius:16px;
    background:linear-gradient(135deg,rgba(34,211,238,.11),rgba(124,92,255,.11));
    border:1px solid rgba(34,211,238,.35);
  }
  .geo-guide.compact{max-width:650px;margin:14px auto;}
  .geo-avatar-wrap{width:92px;height:92px;flex:0 0 92px;display:flex;align-items:flex-end;justify-content:center;}
  .geo-avatar{max-width:88px;max-height:90px;object-fit:contain;filter:drop-shadow(0 7px 10px rgba(0,0,0,.24));transform-origin:50% 90%;}
  .geo-guide.correct .geo-avatar{animation:geoCelebrate .65s ease;}
  .geo-guide.wrong .geo-avatar{animation:geoThink .75s ease;}
  .geo-bubble{position:relative;flex:1;background:#f7fbff;color:#16203c;border-radius:15px;padding:10px 13px;font-weight:700;font-size:.9rem;line-height:1.38;box-shadow:0 5px 15px rgba(0,0,0,.12);}
  .geo-bubble::before{content:'';position:absolute;left:-9px;top:28px;border-width:8px 10px 8px 0;border-style:solid;border-color:transparent #f7fbff transparent transparent;}
  .geo-name{color:#078da1;font-weight:900;margin-right:4px;}
  @keyframes geoCelebrate{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-10px) rotate(-4deg)}70%{transform:translateY(-3px) rotate(4deg)}}
  @keyframes geoThink{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}60%{transform:rotate(3deg)}}

  .resource-credit{
    display:flex;align-items:center;justify-content:center;gap:9px;
    margin:24px auto 6px;padding:9px 12px;max-width:650px;
    color:var(--text-dim);font-size:.76rem;text-align:left;opacity:.84;
  }
  .resource-credit.compact{margin:14px 0 0;justify-content:flex-start;font-size:.7rem;}
  .resource-credit img{width:36px;height:36px;object-fit:contain;flex:0 0 auto;}

  .answer-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .keyboard-toggle{font-size:.78rem;padding:7px 11px;}

  .modal.keyboard-space{padding-bottom:270px;}
  .math-keyboard{
    position:fixed;right:14px;bottom:14px;z-index:55;width:min(410px,calc(100vw - 20px));
    background:linear-gradient(160deg,#101735,#18204a);
    border:1px solid #3a4a8e;border-radius:16px;box-shadow:0 18px 45px rgba(0,0,0,.52);
    overflow:hidden;user-select:none;touch-action:none;
  }
  .math-keyboard-header{
    display:flex;align-items:center;gap:8px;padding:9px 10px 8px 12px;
    background:#0b1230;border-bottom:1px solid #34427d;cursor:move;
    color:#dfe9ff;font-weight:900;font-size:.83rem;
  }
  .math-keyboard-header .drag-note{margin-left:auto;color:#8fa1d4;font-size:.68rem;font-weight:700;}
  .math-keyboard-min{
    border:none;background:#202b5a;color:#fff;border-radius:8px;min-width:31px;height:28px;
    font-weight:900;cursor:pointer;margin-left:4px;
  }
  .math-keyboard-body{padding:9px;}
  .math-key-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;}
  .math-key{
    min-width:0;height:38px;border:1px solid #41518f;border-radius:8px;
    background:#1d2857;color:#fff;font:800 .92rem 'Nunito',sans-serif;cursor:pointer;
    box-shadow:0 2px 0 #0d1432;
  }
  .math-key:hover,.math-key:focus-visible{background:#273772;border-color:var(--accent2);outline:none;}
  .math-key.wide{grid-column:span 2;font-size:.78rem;}
  .math-key.action{background:#162042;color:#bfcaf2;}
  .math-keyboard-help{margin-top:7px;color:#9ba8d3;font-size:.67rem;line-height:1.25;}
  .math-keyboard-fab{
    position:fixed;right:16px;bottom:16px;z-index:55;width:54px;height:54px;border-radius:50%;
    border:2px solid var(--accent2);background:linear-gradient(135deg,#13224a,#26326a);color:#fff;
    font-size:1.35rem;cursor:pointer;box-shadow:0 9px 25px rgba(0,0,0,.45);
  }

  @media(max-width:620px){
    .geo-avatar-wrap{width:72px;height:78px;flex-basis:72px;}
    .geo-avatar{max-width:70px;max-height:76px;}
    .geo-bubble{font-size:.8rem;}
    .math-keyboard{right:10px;bottom:10px;width:calc(100vw - 20px);}
    .math-key-grid{grid-template-columns:repeat(7,1fr);}
    .math-key{height:36px;font-size:.86rem;}
    .modal.keyboard-space{padding-bottom:300px;}
  }

  /* ---------- END SCREEN ---------- */
  .grade-badge{
    width:130px;height:130px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;
    font-size:2.6rem;font-weight:800;font-family:'Comfortaa',cursive;
    background:radial-gradient(circle,#1b2358,var(--bg-darker));border:4px solid var(--gold);
    box-shadow:0 0 40px rgba(251,191,36,.5);
  }
  table.results{width:100%;border-collapse:collapse;margin-top:10px;}
  table.results td, table.results th{padding:8px 10px;border-bottom:1px solid var(--card-border);text-align:left;font-size:.9rem;}
  table.results th{color:var(--text-dim);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;}
  .tag-ok{color:var(--success);font-weight:800;}
  .tag-bad{color:var(--danger);font-weight:800;}
  .selfcheck-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--card-border);gap:10px;flex-wrap:wrap;}
  .selfcheck-row label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text-dim);}

function hashNumber(...values){
  let h=2166136261;
  for(const value of values){
    const text=String(value);
    for(let i=0;i<text.length;i++){
      h^=text.charCodeAt(i);
      h=Math.imul(h,16777619);
    }
  }
  return h>>>0;
}
function createRunSeed(){
  let previous=0;
  try{ previous=Number(localStorage.getItem('portal8-last-seed')||0); }catch(e){}
  let seed=hashNumber(Date.now(),Math.random(),performance.now());
  if(seed===previous) seed=(seed+1)>>>0;
  try{ localStorage.setItem('portal8-last-seed',String(seed)); }catch(e){}
  return seed;
}
function shuffledSkills(stationId){
  return SKILL_KEYS.slice().sort((a,b)=>hashNumber(state.runSeed,stationId,a)-hashNumber(state.runSeed,stationId,b));
}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){const t=b;b=a%b;a=t;} return a||1; }
function choose(list,n){ return list[Math.abs(n)%list.length]; }
function makeTask(q,answer,hint,solution,alt,visual){ return {q,answer:String(answer),hint,solution,alt:alt||[],visual:visual||''}; }
function signed(n){ return n<0 ? `− ${Math.abs(n)}` : `+ ${n}`; }
function polyTerm(coef,variable='x'){
  if(coef===0) return '';
  if(coef===1) return variable;
  if(coef===-1) return `−${variable}`;
  return `${coef}${variable}`;
}
function intervalAlts(type,a){
  if(type==='gt') return [`(${a};+∞)`,`(${a};∞)`,`x>${a}`];
  if(type==='ge') return [`[${a};+∞)`,`[${a};∞)`,`x>=${a}`,`x≥${a}`];
  if(type==='lt') return [`(-∞;${a})`,`(−∞;${a})`,`x<${a}`];
  return [`(-∞;${a}]`,`(−∞;${a}]`,`x<=${a}`,`x≤${a}`];
}

function numberLineSvg(a,kind){
  const closed=kind==='ge'||kind==='le', right=kind==='gt'||kind==='ge';
  return `<svg viewBox="0 0 400 105" role="img" aria-label="Числова ос"><line x1="35" y1="55" x2="365" y2="55"/><line x1="200" y1="43" x2="200" y2="67"/><text x="191" y="88">${a}</text><circle cx="200" cy="55" r="7" class="${closed?'filled':'open'}"/>${right?'<line x1="209" y1="55" x2="345" y2="55" class="ray"/><polyline points="334,45 347,55 334,65" class="ray"/>':'<line x1="55" y1="55" x2="191" y2="55" class="ray"/><polyline points="66,45 53,55 66,65" class="ray"/>'}</svg>`;
}
function pieSvg(pct){
  const angle=pct*3.6, r=58, cx=95, cy=75;
  const rad=(angle-90)*Math.PI/180, x=cx+r*Math.cos(rad), y=cy+r*Math.sin(rad), large=angle>180?1:0;
  return `<svg viewBox="0 0 310 155" role="img" aria-label="Кръгова диаграма"><circle cx="95" cy="75" r="58"/><path class="slice" d="M ${cx} ${cy} L ${cx} ${cy-r} A ${r} ${r} 0 ${large} 1 ${x.toFixed(1)} ${y.toFixed(1)} Z"/><text x="178" y="66">оцветен сектор</text><text x="178" y="91">${pct}% от кръга</text></svg>`;
}
