и ⇒ a∥b.","alt":["да","a∥b"],"visual":"<svg viewBox=\"0 0 360 165\" role=\"img\" aria-label=\"Две успоредни прави, пресечени от сечаща\">\n    <line x1=\"28\" y1=\"52\" x2=\"330\" y2=\"52\"/><line x1=\"28\" y1=\"118\" x2=\"330\" y2=\"118\"/>\n    <line x1=\"125\" y1=\"12\" x2=\"230\" y2=\"154\"/>\n    <text x=\"43\" y=\"43\">a</text><text x=\"43\" y=\"109\">b</text><text x=\"215\" y=\"25\">c</text>\n    <text x=\"139\" y=\"43\">1</text><text x=\"171\" y=\"43\">2</text><text x=\"151\" y=\"72\">3</text><text x=\"185\" y=\"72\">4</text>\n    <text x=\"187\" y=\"108\">5</text><text x=\"219\" y=\"108\">6</text><text x=\"199\" y=\"139\">7</text><text x=\"231\" y=\"139\">8</text>\n  </svg>"}]}},"11":{"skill1":{"easy":[{"q":"Два от ъглите на триъгълник са 50° и 70°. Намерете големината на третия ъгъл.","answer":"60","hint":"Сборът на ъглите е 180°.","solution":"180−50−70=60°.","alt":[],"visual":""},{"q":"Ъглите на триъгълник са в отношение 2:3:4. Намерете най-малкия ъгъл.","answer":"40","hint":"Нека ъглите са 2x, 3x, 4x, а сборът им е 180°.","solution":"9x=180 ⇒ x=20, най-малкият е 2·20=40°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"Два от ъглите на триъгълник са 50° и 60°. Намерете третия ъгъл.","answer":"70","hint":"Сборът на ъглите в триъгълник е 180°.","solution":"180−50−60=70°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"В равнобедрен триъгълник ъгълът при върха е 40°, а другите два ъгъла са равни помежду си. Намерете всеки от тях.","answer":"70","hint":"Сборът на двата равни ъгъла е 180°−40°.","solution":"(180−40):2=70°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"}],"medium":[{"q":"Ъглите на триъгълник са x°, 2x° и 3x°. Намерете x.","answer":"30","hint":"Състави x+2x+3x=180.","solution":"6x=180 ⇒ x=30°.","alt":[],"visual":""},{"q":"Ъглите на триъгълник са x, x+10° и x+20°. Намерете x.","answer":"50","hint":"Състави уравнение за сбора на трите ъгъла.","solution":"x+(x+10)+(x+20)=180 ⇒ 3x+30=180 ⇒ x=50.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"В △ABC ъгъл γ=90°. Намерете ъгъл β, ако ъгъл α=40°30′.","answer":"49°30′","hint":"В правоъгълен триъгълник острите ъгли се допълват до 90°.","solution":"β=90°−40°30′=49°30′.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"Ъглите на триъгълник се отнасят като α:β:γ=3:4:5. Намерете γ.","answer":"75","hint":"Раздели 180° на общия брой части (3+4+5).","solution":"180:12=15, γ=5·15=75°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"}],"hard":[{"q":"Ъглите на триъгълник са (2x − 10)°, (x + 20)° и (3x − 10)°. Намерете големината на най-големия ъгъл.","answer":"80","hint":"Първо намери x от сбора 180°, после трите ъгъла.","solution":"6x=180 ⇒ x=30; ъглите са 50°,50°,80°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"В △ABC ъглополовящите на ъгъл A и ъгъл B се пресичат в точка D. Ако ъгъл C=80°, намерете ъгъл ADB.","answer":"130","hint":"Ъгъл ADB = 90° + (ъгъл C)/2.","solution":"ADB=90+80/2=90+40=130°.","alt":[],"visual":""},{"q":"В △ABC ъглополовящите на ъгъл A и ъгъл B се пресичат в точка D. Ако ъгъл A=48° и ъгъл B=55°, намерете ъгъл ADB.","answer":"128°30′","hint":"Ъгъл ADB = 180° − (ъгъл A + ъгъл B)/2.","solution":"ADB=180−(48+55)/2=180−51,5=128°30′.","alt":[],"visual":""},{"q":"В △ABC ъглополовящите на ъгъл A и ъгъл B се пресичат в точка D. Ако ъгъл C=100°, намерете ъгъл ADB.","answer":"140","hint":"Ъгъл ADB = 90° + (ъгъл C)/2.","solution":"ADB=90+100/2=90+50=140°.","alt":[],"visual":""}]},"skill2":{"easy":[{"q":"Външен ъгъл на триъгълник е 125°. Намерете прилежащия вътрешен ъгъл.","answer":"55","hint":"Тези два ъгъла са съседни.","solution":"180−125=55°.","alt":[],"visual":""},{"q":"Външният ъгъл на триъгълник е 140°. Намерете прилежащия му вътрешен ъгъл.","answer":"40","hint":"Външният и прилежащият вътрешен ъгъл са съседни.","solution":"180−140=40°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"Вътрешен ъгъл на триъгълник е 65°. Намерете съседния му (прилежащ) външен ъгъл.","answer":"115","hint":"Външният ъгъл е съседен на вътрешния.","solution":"180−65=115°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"Всеки ъгъл на триъгълник има по колко външни ъгъла?","answer":"2","hint":"Ако продължим двете страни при даден връх поотделно, получаваме различни съседни ъгли.","solution":"Всеки вътрешен ъгъл има точно два (равни по мярка) съседни външни ъгъла.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"}],"medium":[{"q":"Двата вътрешни ъгъла, несъседни на даден външен ъгъл на триъгълник, са 48° и 67°. Намерете големината на външния ъгъл.","answer":"115","hint":"Външният ъгъл е равен на сбора на двата несъседни вътрешни.","solution":"48+67=115°.","alt":[],"visual":""},{"q":"Външният ъгъл на триъгълник е 118°. Намерете прилежащия му вътрешен ъгъл.","answer":"62","hint":"Външният и прилежащият вътрешен ъгъл са съседни.","solution":"180−118=62°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"В триъгълник два от вътрешните ъгли са 55° и 65°. Намерете външния ъгъл при третия връх.","answer":"120","hint":"Външният ъгъл е равен на сбора на другите два вътрешни ъгъла.","solution":"55+65=120°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"Външният ъгъл при връх C на △ABC е γ′=130°, а α:β=6:7. Намерете α.","answer":"60","hint":"α+β=γ′, после раздели по отношението 6:7.","solution":"α+β=130°, 6x+7x=130 ⇒ x=10, α=60°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"}],"hard":[{"q":"Външен ъгъл на триъгълник е 140°. Единият от двата несъседни вътрешни ъгъла е 3 пъти по-голям от другия. Намерете по-малкия от тях.","answer":"35","hint":"Нека са x и 3x; сборът им е 140°.","solution":"4x=140 ⇒ x=35°.","alt":[],"visual":""},{"q":"Външният ъгъл при връх C на △ABC е γ′=130°, а α:β=6:7. Намерете α′ (външния ъгъл при връх A).","answer":"120","hint":"Първо намери α, после α′=180°−α.","solution":"α=60° (от α+β=130°, 6x+7x=130), α′=180−60=120°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"Външният ъгъл при връх C на △ABC е γ′=130°, а α:β=6:7. Намерете β′ (външния ъгъл при връх B).","answer":"110","hint":"Първо намери β, после β′=180°−β.","solution":"β=70° (от α+β=130°, 6x+7x=130), β′=180−70=110°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"В триъгълник един от вътрешните ъгли е 40°, а един външен ъгъл при друг връх е 50°. Намерете третия вътрешен ъгъл на триъгълника.","answer":"10","hint":"Намери вътрешния ъгъл, съседен на дадения външен 50°, после извади сбора му с 40° от 180°.","solution":"Вътрешният ъгъл при втория връх е 180−50=130°, третият ъгъл е 180−40−130=10°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"}]},"skill3":{"easy":[{"q":"Как се нарича отсечката, която съединява връх на триъгълник със средата на срещулежащата страна?","answer":"медиана","hint":"Търси определението за медиана.","solution":"Това е медиана.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"Коя отсечка в триъгълник е перпендикулярна на срещулежащата страна (или на нейното продължение) и свързва тази страна с срещуположния връх?","answer":"височина","hint":"Търси определението за височина в триъгълник.","solution":"Това е височината на триъгълника.","alt":[],"visual":""},{"q":"Коя отсечка в триъгълник разполовява ъгъла при даден връх и свързва върха с точка от срещуположната страна?","answer":"ъглополовяща","hint":"Търси определението за ъглополовяща в триъгълник.","solution":"Това е ъглополовящата на триъгълника.","alt":[],"visual":""},{"q":"Всеки триъгълник има по колко медиани?","answer":"3","hint":"Всеки връх определя по една медиана.","solution":"Триъгълникът има три медиани — по една от всеки връх.","alt":[],"visual":""}],"medium":[{"q":"Как се нарича отсечката, която съединява връх на триъгълник с точка от срещулежащата страна или нейното продължение и е перпендикулярна на тази страна?","answer":"височина","hint":"Търси отсечката, свързана с перпендикулярност.","solution":"Това е височина.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"В правоъгълен △ABC (ъгъл C=90°) CH е височината към хипотенузата. Ако ъгъл A=40°, намерете ъгъл BCH.","answer":"40","hint":"Ъгъл BCH е равен на ъгъл A.","solution":"BCH=α=40°.","alt":[],"visual":""},{"q":"В правоъгълен △ABC (ъгъл C=90°) CH е височината към хипотенузата. Ако ъгъл A=75°, намерете ъгъл BCH.","answer":"75","hint":"Ъгъл BCH е равен на ъгъл A.","solution":"BCH=α=75°.","alt":[],"visual":""},{"q":"В правоъгълен △ABC (ъгъл C=90°) страните се отнасят a:b:c=3:4:5, а периметърът е 24 cm. Намерете дължината на хипотенузата c.","answer":"10","hint":"Раздели периметъра на общия брой части (3+4+5).","solution":"24:12=2, c=5·2=10 cm.","alt":[],"visual":""}],"hard":[{"q":"В △ABC AL е ъглополовяща на ∠A=74°. Колко градуса е ∠BAL?","answer":"37","hint":"Ъглополовящата разделя ъгъла на две равни части.","solution":"74:2=37°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text><line x1=\"70\" y1=\"155\" x2=\"220\" y2=\"112\"/></svg>"},{"q":"В правоъгълен △ABC (ъгъл C=90°) a:b:c=4:3:5, а най-малката страна (b) е 9 cm. Намерете периметъра на триъгълника.","answer":"36","hint":"Намери мащабния множител от b, после умножи всяко отношение по него.","solution":"b=3 части=9 cm ⇒ 1 част=3 cm, a=12, b=9, c=15, P=12+9+15=36 cm.","alt":[],"visual":""},{"q":"В правоъгълен △ABC (ъгъл C=90°) a:b:c=4:3:5, а най-малката страна (b) е 9 cm. Намерете лицето на триъгълника.","answer":"54","hint":"Лицето на правоъгълен триъгълник е половината от произведението на катетите a и b.","solution":"От b=9 cm и a:b:c=4:3:5 получаваме, че 3 части = 9 cm, следователно 1 част = 3 cm. Тогава a=12 cm. S=a·b/2=12·9/2=54 cm².","alt":[],"visual":""},{"q":"В правоъгълен △ABC (ъгъл C=90°) a:b:c=4:3:5, а най-малката страна (b) е 9 cm. Намерете дължината на височината h_c към хипотенузата.","answer":"7,2","hint":"Първо намери дължините на страните и лицето на триъгълника. След това използвай S=c·h_c/2.","solution":"От b=9 cm и a:b:c=4:3:5 следва, че 1 част = 3 cm. Следователно a=12 cm и c=15 cm. S=12·9/2=54 cm². От S=c·h_c/2 получаваме 54=15·h_c/2, откъдето h_c=7,2 cm.","alt":["7.2"],"visual":""}]}},"12":{"skill1":{"easy":[{"q":"Два триъгълника имат съответно равни две страни и ъглите, заключени между тях. По кой признак за еднаквост — I, II или III — са еднакви триъгълниците?","answer":"I","hint":"Това е страна–ъгъл–страна.","solution":"I признак.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"Два триъгълника имат съответно равни всичките си три страни. По кой признак — I, II или III?","answer":"III","hint":"Три равни двойки страни отговарят на III признак.","solution":"Страна–страна–страна ⇒ III признак.","alt":[],"visual":""},{"q":"Два триъгълника имат съответно равна страна и двата ъгъла, прилежащи към нея. По кой признак — I, II или III?","answer":"II","hint":"Страната е между двата дадени равни ъгъла.","solution":"Ъгъл–страна–ъгъл ⇒ II признак.","alt":[],"visual":""},{"q":"В два триъгълника е дадено: AB=A₁B₁, BC=B₁C₁ и ъгълът между тези страни ∠B=∠B₁. По кой признак триъгълниците са еднакви?","answer":"I","hint":"Ъгълът е между двете равни страни.","solution":"Страна–ъгъл–страна ⇒ I признак.","alt":[],"visual":""}],"medium":[{"q":"Два триъгълника имат съответно равни по една страна и двата прилежащи към нея ъгъла. По кой признак за еднаквост са еднакви?","answer":"II","hint":"Това е ъгъл–страна–ъгъл.","solution":"II признак.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"△ABC и △A₁B₁C₁ имат AC=A₁C₁, CB=C₁B₁ и ∠C=∠C₁. По кой признак са еднакви?","answer":"I","hint":"Ъгълът C е между дадените страни CA и CB.","solution":"Страна–ъгъл–страна ⇒ I признак.","alt":[],"visual":""},{"q":"△MNP и △RST имат MN=RS, ∠M=∠R и ∠N=∠S. По кой признак са еднакви?","answer":"II","hint":"Страната MN е между върховете с дадените равни ъгли.","solution":"Ъгъл–страна–ъгъл ⇒ II признак.","alt":[],"visual":""},{"q":"Два триъгълника имат по два ъгъла (60° и 70°) съответно равни, а общата им страна е между тези два ъгъла. По кой признак са еднакви?","answer":"II","hint":"Страната е между двата дадени ъгъла.","solution":"Ъгъл–страна–ъгъл ⇒ II признак.","alt":[],"visual":""}],"hard":[{"q":"Два триъгълника имат съответно равни трите страни. По кой признак за еднаквост са еднакви?","answer":"III","hint":"Това е страна–страна–страна.","solution":"III признак.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"В △ABC и △A₁B₁C₁ е дадено AB=A₁B₁, ∠AMC=∠A₁M₁C₁ и медианите CM=C₁M₁ (M, M₁ — среди на AB, A₁B₁). Кой признак доказва △AMC ≅ △A₁M₁C₁?","answer":"I","hint":"AM=A₁M₁, защото са половините на равните страни AB и A₁B₁; ъгълът между AM и CM е точно дадения ъгъл при M.","solution":"AM=½AB=½A₁B₁=A₁M₁, а ъгълът между AM и CM е ∠AMC=∠A₁M₁C₁ ⇒ I признак.","alt":[],"visual":""},{"q":"За △ABC и △A₁B₁C₁ е дадено AB=A₁B₁, CM=C₁M₁ (медиани) и ∠CMB=∠C₁M₁B₁, където M, M₁ са среди на AB, A₁B₁. По кой признак △MBC ≅ △M₁B₁C₁?","answer":"I","hint":"MB=M₁B₁, защото са половините на равните страни AB и A₁B₁.","solution":"MB=M₁B₁, CM=C₁M₁ и ъгълът между тях е даден равен ⇒ I признак.","alt":[],"visual":""},{"q":"△ABC е равностранен. Точки M, N, P лежат съответно върху AB, BC, CA и △MNP също е равностранен. За еднаквостта △AMP ≅ △BNM се използва страна MP=MN и двата ъгъла, прилежащи на тази страна: ∠AMP=∠BNM и ∠APM=∠BMN. По кой признак?","answer":"II","hint":"Провери дали двата дадени ъгъла са точно в двата края на дадената страна MP (съответно MN).","solution":"Ъглите ∠AMP и ∠APM са двата края на страната MP (съответно ∠BNM и ∠BMN — на страната MN); страна и двата прилежащи към нея ъгъла ⇒ II признак (ъгъл–страна–ъгъл).","alt":[],"visual":""}]},"skill2":{"easy":[{"q":"△ABC ≅ △DEF. Ако AB=7 cm, колко е DE?","answer":"7","hint":"В записа на еднаквост A↔D, B↔E, C↔F.","solution":"DE=AB=7 cm.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"△ABC ≅ △DEF. Ако AB=7 cm, колко cm е DE?","answer":"7","hint":"Съответните страни на еднакви триъгълници са равни.","solution":"DE=AB=7 cm.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"△MNP ≅ △RST. Ако ∠P=52°, колко е ∠T?","answer":"52","hint":"Съответните ъгли в еднакви триъгълници са равни.","solution":"∠T=∠P=52°.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника MNP и RST\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">M</text><text x=\"174\" y=\"175\">N</text><text x=\"90\" y=\"32\">P</text><text x=\"243\" y=\"175\">R</text><text x=\"394\" y=\"175\">S</text><text x=\"310\" y=\"32\">T</text></svg>"},{"q":"△ABC ≅ △A₁B₁C₁. Ако BC=9 cm, колко cm е B₁C₁?","answer":"9","hint":"Съответните страни са равни.","solution":"B₁C₁=BC=9 cm.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника ABC и A₁B₁C₁\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">A₁</text><text x=\"394\" y=\"175\">B₁</text><text x=\"310\" y=\"32\">C₁</text></svg>"}],"medium":[{"q":"△ABC ≅ △DEF. Ако ∠B=64°, колко е ∠E?","answer":"64","hint":"Съответните ъгли в еднакви триъгълници са равни.","solution":"∠E=64°.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"△ABC ≅ △A₁B₁C₁. Ако ∠A=40° и ∠B=70°, колко градуса е ∠C₁?","answer":"70","hint":"Ъглите в триъгълник имат сбор 180°.","solution":"∠C=180−40−70=70°, а ∠C₁=∠C=70°.","alt":[],"visual":""},{"q":"△ABC ≅ △DEF, AB=3x, DE=12. Намерете x.","answer":"4","hint":"Съответните страни са равни: 3x=12.","solution":"x=12:3=4.","alt":[],"visual":""},{"q":"△ABC ≅ △A₁B₁C₁, AC=2x+1, A₁C₁=9. Намерете x.","answer":"4","hint":"Съответните страни са равни: 2x+1=9.","solution":"2x+1=9 ⇒ 2x=8 ⇒ x=4.","alt":[],"visual":""}],"hard":[{"q":"△ABC ≅ △DEF. AB=2x+1, DE=11. Намерете x.","answer":"5","hint":"Съответните страни са равни.","solution":"2x+1=11 ⇒ x=5.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"△ABC ≅ △A₁B₁C₁. Периметърът на △A₁B₁C₁ е 36 cm, AB=10 cm и BC=14 cm. Колко cm е A₁C₁?","answer":"12","hint":"Намерете AC от периметъра на △ABC (той е същият като на △A₁B₁C₁).","solution":"AC=36−10−14=12 cm, A₁C₁=AC=12 cm.","alt":[],"visual":""},{"q":"△ABC ≅ △DEF. ∠A:∠B:∠C=2:3:4. Колко градуса е ∠F?","answer":"80","hint":"Сборът от частите е 2+3+4=9, което отговаря на 180°.","solution":"1 част=20°, ∠C=4·20=80°, ∠F=∠C=80°.","alt":[],"visual":""},{"q":"△ABC ≅ △A₁B₁C₁. Външният ъгъл при връх C на △ABC е 130°. Колко градуса е ∠C₁?","answer":"50","hint":"Вътрешният ъгъл е допълнение до 180° на външния.","solution":"∠C=180−130=50°, ∠C₁=50°.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"В △ABC и △DEF е дадено AB=DE, AC=DF и ∠A=∠D. Достатъчно ли е това за еднаквост?","answer":"да","hint":"Дадени са две страни и ъгълът между тях.","solution":"Да — по I признак.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"Два триъгълника имат по две съответно равни страни, но ъгълът между тях не е даден. Достатъчно ли е това, за да се докаже еднаквост?","answer":"не","hint":"Нужен е и ъгълът между двете страни (I признак) или трета страна (III признак).","solution":"Не — само две страни не определят еднозначно триъгълника.","alt":[],"visual":""},{"q":"Два триъгълника имат съответно равни три страни. Еднакви ли са триъгълниците?","answer":"да","hint":"Това е условието на III признак.","solution":"Да, по III признак (страна–страна–страна).","alt":[],"visual":""},{"q":"Два триъгълника имат съответно равни два ъгъла и страната между тях. Еднакви ли са?","answer":"да","hint":"Това е условието на II признак.","solution":"Да, по II признак.","alt":[],"visual":""}],"medium":[{"q":"В два триъгълника са съответно равни две страни и по един ъгъл, който не е заключен между тези страни. Може ли само от тези данни да се заключи, че триъгълниците са еднакви?","answer":"не","hint":"I признак изисква ъгъла между двете равни страни.","solution":"Не, данните не са достатъчни.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"△ABC и △A₁B₁C₁ имат AB=A₁B₁, ∠A=∠A₁ и ∠C=∠C₁ (без дадена втора страна). Достатъчно ли е това, за да се докаже △ABC ≅ △A₁B₁C₁?","answer":"да","hint":"От два равни ъгъла следва равенство и на третия ъгъл.","solution":"∠B=∠B₁ (от сбора на ъглите), а AB е между равните ъгли A и B ⇒ II признак ⇒ да.","alt":[],"visual":""},{"q":"Два равнобедрени триъгълника имат съответно равни само ъглите при основата (без дадена страна). Еднакви ли са задължително?","answer":"не","hint":"Само ъглите определят формата, но не и размера.","solution":"Не — трябва да е дадена и поне една страна.","alt":[],"visual":""},{"q":"Два равнобедрени триъгълника имат съответно равни бедро и основа. Еднакви ли са?","answer":"да","hint":"Това е III признак — три двойки равни страни (бедро, бедро, основа).","solution":"Да, по III признак.","alt":[],"visual":""}],"hard":[{"q":"За △ABC и △DEF е дадено AB = DE, BC = EF и AC = DF. Посочете признака за еднаквост, като запишете само римската цифра.","answer":"III","hint":"И трите двойки съответни страни са равни.","solution":"III признак.","alt":[],"visual":"<svg viewBox=\"0 0 430 190\" role=\"img\" aria-label=\"Два триъгълника\"><polygon points=\"35,155 170,155 95,38\"/><polygon points=\"255,155 390,155 315,38\"/><text x=\"23\" y=\"175\">A</text><text x=\"174\" y=\"175\">B</text><text x=\"90\" y=\"32\">C</text><text x=\"243\" y=\"175\">D</text><text x=\"394\" y=\"175\">E</text><text x=\"310\" y=\"32\">F</text></svg>"},{"q":"△ABC и △A₁B₁C₁ имат AB=A₁B₁, медианите CM=C₁M₁ (към AB и A₁B₁) и ъглите ∠AMC=∠A₁M₁C₁ (M, M₁ — среди на AB, A₁B₁). Достатъчно ли е това, за да се докаже △ABC ≅ △A₁B₁C₁?","answer":"да","hint":"Първо докажи △AMC≅△A₁M₁C₁ (AM=A₁M₁ като половини на равните AB и A₁B₁), а после използвай получените AC=A₁C₁ и ∠A=∠A₁ за самите △ABC и △A₁B₁C₁.","solution":"AM=½AB=½A₁B₁=A₁M₁ (M, M₁ — среди). В △AMC и △A₁M₁C₁: AM=A₁M₁, CM=C₁M₁, ∠AMC=∠A₁M₁C₁ ⇒ I признак ⇒ △AMC≅△A₁M₁C₁, откъдето AC=A₁C₁ и ∠A=∠A₁. Сега в △ABC и △A₁B₁C₁: AB=A₁B₁, AC=A₁C₁, ∠A=∠A₁ (между тях) ⇒ I признак ⇒ △ABC≅△A₁B₁C₁. Да.","alt":[],"visual":""},{"q":"△ABC и △A₁B₁C₁ имат по три двойки съответно равни ъгли, но не е дадена нито една равна страна. Задължително ли еднакви ли са триъгълниците?","answer":"не","hint":"Равните ъгли правят триъгълниците подобни, но не непременно еднакви по размер.","solution":"Не — трябва поне една двойка равни страни.","alt":[],"visual":""},{"q":"△OAB и △OA₁B₁ имат общ връх O, ∠AOB=∠A₁OB₁ и OA=OA₁, но OB≠OB₁. Могат ли триъгълниците да бъдат еднакви?","answer":"не","hint":"При еднаквост всички съответни страни трябва да са равни.","solution":"Не — OB и OB₁ трябва да са равни, за да са еднакви триъгълниците.","alt":[],"visual":""}]}},"13":{"skill1":{"easy":[{"q":"В равнобедрен триъгълник ъгълът при върха е 40°. Намерете всеки ъгъл при основата.","answer":"70","hint":"Ъглите при основата са равни.","solution":"(180−40):2=70°.","alt":[],"visual":""},{"q":"В равнобедрен триъгълник ъгълът при основата е 65°. Намерете ъгъла при върха.","answer":"50","hint":"Сборът на ъглите в триъгълник е 180°.","solution":"180−2·65=50°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"В равнобедрен триъгълник ъгълът при върха е 100°. Намерете всеки от ъглите при основата.","answer":"40","hint":"Ъглите при основата на равнобедрен триъгълник са равни.","solution":"(180−100):2=40°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"В равнобедрен триъгълник ABC (AC=BC) ∠A=55°. Колко е ∠B?","answer":"55","hint":"Ъглите при основата на равнобедрен триъгълник са равни.","solution":"∠B=∠A=55°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"}],"medium":[{"q":"В равнобедрен триъгълник един ъгъл при основата е 68°. Намерете ъгъла при върха.","answer":"44","hint":"Двата основни ъгъла са по 68°.","solution":"180−2·68=44°.","alt":[],"visual":""},{"q":"В равнобедрен триъгълник ъгълът между бедрата е 56°. Намерете ъглите при основата.","answer":"62","hint":"Ъгълът между бедрата е ъгълът при върха.","solution":"(180−56):2=62°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"Външният ъгъл при основата на равнобедрен триъгълник е 125°. Намерете ъгъла при основата.","answer":"55","hint":"Вътрешният и външният ъгъл при основата са допълнителни до 180°.","solution":"180−125=55°.","alt":[],"visual":""},{"q":"Периметърът на равнобедрен триъгълник е 3 m, а основата е 80 cm. Намерете дължината на едно бедро (в cm).","answer":"110","hint":"Приведете периметъра в cm, извадете основата и разделете на 2.","solution":"P=300 cm, 300−80=220, 220:2=110 cm.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"}],"hard":[{"q":"В равнобедрен △ABC с основа AB медианата CM към основата е построена. Какъв е ∠CMA?","answer":"90","hint":"В равнобедрен триъгълник медианата към основата е и височина.","solution":"CM ⟂ AB, следователно ∠CMA=90°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text><line x1=\"175\" y1=\"30\" x2=\"172\" y2=\"155\"/></svg>"},{"q":"В равнобедрен триъгълник един от ъглите е 40° и е ъгъл при върха. Намерете ъглите при основата.","answer":"70","hint":"Двата ъгъла при основата са равни помежду си.","solution":"(180−40):2=70°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"В равнобедрен триъгълник един от ъглите е 40° и е ъгъл при основата. Намерете третия ъгъл (при върха).","answer":"100","hint":"Двата ъгъла при основата са по 40°.","solution":"180−2·40=100°.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"},{"q":"Може ли ъгълът при основата на равнобедрен триъгълник да е тъп ъгъл? (да/не)","answer":"не","hint":"Два еднакви тъпи ъгъла биха дали сбор над 180°.","solution":"Не — ъгълът при основата на равнобедрен триъгълник винаги е остър.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Триъгълник ABC\"><polygon points=\"70,155 275,155 175,30\"/><text x=\"55\" y=\"174\">A</text><text x=\"281\" y=\"174\">B</text><text x=\"170\" y=\"24\">C</text></svg>"}]},"skill2":{"easy":[{"q":"Точка P лежи на симетралата на отсечката AB. Ако PA = 8 cm, намерете PB.","answer":"8","hint":"Всяка точка от симетралата е на равни разстояния от краищата.","solution":"PA=PB=8 cm.","alt":[],"visual":""},{"q":"Точка X лежи на симетралата на отсечката CD. Ако XD=6 cm, колко cm е XC?","answer":"6","hint":"Всяка точка от симетралата е на равни разстояния от краищата на отсечката.","solution":"XC=XD=6 cm.","alt":[],"visual":""},{"q":"Точка M е среда на отсечката AB и симетралата s минава през M перпендикулярно на AB. Какъв ъгъл сключва s с AB (в градуси)?","answer":"90","hint":"По дефиниция симетралата е перпендикулярна на отсечката.","solution":"Симетралата е перпендикулярна на AB, т.е. ъгълът е 90°.","alt":[],"visual":""},{"q":"Точка K лежи на симетралата на отсечка PQ. Ако PK=11 cm, колко cm е QK?","answer":"11","hint":"Точките от симетралата са на равни разстояния от краищата.","solution":"QK=PK=11 cm.","alt":[],"visual":""}],"medium":[{"q":"За точка P е дадено PA = PB. Какво следва за положението на P спрямо отсечката AB? Запишете: „лежи на симетралата“.","answer":"лежи на симетралата","hint":"Използвай признака за точки от симетралата.","solution":"P лежи на симетралата на AB.","alt":["на симетралата"],"visual":""},{"q":"В △ABC AC=8 cm, AB=5 cm. Симетралата на страната BC пресича AC в точка M. Намерете периметъра на △ABM (в cm).","answer":"13","hint":"От M на симетралата на BC следва MB=MC, затова MA+MB=MA+MC=AC.","solution":"P=AB+BM+MA=AB+MC+MA=AB+AC=5+8=13 cm.","alt":[],"visual":""},{"q":"В △ABC симетралата на страната AB пресича ъглополовящата на ∠ABC в точка L, лежаща на AC. Ако ∠ACB=75°, намерете ∠BAC.","answer":"35","hint":"От L на симетралата следва LA=LB, а от ъглополовящата ∠ABL=∠LBC; означете ∠BAC=α, тогава ∠ABC=2α.","solution":"α+2α+75=180 ⇒ 3α=105 ⇒ α=35°.","alt":[],"visual":""},{"q":"В △ABC AC=10 cm, AB=6 cm. Симетралата на страната BC пресича AC в точка M. Намерете периметъра на △ABM (в cm).","answer":"16","hint":"MB=MC (от симетралата), затова периметърът е AB+AC.","solution":"P=AB+AC=6+10=16 cm.","alt":[],"visual":""}],"hard":[{"q":"При построяване на симетралата на отсечката AB се построяват две окръжности с центрове A и B, които се пресичат в две точки. Какви трябва да са радиусите им — равни или различни?","answer":"равни","hint":"Двете пресечни точки трябва да са еднакво отдалечени от A и B.","solution":"Радиусите трябва да са равни и достатъчно големи, за да се пресекат окръжностите в две точки.","alt":[],"visual":""},{"q":"В △ABC симетралата на страната BC пресича страната AB в точка M — средата на AB. Ако ∠AMC=140°, намерете ∠A.","answer":"20","hint":"От MB=MC следва △MBC равнобедрен; после от MA=MB и ∠AMC=140° получавате и △AMC равнобедрен.","solution":"MB=MC (M е от симетралата на BC) и MA=MB (M е среда на AB), следователно MA=MC и △AMC е равнобедрен. От 2∠A+140=180 ⇒ ∠A=20°.","alt":[],"visual":""},{"q":"△ABC е равнобедрен с AC=BC и ∠C=36°. Симетралата на страната AC пресича BC в точка M. Ъгълът ∠MAB е:","answer":"36","hint":"Намерете ∠BAC от равнобедрения триъгълник, после ∠MAC от MA=MC.","solution":"∠BAC=72° (от 2∠A=180−36), ∠MAC=36° (защото MA=MC), ∠MAB=72−36=36°.","alt":[],"visual":""},{"q":"В △ABC AB=10 cm. Симетралите на AC и BC се пресичат в точка O, лежаща на AB, при това O е среда на AB. Какво е разстоянието от O до C (в cm)?","answer":"5","hint":"Ако центърът на описаната окръжност лежи на AB, то ∠C=90° и OC=OA=OB.","solution":"OC=OA=OB=AB:2=10:2=5 cm.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"Точка P лежи на ъглополовящата на ∠A. Сравнете разстоянията от P до двете рамена на ъгъла.","answer":"равни","hint":"Това е свойство на точките от ъглополовящата.","solution":"Разстоянията са равни.","alt":[],"visual":""},{"q":"Точка X лежи на ъглополовящата на ∠AOB. Ако разстоянието от X до OA е 5 cm, колко cm е разстоянието от X до OB?","answer":"5","hint":"Всяка точка от ъглополовящата е на равни разстояния от рамената на ъгъла.","solution":"Разстоянието до OB също е 5 cm.","alt":[],"visual":""},{"q":"В △ABC AL е ъглополовяща на ∠A. Ако ∠BAL=27°, колко е ∠LAC?","answer":"27","hint":"Ъглополовящата разделя ъгъла на две равни части.","solution":"∠LAC=∠BAL=27°.","alt":[],"visual":""},{"q":"Ъглополовящата на ∠MON дели го на два ъгъла. Ако ∠MON=80°, колко градуса е всеки от получените ъгли?","answer":"40","hint":"Ъглополовящата дели ъгъла на две равни части.","solution":"80:2=40°.","alt":[],"visual":""}],"medium":[{"q":"Точка P е вътрешна за даден ъгъл и разстоянията от P до двете му рамена са равни. Къде лежи P?","answer":"на ъглополовящата","hint":"Използвай признака за точка от ъглополовящата.","solution":"P лежи на ъглополовящата.","alt":["ъглополовящата"],"visual":""},{"q":"В △ABC ъглополовящата на ∠ACB е CL. Ако разстоянието от L до AC е 7 cm, колко cm е разстоянието от L до BC?","answer":"7","hint":"Точките от ъглополовящата са на равни разстояния от рамената на ъгъла.","solution":"Разстоянието до BC също е 7 cm.","alt":[],"visual":""},{"q":"∠ABC=60° и точка N от AC е на равни разстояния 5 cm от страните AB и BC. Намерете дължината на BN (в cm).","answer":"10","hint":"BN е ъглополовяща на ъгъл 60°; разстоянието 5 cm е катет срещу 30° в правоъгълния триъгълник с хипотенуза BN.","solution":"Ъгълът при B в получения правоъгълен триъгълник е 30° ⇒ BN=2·5=10 cm.","alt":[],"visual":""},{"q":"В △ABC (∠C=90°), ∠A=30° и BL е ъглополовяща на ∠B (L∈AC), като AL:LC=2:1. Ако LC=6 cm, намерете AL (в cm).","answer":"12","hint":"Използвайте отношението AL:LC=2:1.","solution":"AL=2·LC=2·6=12 cm.","alt":[],"visual":""}],"hard":[{"q":"Построена е ъглополовящата на ъгъл с големина 86°. Каква е големината на всеки от двата получени ъгъла?","answer":"43","hint":"Раздели ъгъла на две равни части.","solution":"86:2=43°.","alt":[],"visual":""},{"q":"В △ABC AL е ъглополовяща на ∠A (L∈BC). ∠B=70°, ∠C=30°. Намерете ∠ALB (в градуси).","answer":"70","hint":"Първо намерете ∠A, после половината му ∠BAL, и приложете сбора на ъглите в △ABL.","solution":"∠A=180−70−30=80°, ∠BAL=40°, ∠ALB=180−70−40=70°.","alt":[],"visual":""},{"q":"В △ABC AL е ъглополовяща на ∠A. ∠ABC=50°, ∠ALB=115°. Намерете ∠ACB (в градуси).","answer":"100","hint":"Първо намерете ∠BAL от △ABL, после удвоете за ∠A.","solution":"∠BAL=180−50−115=15°, ∠A=30°, ∠C=180−30−50=100°.","alt":[],"visual":""},{"q":"Ъглополовящите на ∠B и ∠C на △ABC се пресичат в точка O. ∠BOC=110°. Намерете ∠A (в градуси).","answer":"40","hint":"Използвайте ∠BOC=90°+∠A:2.","solution":"110=90+∠A:2 ⇒ ∠A:2=20 ⇒ ∠A=40°.","alt":[],"visual":""}]}},"14":{"skill1":{"easy":[{"q":"В правоъгълен триъгълник хипотенузата е 18 cm, а един от острите ъгли е 30°. Намерете дължината на катета срещу ъгъла 30°.","answer":"9","hint":"Катетът срещу 30° е половината от хипотенузата.","solution":"18:2=9 cm.","alt":[],"visual":""},{"q":"В правоъгълен триъгълник хипотенузата е 14 cm, а един от острите ъгли е 30°. Намерете катета срещу този ъгъл (в cm).","answer":"7","hint":"Катетът срещу ъгъл 30° е половината от хипотенузата.","solution":"14:2=7 cm.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Правоъгълен триъгълник ABC с прав ъгъл при C\"><polygon points=\"70,155 275,155 70,30\"/><line x1=\"70\" y1=\"137\" x2=\"88\" y2=\"137\"/><line x1=\"88\" y1=\"137\" x2=\"88\" y2=\"155\"/><text x=\"55\" y=\"174\">C</text><text x=\"281\" y=\"174\">B</text><text x=\"55\" y=\"24\">A</text></svg>"},{"q":"В правоъгълен триъгълник катетът срещу ъгъл 30° е 5 cm. Намерете хипотенузата (в cm).","answer":"10","hint":"Хипотенузата е два пъти по-голяма от катета срещу 30°.","solution":"5·2=10 cm.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Правоъгълен триъгълник ABC с прав ъгъл при C\"><polygon points=\"70,155 275,155 70,30\"/><line x1=\"70\" y1=\"137\" x2=\"88\" y2=\"137\"/><line x1=\"88\" y1=\"137\" x2=\"88\" y2=\"155\"/><text x=\"55\" y=\"174\">C</text><text x=\"281\" y=\"174\">B</text><text x=\"55\" y=\"24\">A</text></svg>"},{"q":"В правоъгълен триъгълник хипотенузата е 22 cm. Намерете катета срещу ъгъла 30° (в cm).","answer":"11","hint":"Катетът срещу 30° е половината от хипотенузата.","solution":"22:2=11 cm.","alt":[],"visual":"<svg viewBox=\"0 0 340 190\" role=\"img\" aria-label=\"Правоъгълен триъгълник ABC с прав ъгъл при C\"><polygon points=\"70,155 275,155 70,30\"/><line x1=\"70\" y1=\"137\" x2=\"88\" y2=\"137\"/><line x1=\"88\" y1=\"137\" x2=\"88\" y2=\"155\"/><text x=\"55\" y=\"174\">C</text><text x=\"281\" y=\"174\">B</text><text x=\"55\" y=\"24\">A</text></svg>"}],"medium":[{"q":"В правоъгълен триъгълник катетът срещу ъгъл 30° е 7 cm. Намерете дължината на хипотенузата.","answer":"14","hint":"Катетът е половината от хипотенузата.","solution":"Хипотенузата е 2·7=14 cm.","alt":[],"visual":""},{"q":"В △ABC (∠C=90°), ∠A=30°. AB=4x cm и BC=(x+9) cm е катетът срещу ъгъла при A. Намерете x.","answer":"9","hint":"BC=AB:2 (катет срещу ъгъл 30°).","solution":"x+9=4x:2=2x ⇒ x=9.","alt":[],"visual":""},{"q":"В △ABC (∠C=90°), ∠B=30°. AB=3x+2 cm, AC=x+6 cm е катетът срещу ъгъла при B. Намерете x.","answer":"10","hint":"AC=AB:2 (катет срещу ъгъл 30°).","solution":"x+6=(3x+2):2 ⇒ 2x+12=3x+2 ⇒ x=10.","alt":[],"visual":""},{"q":"В правоъгълен △ABC (∠C=90°) с ∠B=30°. Ако AC+AB=27 cm (AC е катетът срещу B), намерете AB (хипотенузата, в cm).","answer":"18","hint":"Изразете AC чрез AB (AC=AB:2) и решете уравнението.","solution":"AB:2+AB=27 ⇒ 1,5·AB=27 ⇒ AB=18 cm.","alt":[],"visual":""}],"hard":[{"q":"В правоъгълен △ABC ∠C=90°, ∠A=30°, BC=x+2, AB=3x−2. Намерете x.","answer":"6","hint":"BC е катетът срещу 30°, следователно AB=2BC.","solution":"3x−2=2(x+2) ⇒ x=6.","alt":[],"visual":""},{"q":"Даден е правоъгълен △ABC (∠B=90°) с ∠A=30°. BD (D∈AC) е височина, CL (L∈AB) е ъглополовяща и BD+CL=14 cm. Намерете дължината на AB (в cm).","answer":"12","hint":"Изразете BD и CL чрез общ параметър x, като използвате свойството на ъгъл 30°.","solution":"BL=x, CL=2x, AB=3x, BD=AB:2=1,5x; от 1,5x+2x=14 ⇒ x=4 ⇒ AB=12 cm.","alt":[],"visual":""},{"q":"В △ABC ъглите са в отношение α:β:γ=2:1:3, а AL е ъглополовяща (L∈BC). Ако LB=10 cm, колко cm е LC?","answer":"5","hint":"Намерете ъглите (γ=90°, β=30°, α=60°); AL дели α на 30°+30°, което прави △ABL равнобедрен, а LC:LB=1:2.","solution":"LC=LB:2=10:2=5 cm.","alt":[],"visual":""},{"q":"В правоъгълен △ABC (∠C=90°) ∠A=15° и височината към хипотенузата е CH=12 cm. Намерете AB (хипотенузата, в cm).","answer":"48","hint":"При остър ъгъл 15° височината към хипотенузата е ¼ от нея.","solution":"CH=AB:4 ⇒ AB=4·12=48 cm.","alt":[],"visual":""}]},"skill2":{"easy":[{"q":"В правоъгълен триъгълник хипотенузата е 20 cm. Намерете дължината на медианата към хипотенузата.","answer":"10","hint":"Медианата към хипотенузата е половината от нея.","solution":"20:2=10 cm.","alt":[],"visual":""},{"q":"Хипотенузата на правоъгълен триъгълник е 18 cm. Намерете медианата към нея (в cm).","answer":"9","hint":"Медианата към хипотенузата е половината от нея.","solution":"18:2=9 cm.","alt":[],"visual":""},{"q":"Медианата към хипотенузата на правоъгълен триъгълник е 6 cm. Намерете хипотенузата (в cm).","answer":"12","hint":"Хипотенузата е два пъти по-голяма от медианата към нея.","solution":"6·2=12 cm.","alt":[],"visual":""},{"q":"Хипотенузата е 26 cm. Намерете медианата към хипотенузата (в cm).","answer":"13","hint":"Медианата към хипотенузата е половината от нея.","solution":"26:2=13 cm.","alt":[],"visual":""}],"medium":[{"q":"В правоъгълен триъгълник медианата към хипотенузата е 9 cm. Намерете дължината на хипотенузата.","answer":"18","hint":"Обратното приложение: хипотенузата е два пъти медианата.","solution":"2·9=18 cm.","alt":[],"visual":""},{"q":"В △ABC (∠C=90°) CM е медиана. Ако AB=12,6 cm, намерете CM (в cm).","answer":"6,3","hint":"Медианата към хипотенузата е половината от нея.","solution":"CM=12,6:2=6,3 cm.","alt":["6.3"],"visual":""},{"q":"В △ABC (∠C=90°) CM е медиана. Ако CM=4,5 cm, намерете AB (в cm).","answer":"9","hint":"Хипотенузата е два пъти по-голяма от медианата към нея.","solution":"AB=2·4,5=9 cm.","alt":[],"visual":""},{"q":"В △ABC (∠C=90°) CM е медиана. Ако AB+CM=18 cm, намерете CM (в cm).","answer":"6","hint":"AB=2·CM; заместете в уравнението.","solution":"2·CM+CM=18 ⇒ 3·CM=18 ⇒ CM=6 cm.","alt":[],"visual":""}],"hard":[{"q":"В правоъгълен триъгълник медианата към хипотенузата е x+1, а хипотенузата е 3x−4. Намерете x.","answer":"6","hint":"Хипотенузата е два пъти медианата.","solution":"3x−4=2(x+1) ⇒ x=6.","alt":[],"visual":""},{"q":"В △ABC за ъглите α, β, γ е дадено α:β:γ=4:5:9. CH е височина и CM е медиана към хипотенузата AB. Намерете ∠MCH (в градуси).","answer":"10","hint":"Всяка част е 10° (сборът е 18 части = 180°); ъгълът между медианата и височината е разликата на острите ъгли.","solution":"α=40°, β=50°, ∠MCH=β−α=50−40=10°.","alt":[],"visual":""},{"q":"В △ABC (∠C=90°) α=25°, CM е медиана и CH е височина към AB. Намерете ∠MCH (в градуси).","answer":"40","hint":"β=90°−α; ъгълът между медианата и височината е β−α.","solution":"β=90−25=65°, ∠MCH=65−25=40°.","alt":[],"visual":""},{"q":"В △ABC (∠C=90°) α=55°, AM=MB и CH⊥AB. Намерете ∠MCH (в градуси).","answer":"20","hint":"β=90°−α; тъй като α>β, ъгълът между медианата и височината е α−β.","solution":"β=90−55=35°, ∠MCH=55−35=20°.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"Два правоъгълни триъгълника имат съответно равни двата катета. Следва ли, че триъгълниците са еднакви?","answer":"да","hint":"Това следва от I признак — включеният ъгъл е 90°.","solution":"Да, триъгълниците са еднакви.","alt":[],"visual":""},{"q":"Два правоъгълни триъгълника имат съответно равни по един катет и остър ъгъл. Еднакви ли са?","answer":"да","hint":"Правият ъгъл винаги е равен, катетът и острият ъгъл добавят нужните двойки елементи.","solution":"Да.","alt":[],"visual":""},{"q":"Два правоъгълни триъгълника имат съответно равни хипотенуза и остър ъгъл. Еднакви ли са?","answer":"да","hint":"Правият ъгъл е общ за двата триъгълника.","solution":"Да.","alt":[],"visual":""},{"q":"Два правоъгълни триъгълника имат съответно равни катет и хипотенуза. Еднакви ли са?","answer":"да","hint":"Това е признакът за еднаквост на правоъгълни триъгълници (IV признак).","solution":"Да, по IV признак.","alt":[],"visual":""}],"medium":[{"q":"Два правоъгълни триъгълника имат съответно равни хипотенузите и по един катет. Следва ли, че триъгълниците са еднакви?","answer":"да","hint":"Това е признак за еднаквост на правоъгълни триъгълници.","solution":"Да, те са еднакви.","alt":[],"visual":""},{"q":"Два правоъгълни триъгълника имат съответно равни по един катет и прилежащия му остър ъгъл. По кой признак — I, II или IV?","answer":"II","hint":"Катетът е между правия ъгъл и острия ъгъл.","solution":"II признак.","alt":[],"visual":""},{"q":"Два правоъгълни триъгълника имат съответно равни хипотенуза и остър ъгъл. По кой признак — I, II или IV?","answer":"II","hint":"Третият ъгъл също е равен (от сбора на ъглите в триъгълника, който е 180°); хипотенузата свързва върховете на двата остри ъгъла, така че тя е страната, лежаща между тях — затова е II признак (два ъгъла и лежащата между тях страна).","solution":"II признак.","alt":[],"visual":""},{"q":"В △ABC височините от два острите ъгъла (AH₁ и BH₂) са равни. Кой признак доказва △ABH₁ ≅ △BAH₂ (обща хипотенуза AB, прави ъгли при H₁ и H₂)?","answer":"IV","hint":"Общата страна AB е хипотенуза за двата правоъгълни триъгълника.","solution":"IV признак (катет и хипотенуза).","alt":[],"visual":""}],"hard":[{"q":"Два правоъгълни триъгълника имат съответно равни хипотенузите и по един остър ъгъл. Следва ли, че триъгълниците са еднакви?","answer":"да","hint":"При правоъгълните триъгълници това е случай на II признак: хипотенуза и остър ъгъл са съответно равни.","solution":"Да — еднакви са.","alt":[],"visual":""},{"q":"Два остроъгълни триъгълника имат съответно равни две страни и височина към една от тях. Еднакви ли са триъгълниците?","answer":"да","hint":"Височината и една от страните образуват правоъгълен триъгълник, еднакъв по IV признак с другия.","solution":"Да.","alt":[],"visual":""},{"q":"△ABC (∠C=90°) и △A₁B₁C₁ (∠C₁=90°) имат AC=A₁C₁ и медианите CM=C₁M₁ към хипотенузите, съответно равни. Достатъчно ли е това, за да се докаже △ABC ≅ △A₁B₁C₁?","answer":"да","hint":"От равните медиани следва равенство на хипотенузите (AB=2CM=2C₁M₁=A₁B₁).","solution":"Да — по IV признак (катет и хипотенуза).","alt":[],"visual":""},{"q":"△ABC (∠C=90°) и △A₁B₁C₁ (∠C₁=90°) имат ∠A=∠A₁=30° и AC=A₁C₁ (катетът, прилежащ на ъгъла от 30°). Достатъчно ли е това, за да се докаже еднаквост чрез II признак?","answer":"да","hint":"Катетът AC е между правия ъгъл при C и острия ъгъл при A.","solution":"Да — II признак.","alt":[],"visual":""}]}},"15":{"skill1":{"easy":[{"q":"Решете неравенството 3x − 6 > 9 и запишете решението във вида x > ... .","answer":"x>5","hint":"Решавай както уравнение; делиш на положително число.","solution":"3x>15 ⇒ x>5.","alt":["5<x"],"visual":""},{"q":"Решете: 5x−3>2(2x−3).","answer":"x>-3","hint":"Разкрий скобата вдясно и събери подобни членове.","solution":"5x−3>4x−6 ⇒ x>−3.","alt":["−3<x"],"visual":""},{"q":"Решете: 2(2x−5)<5(x−2).","answer":"x>0","hint":"Разкрий скобите от двете страни, преди да местиш членовете.","solution":"4x−10<5x−10 ⇒ −x<0 ⇒ x>0.","alt":["0<x"],"visual":""},{"q":"Решете: 2x−7≤3x+4.","answer":"x>=-11","hint":"Премести x-членовете в едната страна, числата в другата.","solution":"−x≤11 ⇒ x≥−11.","alt":["x≥−11","−11≤x"],"visual":""}],"medium":[{"q":"Решете неравенството 2(x − 3) + 4 ≤ x + 7.","answer":"x≤9","hint":"Разкрий скобата и събери членовете с x.","solution":"2x−6+4≤x+7 ⇒ x≤9.","alt":["x<=9"],"visual":""},{"q":"Решете: (x+3)²≤x(x−3).","answer":"x<=-1","hint":"Разкрий (x+3)² и умножението x(x−3) — квадратните членове се съкращават.","solution":"x²+6x+9≤x²−3x ⇒ 9x≤−9 ⇒ x≤−1.","alt":["x≤−1"],"visual":""},{"q":"Решете: 3(2x−7)>2(4x−7,5).","answer":"x<-3","hint":"Разкрий скобите внимателно с десетичната дроб 7,5.","solution":"6x−21>8x−15 ⇒ −2x>6 ⇒ x<−3.","alt":["−3>x"],"visual":""},{"q":"Решете: (2x+1)²>(2x−3)(2x+3).","answer":"x>-2,5","hint":"Дясната страна е разлика на квадрати: (2x)²−3².","solution":"4x²+4x+1>4x²−9 ⇒ 4x>−10 ⇒ x>−2,5.","alt":["x>-2.5","x>−5/2"],"visual":""}],"hard":[{"q":"Решете неравенството 5 − 3x < 2x + 20.","answer":"x>-3","hint":"Събери x-членовете; при деление на отрицателно число знакът се обръща.","solution":"−5x<15 ⇒ x>−3.","alt":["x>−3"],"visual":""},{"q":"Решете: (x−1)(x²+x+1)+2x>x³−1.","answer":"x>0","hint":"Използвай тъждеството (x−1)(x²+x+1)=x³−1.","solution":"x³−1+2x>x³−1 ⇒ 2x>0 ⇒ x>0.","alt":["0<x"],"visual":""},{"q":"Решете: (5x−1)(x−2)<x(x+9)−23.","answer":"няма решение","hint":"Разкрий скобите — лявата страна ще стане пълен квадрат.","solution":"5x²−11x+2<x²+9x−23 ⇒ 4x²−20x+25<0 ⇒ (2x−5)²<0 — невярно за всяко x, значи няма решение.","alt":["no solution","0x<0"],"visual":""},{"q":"Решете: 6x−5<6x−1.","answer":"x∈R","hint":"x-членовете от двете страни се съкращават.","solution":"−5<−1 — вярно за всяко x, значи решение е всяко число.","alt":["всяко x","всяко число","x е произволно"],"visual":""}]},"skill2":{"easy":[{"q":"Запишете множеството от решения на неравенството x > 4 чрез числов интервал.","answer":"(4;+∞)","hint":"Лявата скоба е отворена, защото 4 не участва.","solution":"Решението е (4;+∞).","alt":["(4;+∞)","(4;∞)","x>4"],"visual":""},{"q":"Запишете с интервал решението x≥2.","answer":"[2;+∞)","hint":"При ≥ границата се включва — квадратна скоба.","solution":"x≥2 ⇔ x∈[2;+∞).","alt":["[2;inf)","x>=2"],"visual":""},{"q":"Запишете с интервал решението x<2.","answer":"(-∞;2)","hint":"Границата не участва — кръгла скоба.","solution":"x<2 ⇔ x∈(−∞;2).","alt":["(-inf;2)"],"visual":""},{"q":"Запишете с интервал решението x≤2.","answer":"(-∞;2]","hint":"При ≤ границата се включва.","solution":"x≤2 ⇔ x∈(−∞;2].","alt":["(-inf;2]"],"visual":""}],"medium":[{"q":"Запишете множеството от решения на неравенството x ≤ −2 чрез числов интервал.","answer":"(-∞;-2]","hint":"−2 участва, затова при него е квадратна скоба.","solution":"Решението е (−∞;−2].","alt":["(-∞;-2]","(−∞;-2]","x<=-2","x≤-2"],"visual":""},{"q":"Запишете неравенството, еквивалентно на интервала x∈(3;+∞).","answer":"x>3","hint":"Отворената скоба означава строго неравенство.","solution":"x∈(3;+∞) ⇔ x>3.","alt":["3<x"],"visual":""},{"q":"Запишете неравенството, еквивалентно на интервала x∈[−1;+∞).","answer":"x>=-1","hint":"Квадратната скоба означава, че −1 участва.","solution":"x∈[−1;+∞) ⇔ x≥−1.","alt":["x≥−1"],"visual":""},{"q":"Запишете неравенството, еквивалентно на интервала x∈(−∞;2].","answer":"x<=2","hint":"Квадратната скоба е при 2, защото то участва.","solution":"x∈(−∞;2] ⇔ x≤2.","alt":["x≤2"],"visual":""}],"hard":[{"q":"Решете неравенството 4 − 2x ≥ 10 и представете множеството от решения чрез числов интервал.","answer":"(-∞;-3]","hint":"Първо получи −2x≥6, после обърни знака при деление на −2.","solution":"x≤−3, т.е. (−∞;−3].","alt":["(-∞;-3]","(−∞;-3]","x<=-3","x≤-3"],"visual":""},{"q":"Запишете неравенството, еквивалентно на интервала x∈(−∞;−5).","answer":"x<-5","hint":"Кръгла скоба при −5 означава, че то не участва.","solution":"x∈(−∞;−5) ⇔ x<−5.","alt":["−5>x"],"visual":""},{"q":"Запишете с интервал решението x≥−11.","answer":"[-11;+∞)","hint":"Границата −11 участва — квадратна скоба отляво.","solution":"x≥−11 ⇔ x∈[−11;+∞).","alt":["[-11;inf)"],"visual":""},{"q":"Запишете с интервал множеството на всички реални числа.","answer":"(-∞;+∞)","hint":"Това е най-широкият интервал — от минус до плюс безкрайност.","solution":"Множеството на всички числа е интервалът (−∞;+∞).","alt":["(-inf;+inf)","R"],"visual":""}]},"skill3":{"easy":[{"q":"При графичното представяне на решението x > 2 върху числова ос точката при 2 трябва да бъде празна или плътна?","answer":"празна","hint":"При строго неравенство граничната стойност не участва.","solution":"Точката е празна.","alt":[],"visual":"<svg viewBox=\"0 0 400 105\" role=\"img\" aria-label=\"Числова ос\"><line x1=\"35\" y1=\"55\" x2=\"365\" y2=\"55\"/><line x1=\"200\" y1=\"43\" x2=\"200\" y2=\"67\"/><text x=\"191\" y=\"88\">2</text><circle cx=\"200\" cy=\"55\" r=\"7\" class=\"open\"/><line x1=\"209\" y1=\"55\" x2=\"345\" y2=\"55\" class=\"ray\"/><polyline points=\"334,45 347,55 334,65\" class=\"ray\"/></svg>"},{"q":"Решете и запишете отговора като интервал: 3x+1>x−5.","answer":"(-3;+∞)","hint":"Премести x-членовете в лявата страна.","solution":"2x>−6 ⇒ x>−3 ⇒ x∈(−3;+∞).","alt":["(-3;inf)","x>-3"],"visual":""},{"q":"Решете и запишете отговора като интервал: 4−(2x−3)+5≥0.","answer":"(-∞;6]","hint":"Разкрий скобата, като смениш знака на всеки член вътре.","solution":"12−2x≥0 ⇒ x≤6 ⇒ x∈(−∞;6].","alt":["(-inf;6]"],"visual":""},{"q":"Решете и запишете отговора като интервал: 3−(x+1)−2<0.","answer":"(0;+∞)","hint":"Опрости лявата страна, преди да местиш x.","solution":"−x<0 ⇒ x>0 ⇒ x∈(0;+∞).","alt":["(0;inf)"],"visual":""}],"medium":[{"q":"На числовата ос е показан лъч надясно от −1 с плътна точка при −1. Запишете съответното неравенство.","answer":"x≥-1","hint":"Плътна точка означава, че −1 участва; надясно означава по-големи стойности.","solution":"x≥−1.","alt":["x>=-1","x≥−1"],"visual":"<svg viewBox=\"0 0 400 105\" role=\"img\" aria-label=\"Числова ос\"><line x1=\"35\" y1=\"55\" x2=\"365\" y2=\"55\"/><line x1=\"200\" y1=\"43\" x2=\"200\" y2=\"67\"/><text x=\"191\" y=\"88\">-1</text><circle cx=\"200\" cy=\"55\" r=\"7\" class=\"filled\"/><line x1=\"209\" y1=\"55\" x2=\"345\" y2=\"55\" class=\"ray\"/><polyline points=\"334,45 347,55 334,65\" class=\"ray\"/></svg>"},{"q":"Решете и запишете отговора като интервал: x²−(x+5)(x−1)≤9.","answer":"[-1;+∞)","hint":"Разкрий (x+5)(x−1) — квадратните членове ще се съкратят.","solution":"−4x+5≤9 ⇒ x≥−1 ⇒ x∈[−1;+∞).","alt":["[-1;inf)"],"visual":""},{"q":"Решете и запишете отговора като интервал: (x+3)²>(x−2)(x+5)+1.","answer":"(-6;+∞)","hint":"Разкрий двете скоби отделно и съкрати x².","solution":"x²+6x+9>x²+3x−9 ⇒ 3x>−18 ⇒ x>−6 ⇒ x∈(−6;+∞).","alt":["(-6;inf)"],"visual":""},{"q":"Решете и запишете отговора като интервал: x−[7−x−(8+3x)]<3x+2.","answer":"(-∞;0,5)","hint":"Първо опрости израза в квадратната скоба.","solution":"5x+1<3x+2 ⇒ x<0,5 ⇒ x∈(−∞;0,5).","alt":["(-inf;0.5)"],"visual":""}],"hard":[{"q":"Разчетете показаното множество върху числовата ос и го запишете като числов интервал.","answer":"(-∞;3)","hint":"Лъчът е наляво, а точката при 3 е празна.","solution":"Интервалът е (−∞;3).","alt":["(-∞;3)","(−∞;3)","x<3"],"visual":"<svg viewBox=\"0 0 400 105\" role=\"img\" aria-label=\"Числова ос\"><line x1=\"35\" y1=\"55\" x2=\"365\" y2=\"55\"/><line x1=\"200\" y1=\"43\" x2=\"200\" y2=\"67\"/><text x=\"191\" y=\"88\">3</text><circle cx=\"200\" cy=\"55\" r=\"7\" class=\"open\"/><line x1=\"55\" y1=\"55\" x2=\"191\" y2=\"55\" class=\"ray\"/><polyline points=\"66,45 53,55 66,65\" class=\"ray\"/></svg>"},{"q":"Решете и запишете отговора като интервал: (3x−2)²≤(3x+1)²−15.","answer":"[1;+∞)","hint":"Разкрий двата квадрата поотделно.","solution":"−12x+4≤6x−14 ⇒ −18x≤−18 ⇒ x≥1 ⇒ x∈[1;+∞).","alt":["[1;inf)"],"visual":""},{"q":"Решете и запишете отговора като интервал: (x+2)³>x(x+5)(x+1)−6.","answer":"(-2;+∞)","hint":"Кубовете x³ от двете страни се съкращават.","solution":"12x+8>5x−6 ⇒ 7x>−14 ⇒ x>−2 ⇒ x∈(−2;+∞).","alt":["(-2;inf)"],"visual":""},{"q":"Решете и запишете отговора като интервал: x/2 + (x+1)/(−3) > 5.","answer":"(32;+∞)","hint":"Умножи двете страни по общия знаменател 6.","solution":"3x−2(x+1)>30 ⇒ x−2>30 ⇒ x>32 ⇒ x∈(32;+∞).","alt":["(32;inf)"],"visual":""}]}},"16":{"skill1":{"easy":[{"q":"В △ABC е дадено BC = 10 cm, AC = 8 cm и AB = 6 cm. Кой от ъглите ∠A, ∠B и ∠C е най-голям?","answer":"A","hint":"Най-големият ъгъл лежи срещу най-дългата страна.","solution":"Най-дълга е BC, срещу нея е ∠A.","alt":[],"visual":""},{"q":"Страните на △ABC са a=7 cm, b=9 cm, c=12 cm. Наредете по големина ъглите α, β, γ.","answer":"α<β<γ","hint":"Срещу по-малка страна лежи по-малък ъгъл.","solution":"a<b<c, значи срещуположните им ъгли следват същия ред: α<β<γ.","alt":["α < β < γ"],"visual":""},{"q":"В △ABC ъглите при върховете A и B са съответно 50° и 80°. Сравнете страните a, b, c.","answer":"a=c<b","hint":"Намери третия ъгъл и сравни трите ъгъла, преди да сравниш страните.","solution":"γ=180°−50°−80°=50°, значи α=γ=50°<β=80° ⇒ a=c<b.","alt":["a = c < b","c=a<b"],"visual":""},{"q":"Ъгълът при основата на равнобедрен триъгълник е 35°. Кое е по-голямо — основата или бедрото?","answer":"основата","hint":"Намери ъгъла при върха и го сравни с ъгъла при основата.","solution":"Ъгълът при върха е 180°−2·35°=110°>35°, значи основата (срещу върха) е по-голяма от бедрото.","alt":["основата е по-голяма"],"visual":""}],"medium":[{"q":"В △ABC е дадено ∠A = 80°, ∠B = 60° и ∠C = 40°. Коя от страните AB, BC и AC е най-дълга?","answer":"BC","hint":"Най-дългата страна лежи срещу най-големия ъгъл.","solution":"Срещу ∠A=80° лежи BC.","alt":[],"visual":""},{"q":"В △ABC ъглите са α=100°, β=38°. Наредете по големина страните a, b, c.","answer":"b<c<a","hint":"Пресметни γ и подреди трите ъгъла по големина.","solution":"γ=180°−100°−38°=42°, значи β=38°<γ=42°<α=100° ⇒ b<c<a.","alt":["b < c < a"],"visual":""},{"q":"Правоъгълен △ABC има ∡C=90° и ∡A=48°. Кой катет е по-голям — a или b?","answer":"a>b","hint":"Намери и втория остър ъгъл, после сравни катетите.","solution":"∡B=90°−48°=42°<48°=∡A, значи катетът a (срещу A) е по-голям от катета b.","alt":["a > b","BC>AC"],"visual":""},{"q":"Ъгълът между бедрата на равнобедрен триъгълник е 130°. Кое е по-голямо — основата или бедрото?","answer":"основата","hint":"Пресметни ъглите при основата (те са равни).","solution":"Ъглите при основата са (180°−130°)/2=25° всеки, което е по-малко от 130°, значи основата (срещу върха) е по-голяма.","alt":["основата е по-голяма"],"visual":""}],"hard":[{"q":"В △ABC е дадено AB > AC. Кой от ъглите ∠B и ∠C е по-голям?","answer":"C","hint":"Срещу по-голямата страна лежи по-голям ъгъл.","solution":"Срещу по-голямата страна AB лежи ∠C, затова ∠C > ∠B.","alt":["∠C","ъгъл C","C"],"visual":""},{"q":"В △ABC е известно, че α<γ<β. Наредете по големина страните a, b, c.","answer":"a<c<b","hint":"Всяка страна следва реда на срещуположния ѝ ъгъл.","solution":"От α<γ<β следва a<c<b.","alt":["a < c < b"],"visual":""},{"q":"Ъгълът при основата на равнобедрен триъгълник е 70°. Кое е по-голямо — основата или бедрото?","answer":"бедрото","hint":"Този път ъгълът при основата е по-голям от ъгъла при върха.","solution":"Ъгълът при върха е 180°−2·70°=40°<70°, значи бедрото (срещу ъгъла при основата) е по-голямо от основата.","alt":["бедрото е по-голямо"],"visual":""},{"q":"В △ABC е дадено BC < AC. Кой от ъглите ∠A и ∠B е по-малък?","answer":"A","hint":"По-малката страна лежи срещу по-малкия ъгъл.","solution":"Срещу по-малката страна BC лежи ∠A, срещу AC — ∠B, затова ∠A<∠B — по-малкият е ∠A.","alt":["∠A","ъгъл A"],"visual":""},{"q":"Ъгълът при върха на равнобедрен триъгълник е 30°. Кое е по-голямо — основата или бедрото?","answer":"бедрото","hint":"Пресметни ъглите при основата (те са равни) и ги сравни с ъгъла при върха.","solution":"Ъглите при основата са (180°−30°)/2=75° всеки, което е по-голямо от 30°, значи бедрото (срещу по-големия ъгъл при основата) е по-голямо от основата.","alt":["бедрото е по-голямо"],"visual":""}]},"skill2":{"easy":[{"q":"Съществува ли триъгълник със страни 3 cm, 4 cm и 8 cm?","answer":"не","hint":"Сборът на двете по-малки трябва да е по-голям от третата.","solution":"3+4=7<8 — не може.","alt":[],"visual":""},{"q":"Може ли да съществува триъгълник със страни 1, 3 и 4 cm?","answer":"не","hint":"Сравни сбора на двете по-малки страни с най-голямата.","solution":"1+3=4, а трябва да е строго по-голямо от 4 — не е изпълнено, значи триъгълник няма.","alt":["no","не може"],"visual":""},{"q":"Може ли да съществува триъгълник със страни 2, 4 и 5 cm?","answer":"да","hint":"Провери дали сборът на двете по-малки страни е по-голям от най-голямата.","solution":"2+4=6>5 — изпълнено, значи триъгълникът съществува.","alt":["yes","може"],"visual":""},{"q":"Съществува ли триъгълник със страни 5 cm, 6 cm и 10 cm?","answer":"да","hint":"Сборът на двете по-малки трябва да е по-голям от третата.","solution":"5+6=11>10 — може.","alt":["yes","може"],"visual":""},{"q":"Може ли да съществува триъгълник със страни 2, 5 и 7 cm?","answer":"не","hint":"Сравни сбора на двете по-малки страни с най-голямата.","solution":"2+5=7, а трябва да е строго по-голямо от 7 — не е изпълнено, значи триъгълник няма.","alt":["no","не може"],"visual":""}],"medium":[{"q":"Съществува ли триъгълник със страни 6 cm, 8 cm и 13 cm?","answer":"да","hint":"Провери най-важното: 6+8>13.","solution":"14>13 — може.","alt":[],"visual":""},{"q":"Може ли да съществува триъгълник със страни 3, 5 и 6 cm?","answer":"да","hint":"Сравни сбора на двете по-малки страни с най-голямата.","solution":"3+5=8>6 — изпълнено, триъгълникът съществува.","alt":["yes"],"visual":""},{"q":"Може ли да съществува триъгълник със страни 6, 6 и 6 cm?","answer":"да","hint":"Равностранен триъгълник — провери неравенството все пак.","solution":"6+6=12>6 — изпълнено, триъгълникът съществува.","alt":["yes"],"visual":""},{"q":"Може ли да съществува равнобедрен триъгълник със страни 4, 4 и 8 cm?","answer":"не","hint":"Провери сбора на двете равни страни срещу третата.","solution":"4+4=8, а трябва да е строго по-голямо от 8 — не е изпълнено, триъгълник няма.","alt":["no"],"visual":""}],"hard":[{"q":"Две от страните на триъгълник са 7 cm и 11 cm. Кое от числата 3, 4 и 18 може да бъде дължината на третата страна?","answer":"нито едно","hint":"Третата страна x трябва да изпълнява |11−7|<x<18, т.е. 4<x<18 — но 4 не е строго по-голямо. Провери внимателно.","solution":"Нито едно от трите числа не е допустимо.","alt":["нито едно"],"visual":""},{"q":"Може ли да съществува равнобедрен триъгълник със страни 5, 5 и 10 cm?","answer":"не","hint":"Сборът на бедрата трябва да е строго по-голям от основата.","solution":"5+5=10, а трябва да е строго по-голямо от 10 — не е изпълнено, триъгълник няма.","alt":["no"],"visual":""},{"q":"Може ли да съществува равнобедрен триъгълник със страни 7, 7 и 14 cm?","answer":"не","hint":"Провери граничния случай на неравенството на триъгълника.","solution":"7+7=14, а трябва да е строго по-голямо от 14 — не е изпълнено, триъгълник няма.","alt":["no"],"visual":""},{"q":"Може ли да съществува равнобедрен триъгълник със страни 9, 9 и 18 cm?","answer":"не","hint":"Сборът на бедрата трябва да е строго по-голям от основата.","solution":"9+9=18, а трябва да е строго по-голямо от 18 — не е изпълнено, триъгълник няма.","alt":["no"],"visual":""},{"q":"Две от страните на триъгълник са 8 cm и 15 cm. Кое от числата 7, 16 и 23 може да бъде дължината на третата страна?","answer":"16","hint":"Третата страна x трябва да изпълнява |15−8|<x<15+8, т.е. 7<x<23.","solution":"От дадените числа само 16 е строго между 7 и 23, значи третата страна може да бъде 16 cm.","alt":["16 cm"],"visual":""}]},"skill3":{"easy":[{"q":"Две от страните на триъгълник са 5 cm и 8 cm. Кое е най-малкото цяло число, което може да бъде дължината в сантиметри на третата страна?","answer":"4","hint":"Третата страна x трябва да е по-голяма от 8−5=3.","solution":"x>3 ⇒ най-малкото цяло е 4.","alt":[],"visual":""},{"q":"Две страни на равнобедрен триъгълник са 5 cm и 12 cm. Кое от двете е бедро?","answer":"12","hint":"Провери коя от двете комбинации (5,5,12) или (12,12,5) удовлетворява неравенството на триъгълника.","solution":"5+5=10<12 — невъзможно; 12+12=24>5 — възможно. Значи бедрото е 12 cm.","alt":["12 cm","бедрото е 12"],"visual":""},{"q":"Две от страните на равнобедрен триъгълник са 8 cm и 4 cm. Намерете третата страна.","answer":"8","hint":"Провери двете възможности: (8,8,4) и (4,4,8).","solution":"8+8=16>4 — възможно; 4+4=8 не е строго по-голямо от 8 — невъзможно. Третата страна е 8 cm.","alt":["8 cm"],"visual":""},{"q":"Две страни на триъгълник са 5 cm и 9 cm. Кое от числата 3, 10, 20 може да е трета страна?","answer":"10","hint":"Третата страна x трябва да удовлетворява |9−5|<x<9+5.","solution":"4<x<14 — от дадените числа само 10 попада в интервала.","alt":["10 cm"],"visual":""}],"medium":[{"q":"Две от страните на триъгълник са 6 cm и 10 cm, а третата има дължина x cm. Колко цели стойности може да приема x?","answer":"11","hint":"Трябва 4<x<16. Преброй целите числа 5,6,...,15.","solution":"Има 11 стойности.","alt":[],"visual":""},{"q":"Две от страните на равнобедрен триъгълник са 10 cm и 3 cm. Намерете третата страна.","answer":"10","hint":"Провери двете възможности: (10,10,3) и (3,3,10).","solution":"10+10=20>3 — възможно; 3+3=6<10 — невъзможно. Третата страна е 10 cm.","alt":["10 cm"],"visual":""},{"q":"Две страни на триъгълник са 6 cm и 8 cm. Кое от числата 2, 9, 15 може да е трета страна?","answer":"9","hint":"Третата страна x трябва да удовлетворява |8−6|<x<8+6.","solution":"2<x<14 — от дадените числа само 9 попада в интервала (2 е граничната стойност и не се допуска).","alt":["9 cm"],"visual":""},{"q":"Две от страните на равнобедрен триъгълник са 6 cm и 4 cm. Намерете третата страна — възможна ли е повече от една стойност?","answer":"6 или 4","hint":"Провери и двете възможности: (6,6,4) и (4,4,6).","solution":"6+6=12>4 — възможно; 4+4=8>6 — също възможно. Третата страна е 6 или 4 cm.","alt":["4 или 6"],"visual":""}],"hard":[{"q":"Страните на триъгълник са x cm, (x + 3) cm и 14 cm, като 14 cm е най-голямата страна. Намерете най-малката цяла стойност на x > 0, за която такъв триъгълник съществува.","answer":"6","hint":"Използвай x+(x+3)>14.","solution":"2x+3>14 ⇒ x>5,5 ⇒ най-малкото цяло е 6.","alt":[],"visual":""},{"q":"Две от страните на равнобедрен триъгълник са 9 cm и 5 cm. Намерете третата страна — възможна ли е повече от една стойност?","answer":"9 или 5","hint":"Провери и двете възможности: (9,9,5) и (5,5,9).","solution":"9+9=18>5 — възможно; 5+5=10>9 — също възможно (макар и на ръба). Третата страна е 9 или 5 cm.","alt":["5 или 9"],"visual":""},{"q":"Две страни на триъгълник са 4 cm и 10 cm. Кое от числата 7, 13, 20 може да е трета страна?","answer":"7 или 13","hint":"Третата страна x трябва да удовлетворява |10−4|<x<10+4.","solution":"6<x<14 — от дадените числа и 7, и 13 попадат в интервала.","alt":["13 или 7"],"visual":""},{"q":"Периметърът на равнобедрен триъгълник е 42 cm, а едната страна е с 3 cm по-голяма от другата. Колко различни решения има?","answer":"2","hint":"Разгледай двата случая: бедрото е по-голямата страна и бедрото е по-малката страна — и провери неравенството на триъгълника за всеки.","solution":"Ако бедрата са x+3: 2(x+3)+x=42 ⇒ x=12, страни 15 cm, 15 cm, 12 cm (валиден, защото 15+15>12). Ако бедрата са x: 2x+(x+3)=42 ⇒ x=13, страни 13 cm, 13 cm, 16 cm (валиден, защото 13+13>16). И двата триъгълника удовлетворяват неравенството на триъгълника и съществуват, значи решенията са 2.","alt":[],"visual":""}]}},"17":{"skill1":{"easy":[{"q":"В успоредник ABCD е дадено ∠A = 72°. Намерете ∠B.","answer":"108","hint":"Съседните ъгли имат сбор 180°.","solution":"180−72=108°.","alt":[],"visual":""},{"q":"В успоредник ABCD ∠A=110°. Намерете ∠B.","answer":"70","hint":"Съседните ъгли на успоредник имат сбор 180°.","solution":"180−110=70°.","alt":[],"visual":""},{"q":"В успоредник ABCD ∠A=64°. Намерете ∠C.","answer":"64","hint":"Срещуположните ъгли на успоредник са равни.","solution":"∠C=∠A=64°.","alt":[],"visual":""},{"q":"Диагоналите на успоредник ABCD се пресичат в O. Ако BO=9 cm, колко е OD?","answer":"9","hint":"Диагоналите на успоредник взаимно се разполовяват.","solution":"BO=OD=9 cm.","alt":[],"visual":""}],"medium":[{"q":"Диагоналите AC и BD на успоредник ABCD се пресичат в точка O. Ако AO = 7 cm, намерете OC.","answer":"7","hint":"Диагоналите взаимно се разполовяват.","solution":"AO=OC=7 cm.","alt":[],"visual":""},{"q":"Разликата на два съседни ъгъла на успоредник е 36°. Намерете по-големия от тях.","answer":"108","hint":"Съседните ъгли имат сбор 180°: α+β=180°, β−α=36°.","solution":"2β=216°⇒β=108°.","alt":[],"visual":""},{"q":"Успоредник има страни a=10 cm и b=2 cm. Намерете периметъра му.","answer":"24","hint":"P=2(a+b).","solution":"P=2(10+2)=24 cm.","alt":[],"visual":""},{"q":"Периметърът на успоредник е 25 cm, а едната му страна е 8,5 cm. Намерете другата страна.","answer":"4","hint":"P=2(a+b), значи a+b=P/2.","solution":"25/2=12,5; 12,5−8,5=4 cm.","alt":[],"visual":""}],"hard":[{"q":"Диагоналите на четириъгълник взаимно се разполовяват. Какъв е този четириъгълник?","answer":"успоредник","hint":"Това е признак за успоредник.","solution":"Четириъгълникът е успоредник.","alt":[],"visual":""},{"q":"В успоредник ABCD ъглополовящата на ∠BAD пресича страната CD в точка Q. DQ=8 cm, CQ=5 cm. Намерете периметъра на успоредника.","answer":"42","hint":"Триъгълник ADQ е равнобедрен (AD=DQ), защото AB∥CD дава равни ъгли при основата.","solution":"AD=DQ=8 cm; CD=DQ+QC=13 cm; P=2(AD+CD)=2(8+13)=42 cm.","alt":[],"visual":""},{"q":"В успоредник ABCD ъглополовящата на ∠BAD пресича страната BC в точка N. BN=11 cm, NC=5 cm. Намерете периметъра на успоредника.","answer":"54","hint":"Понеже AN е ъглополовяща на ∠BAD и AD∥BC, получаваме ∠BAN=∠ANB. Следователно △ABN е равнобедрен и AB=BN.","solution":"AN е ъглополовяща на ∠BAD, затова ∠BAN=∠DAN. Понеже AD∥BC, получаваме ∠DAN=∠ANB. Следователно ∠BAN=∠ANB, △ABN е равнобедрен и AB=BN=11 cm. BC=BN+NC=11+5=16 cm. P=2(AB+BC)=2(11+16)=54 cm.","alt":[],"visual":""},{"q":"Успоредник има b=15 cm и a=(5/4)b. Намерете периметъра му.","answer":"67,5","hint":"Първо намерете a от a=(5/4)·15.","solution":"a=18,75 cm; P=2(a+b)=2(18,75+15)=67,5 cm.","alt":["67.5"],"visual":""}]},"skill2":{"easy":[{"q":"Колко градуса е всеки вътрешен ъгъл на правоъгълник? Запишете само числото.","answer":"90","hint":"По определение правоъгълникът има прав ъгъл, а като успоредник всички стават прави.","solution":"Всеки ъгъл е 90°.","alt":[],"visual":""},{"q":"Диагоналите на правоъгълник ABCD са равни. Ако AC=15 cm, колко е BD?","answer":"15","hint":"Диагоналите на правоъгълника са равни.","solution":"BD=AC=15 cm.","alt":[],"visual":""},{"q":"Колко градуса е всеки от ъглите на правоъгълник?","answer":"90","hint":"Правоъгълникът е успоредник с прав ъгъл, а срещуположните му ъгли са равни.","solution":"Всички ъгли на правоъгълника са по 90°.","alt":[],"visual":""},{"q":"Успоредник ABCD има равни диагонали. Какъв е той?","answer":"правоъгълник","hint":"Това е признак за правоъгълник.","solution":"Успоредник с равни диагонали е правоъгълник.","alt":[],"visual":""}],"medium":[{"q":"В правоъгълник ABCD диагоналите са AC и BD. Ако AC = 12 cm, намерете BD.","answer":"12","hint":"Диагоналите на правоъгълника са равни.","solution":"BD=12 cm.","alt":[],"visual":""},{"q":"Едната страна на правоъгълник е 5 dm и е 3 пъти по-малка от другата. Намерете периметъра на правоъгълника (в dm).","answer":"40","hint":"По-голямата страна е 3·5 dm.","solution":"a=5, b=3·5=15; P=2(5+15)=40 dm.","alt":[],"visual":""},{"q":"Ъгълът между диагоналите на правоъгълник (при основата, между двете по-къси страни) е 60°. Под какъв ъгъл диагоналите сключват с по-голямата страна?","answer":"30","hint":"Триъгълникът, образуван от центъра и двата края на по-късата страна, е равнобедрен с ъгъл 60° при центъра; намери първо ъгъла между диагонала и по-късата страна.","solution":"Триъгълникът от центъра O до двата края на по-късата страна е равнобедрен (двете рамене са половините на диагоналите) с ъгъл 60° при O, значи ъглите при основата са (180°−60°)/2=60° — това е ъгълът между диагонала и по-късата страна. Ъгълът на правоъгълника е 90°, затова ъгълът между диагонала и по-голямата страна е 90°−60°=30°.","alt":[],"visual":""},{"q":"В правоъгълник ъгълът между диагоналите е 60°. Колко пъти диагоналът е по-голям от по-малката страна?","answer":"2","hint":"Триъгълникът, образуван от центъра и двата края на по-късата страна, е равнобедрен; провери какъв е той при ъгъл 60° при центъра.","solution":"Триъгълникът от центъра O до двата края на по-късата страна е равнобедрен (OA=OD, половините на диагоналите) с ъгъл 60° при O. Ъглите при основата са (180°−60°)/2=60° — триъгълникът е равностранен, значи OA=OD=по-късата страна. Тъй като OA е половин диагонал, диагоналът е 2 пъти по-голям от по-късата страна.","alt":[],"visual":""}],"hard":[{"q":"Диагоналите на успоредник са равни. Какъв вид успоредник е той?","answer":"правоъгълник","hint":"Равните диагонали са признак за правоъгълник.","solution":"Той е правоъгълник.","alt":[],"visual":""},{"q":"Диагоналът на правоъгълник се дели от височина, спусната от връх, в отношение 1:3. Пресечната точка на диагоналите е на разстояние 5 cm от по-голямата страна. Намерете диагонала.","answer":"20","hint":"Центърът O на диагоналите дели AC наполовина; от AH:HC=1:3 намери AH и сравни с AO, за да видиш, че H е среда на AO — тогава BH е симетрала на AO. Разстоянието от O до по-голямата страна е равно на половината от по-малката.","solution":"Диагоналите на правоъгълника са равни и се разполовяват в центъра O, затова OA=OB=OC=OD=AC/2. От AH:HC=1:3 (AH+HC=AC) следва AH=AC/4; а AO=AC/2=2·AH, значи H е точно среда на AO. BH⊥AC минава през средата на AO, следователно BH е симетрала на AO, откъдето BA=BO=AC/2 (точка от симетрала е равноотдалечена от двата края на отсечката). Разстоянието от O до по-голямата страна е равно на половината от по-малката страна, а то е 5 cm, затова по-малката страна е 2·5=10 cm. По Питагоровата теорема BC²=AC²−BA²=AC²−(AC/2)²>(AC/2)², значи BC>BA — BA наистина е по-малката страна: BA=10 cm=AC/2, откъдето AC=2·10=20 cm.","alt":[],"visual":""},{"q":"В правоъгълник ъгълът между диагоналите (при по-малката страна) е 60°. Ако по-малката страна е 6 cm, намерете диагонала.","answer":"12","hint":"При ъгъл 60° диагоналът е двойно по-голям от по-малката страна (доказано свойство).","solution":"d=2·6=12 cm.","alt":[],"visual":""},{"q":"Диагоналът на правоъгълник е 13 cm, а едната му страна е 5 cm. Намерете другата страна.","answer":"12","hint":"Обратна питагорова теорема.","solution":"b=√(13²−5²)=√144=12 cm.","alt":[],"visual":""}]},"skill3":{"easy":[{"q":"Взаимно перпендикулярни ли са диагоналите на ромб?","answer":"да","hint":"Това е основно свойство на ромба.","solution":"Да, диагоналите са перпендикулярни.","alt":[],"visual":""},{"q":"Успоредник ABCD има взаимноперпендикулярни диагонали. Какъв четириъгълник е той?","answer":"ромб","hint":"Това е признак за ромб.","solution":"Такъв успоредник е ромб.","alt":[],"visual":""},{"q":"Правоъгълник има две равни съседни страни. Какъв е той?","answer":"квадрат","hint":"Това е едно от определенията за квадрат.","solution":"Правоъгълник с равни съседни страни е квадрат.","alt":[],"visual":""},{"q":"В ромб всички страни равни ли са?","answer":"да","hint":"Ромбът е успоредник с равни съседни страни.","solution":"Да, всички страни на ромба са равни.","alt":[],"visual":""}],"medium":[{"q":"Ромб има един прав ъгъл. Какъв вид успоредник е този ромб?","answer":"квадрат","hint":"Ромб с един прав ъгъл е квадрат.","solution":"Фигурата е квадрат.","alt":[],"visual":""},{"q":"Единият ъгъл на ромб е 42°. Намерете по-малкия от ъглите, които диагоналите образуват със страните му.","answer":"21","hint":"Диагоналът е ъглополовяща — разделете ъгъла на две.","solution":"42°/2=21°.","alt":[],"visual":""},{"q":"Единият ъгъл на ромб е 42°. Намерете по-големия от ъглите, които диагоналите образуват със страните му.","answer":"69","hint":"Съседният ъгъл е 180°−42°, после го разделете на две.","solution":"180°−42°=138°; 138°/2=69°.","alt":[],"visual":""},{"q":"Ъглите, които една страна на ромб образува с двата диагонала, се отнасят както 4:5. Намерете острия ъгъл на ромба.","answer":"80","hint":"Тези ъгли са половините на два съседни ъгъла на ромба; сборът на съседните ъгли е 180°, значи сборът на половините им е 90°.","solution":"4x+5x=90° ⇒ x=10°. Съседните ъгли на ромба са 2·4x=80° и 2·5x=100°, острият е 80°.","alt":[],"visual":""}],"hard":[{"q":"Диагоналите на успоредник са едновременно равни и взаимно перпендикулярни. Какъв вид успоредник е той?","answer":"квадрат","hint":"Равни диагонали насочват към правоъгълник, перпендикулярни — към ромб. И двете едновременно дават квадрат.","solution":"Успоредникът е квадрат.","alt":[],"visual":""},{"q":"Ромб ABCD има периметър 84 cm. Ъглополовящата на ∠BAC образува с диагонала BD ъгъл 75°. Намерете дължината на по-малкия диагонал BD.","answer":"21","hint":"AC е ъглополовяща на ъгъл A и AC⊥BD; означи ∠BAC=φ и намери φ от дадения 75° ъгъл.","solution":"Нека ∠BAC=φ (защото AC е ъглополовяща на ъгъл A). Ъглополовящата на ∠BAC сключва с AC ъгъл φ/2, а AC⊥BD, значи сключеният с BD ъгъл е 90°−φ/2=75° ⇒ φ=30° ⇒ ∠BAD=2φ=60°. Страната на ромба е a=84:4=21 cm, а △ABD (AB=AD=a, ∠BAD=60°) е равностранен, значи BD=a=21 cm.","alt":[],"visual":""},{"q":"Диагоналите на ромб са 16 cm и 12 cm. Намерете дължината на страната му.","answer":"10","hint":"Страната е хипотенуза на правоъгълен триъгълник с катети — половините на диагоналите.","solution":"a=√(8²+6²)=√100=10 cm.","alt":[],"visual":""},{"q":"Диагоналите на ромб са 24 cm и 10 cm. Намерете дължината на страната му.","answer":"13","hint":"Страната е хипотенуза с катети — половините на диагоналите.","solution":"a=√(12²+5²)=√169=13 cm.","alt":[],"visual":""}]}},"18":{"skill1":{"easy":[{"q":"Дадено е разпределението на учениците по оценки: оценка 3 — 4 ученици, оценка 4 — 6 ученици, оценка 5 — 8 ученици, оценка 6 — 2 ученици. Намерете общия брой ученици.","answer":"20","hint":"Събери честотите.","solution":"4+6+8+2=20.","alt":[],"visual":""},{"q":"Успехът на учениците в клас (общо 120) е даден в таблица: Слаб — 0, Среден — 12, Добър — 30, Мн. добър — 36, Отличен — 42. Какъв процент от учениците имат оценка „Много добър“?","answer":"30%","hint":"Разделете броя ученици с тази оценка на общия брой и умножете по 100%.","solution":"36:120=0,3=30%.","alt":["30"],"visual":""},{"q":"В таблица са дадени оценки и брой ученици: оценка 2→1 ученик, 3→2, 4→4, 5→2, 6→1 (общо 10 ученици). Намерете средния успех.","answer":"4","hint":"Умножете всяка оценка по броя ученици с нея, съберете резултатите и разделете на общия бр
